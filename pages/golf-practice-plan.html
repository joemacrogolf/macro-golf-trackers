<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: Macro Golf house style, same as the games and tests. Black cover band with yellow bar and stacked caps, black live board, white cards with yellow eyebrow labels, square corners */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --line:rgba(11,11,11,0.16); --fg:#0B0B0B; --muted:#77715F; --body:#3B3830;
  --ink:#0B0B0B; --on-ink:#F4F1EA; --on-ink-muted:#9C988C;
  --gold:#FFD900; --gold-ink:#8a7f00; --soft:#F4F1EA;
  --good:#1FA855; --warn:#F5A800; --bad:#E0352B;
  --display:"Anton","Arial Narrow",Impact,sans-serif; --text:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;border-radius:0}
body{background:var(--bg);color:var(--body);font-family:var(--text);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
.wrap{max-width:580px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--display);font-weight:400;text-transform:uppercase;letter-spacing:-.3px;margin:0;color:var(--fg);text-wrap:balance}
.tnum{font-variant-numeric:tabular-nums}
.muted{color:var(--muted);font-size:13px}
.label{font-size:11px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted)}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:2.4px;text-transform:uppercase;color:var(--gold-ink)}
button{font-family:var(--text);font-weight:700;border:0;padding:12px 16px;cursor:pointer;letter-spacing:.04em;color:var(--fg);background:transparent}
button:disabled{opacity:.4;cursor:not-allowed}
input,select{font-family:var(--text);color:var(--fg)}
input:focus-visible,select:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* cover */
.cover{background:var(--ink);color:var(--on-ink);padding:22px 22px 18px;display:flex;flex-direction:column;gap:16px}
.brand{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.brand .logo{height:34px;width:auto;display:block}
.brand .sub{font-size:10px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:rgba(244,241,234,.62)}
.goldbar{width:74px;height:7px;background:var(--gold)}
.cover h1{font-size:clamp(46px,14vw,68px);line-height:.94;letter-spacing:-1px;color:var(--on-ink)}
.cover h1 span{display:block}
.cover h1 .g{color:var(--gold);font-size:.46em;line-height:1.06;letter-spacing:-.3px;margin-top:6px}
.strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid rgba(244,241,234,.18);padding-top:12px}
.strip>div{display:flex;flex-direction:column;gap:2px;min-width:0;padding:0 10px;border-left:1px solid rgba(244,241,234,.18)}
.strip>div:first-child{padding-left:0;border-left:0}
.strip .k{font-size:10px;font-weight:700;letter-spacing:1.8px;text-transform:uppercase;color:var(--gold)}
.strip .v{font-family:var(--display);font-size:16px;line-height:1.15;text-transform:uppercase;color:var(--on-ink);overflow-wrap:anywhere}

/* section heads and cards */
.sec-h{display:flex;flex-direction:column;gap:6px}
.sec-h h2{font-size:28px;line-height:1.08}
.sec-h h2::after{content:"";display:block;width:74px;height:6px;background:var(--gold);margin-top:14px}
.card{background:var(--surface);border:1px solid var(--line);padding:20px;display:flex;flex-direction:column;gap:16px}
.q{display:flex;flex-direction:column;gap:8px}
.q .qh{font-weight:600;color:var(--fg);font-size:16px}
.q .qs{font-size:13px;color:var(--muted)}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld input,.fld select{font-size:18px;font-weight:600;padding:10px 12px;border:1px solid var(--line);background:var(--bg);width:100%;min-width:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* choice buttons */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--bg);padding:10px 14px;font-size:14px;color:var(--fg);display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--gold);border-color:var(--gold)}
.chip:disabled{text-decoration:line-through}
.lvl{display:grid;gap:10px}
.lvl button{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;background:var(--bg);border:1px solid var(--line);border-left:6px solid var(--line);padding:14px}
.lvl button b{font-family:var(--display);font-weight:400;font-size:20px;letter-spacing:-.3px;text-transform:uppercase;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lvl button small{font-weight:400;font-size:13px;color:var(--body);letter-spacing:0}
.lvl button[aria-pressed="true"]{border-color:var(--ink);border-left-color:var(--gold);background:var(--soft)}
.rec{font-family:var(--text);background:var(--ink);color:var(--gold);font-size:9px;letter-spacing:1.6px;padding:4px 7px;font-weight:700;text-transform:uppercase}
.recnote{font-size:13px;color:var(--fg);background:var(--soft);border-left:6px solid var(--gold);padding:10px 12px}
.yn{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line)}
.yn button{font-family:var(--display);font-weight:400;font-size:18px;text-transform:uppercase;color:var(--muted);background:var(--bg)}
.yn button+button{border-left:1px solid var(--line)}
.yn button[aria-pressed="true"]{background:var(--gold);color:var(--fg)}
.rangeRow{display:flex;align-items:center;gap:12px}
.rangeRow input[type=range]{flex:1;min-width:0;accent-color:var(--ink)}
.rangeRow output{font-family:var(--display);font-size:24px;color:var(--fg);min-width:84px;text-align:right}
.custom{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}
.custom input{font-size:16px;font-weight:600;padding:9px 10px;border:1px solid var(--line);width:100%;min-width:0}

.primary{background:var(--gold);color:var(--fg);font-family:var(--display);font-weight:400;font-size:20px;text-transform:uppercase;letter-spacing:.5px;padding:14px 18px}
.dark{background:var(--ink);color:var(--gold);font-family:var(--display);font-weight:400;font-size:18px;text-transform:uppercase;letter-spacing:.5px;padding:12px 16px}
.ghost{border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btns>*{flex:1}
.linky{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;font-weight:400;font-size:13px;letter-spacing:0}

/* plan preview */
.planlist{display:flex;flex-direction:column;border:1px solid var(--line)}
.planlist .row{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.planlist .row:first-child{border-top:0}
.planlist .n{font-family:var(--display);font-size:18px;color:var(--gold-ink)}
.planlist .t{font-weight:600;color:var(--fg);min-width:0}
.planlist .t small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.planlist .m{font-family:var(--display);font-size:16px;color:var(--fg)}
.planlist .row.done .n{color:var(--good)}
.planlist .row.cur{background:var(--soft);box-shadow:inset 6px 0 0 var(--gold)}

/* run: board */
.board{background:var(--ink);color:var(--on-ink);padding:16px 18px;display:grid;grid-template-columns:1fr auto;gap:4px 14px;align-items:end;border-left:6px solid var(--gold)}
.board .label{color:var(--gold)}
.board .big{font-family:var(--display);font-size:64px;line-height:.9;color:var(--on-ink)}
.board .side{text-align:right;display:flex;flex-direction:column;gap:2px}
.board .side b{font-family:var(--display);font-weight:400;font-size:22px;color:var(--on-ink)}
.prog{grid-column:1/-1;display:flex;gap:4px;margin-top:10px}
.prog i{flex:1;height:5px;background:rgba(244,241,234,.18)}
.prog i.on{background:var(--gold)}.prog i.cur{background:var(--on-ink)}
.bstat{grid-column:1/-1;font-size:13px;color:rgba(244,241,234,.85)}

.blockhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.blockhead h2{font-size:30px;line-height:1.02}
.mins{font-family:var(--display);font-size:26px;color:var(--fg);white-space:nowrap}
.mins small{font-family:var(--text);font-size:11px;font-weight:700;letter-spacing:1.6px;color:var(--muted);margin-left:3px}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;color:var(--body)}
.timer{display:flex;align-items:center;gap:12px;border:1px solid var(--line);padding:10px 12px}
.timer b{font-family:var(--display);font-size:32px;color:var(--fg);flex:1}
.viz{border:2px solid var(--ink);line-height:0}
.viz svg{display:block;width:100%;height:auto}
.vizcap{font-family:var(--display);font-size:20px;text-transform:uppercase;color:var(--fg);text-align:center;margin:0}
.tap{cursor:crosshair;touch-action:manipulation}

/* entries */
.bigin{display:grid;grid-template-columns:1fr auto;gap:10px}
.bigin input{font-size:30px;font-weight:700;padding:10px 14px;border:1px solid var(--line);width:100%;min-width:0}
.tally{display:flex;flex-wrap:wrap;gap:6px}
.tally span{font-size:13px;font-weight:700;padding:5px 9px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.tally span.ok{background:var(--good);border-color:var(--good);color:#fff}
.tally span.no{background:var(--bad);border-color:var(--bad);color:#fff}
.tally span.mid{background:var(--warn);border-color:var(--warn);color:var(--fg)}
.ladbar{position:relative;height:12px;background:var(--soft)}
.ladbar i{position:absolute;inset:0 auto 0 0;background:var(--gold)}
.okno{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.okno button{font-family:var(--display);font-weight:400;font-size:22px;text-transform:uppercase;padding:16px}
.okno .y{background:var(--good);color:#fff}.okno .x{background:var(--bad);color:#fff}
.zones{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.zones div{border:1px solid var(--line);padding:8px 2px;text-align:center;font-size:12px;font-weight:700;color:var(--muted)}
.zones div b{display:block;font-family:var(--display);font-weight:400;font-size:18px;color:var(--fg)}
.zones div.cur{border:2px solid var(--ink);background:var(--gold)}
.zones div.cur b{color:var(--fg)}
.call{background:var(--soft);padding:14px;display:flex;flex-direction:column;gap:4px}
.call .d{font-family:var(--display);font-size:56px;line-height:.9;color:var(--fg)}
.call .d small{font-size:22px;color:var(--muted);margin-left:4px}
.facts{display:flex;flex-wrap:wrap;gap:6px}
.facts span{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);padding:3px 7px;background:var(--bg);color:var(--fg)}
.facts span.hz{background:var(--ink);color:var(--gold);border-color:var(--ink)}
.seg{display:flex;border:1px solid var(--line)}
.seg button{flex:1;padding:10px 6px;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--gold)}
.lmrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lmrow input{font-size:24px;font-weight:700;padding:10px 12px;border:1px solid var(--line);width:100%;min-width:0}
.res7{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.res7 button{border:1px solid var(--line);background:var(--bg);padding:12px 4px;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:2px}
.res7 button b{font-family:var(--display);font-weight:400;font-size:20px}
.res7 button.hole{grid-column:1/-1;background:var(--good);color:#fff;border-color:var(--good)}
.leave{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.leave button{border:1px solid var(--line);background:var(--bg);padding:12px 2px;font-family:var(--display);font-weight:400;font-size:18px}
.leave button.hole{grid-column:1/-1;background:var(--good);color:#fff;border-color:var(--good);font-size:20px}
.flash{padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;color:#fff;animation:pop .35s ease}
.flash b{font-family:var(--display);font-weight:400;font-size:36px;line-height:1}
.flash span{font-size:14px}
.flash.p{background:var(--good)}.flash.m{background:var(--bad)}.flash.z{background:var(--ink)}
@keyframes pop{from{transform:scale(.97);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.flash{animation:none}}
.spd{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.spd div{border:1px solid var(--line);padding:10px;text-align:center}
.spd div b{display:block;font-family:var(--display);font-size:28px;color:var(--fg)}
.strikes{display:flex;gap:6px}
.strikes i{width:28px;height:28px;border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-weight:700}
.strikes i.on{background:var(--bad);border-color:var(--bad);color:#fff}

/* plan home */
.cover h1 .hi{font-family:var(--text);font-size:15px;font-weight:700;letter-spacing:.02em;text-transform:none;color:var(--gold);line-height:1.2;margin-bottom:10px}
.tests{display:flex;flex-direction:column;border:1px solid var(--line)}
.trow{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;padding:12px;border-top:1px solid var(--line)}
.trow:first-child{border-top:0}
.trow .tn{width:30px;height:30px;display:grid;place-items:center;font-family:var(--display);font-size:16px;background:var(--soft);color:var(--fg)}
.trow.ok .tn{background:var(--good);color:#fff}.trow.skip{background:var(--soft)}.trow.skip .tn{background:transparent;border:1px dashed var(--muted);color:var(--muted)}.trow.skip .tt b{color:var(--muted)}
.tsm{font-size:13px;padding:8px 12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);white-space:nowrap}.trow .ta{min-width:0}
.trow .ta .tbtn,.trow .ta .tsm{width:100%;text-align:center}
.trow .tt{min-width:0;display:flex;flex-direction:column}.trow .tt b{color:var(--fg)}.trow .tt small{color:var(--muted);font-size:12.5px}
.trow .ta{display:flex;flex-direction:column;align-items:stretch;gap:6px}
.tbtn{text-decoration:none;font-size:15px;padding:9px 14px}
.warnbox{background:#fff5bf;border-left:6px solid var(--gold);padding:12px 14px;font-size:14px;color:var(--fg)}
.warnbox b{display:block;font-size:11px;letter-spacing:1.6px;text-transform:uppercase;margin-bottom:3px}
.sess{border:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:12px;background:var(--bg)}
.sess.next{border:2px solid var(--ink);box-shadow:inset 6px 0 0 var(--gold)}
.sess.done{background:var(--soft)}
.sess .sh{display:flex;gap:12px;align-items:center}
.sess .sn{width:34px;height:34px;display:grid;place-items:center;background:var(--ink);color:var(--gold);font-family:var(--display);font-size:18px;flex:0 0 auto}
.sess.done .sn{background:var(--good);color:#fff}
.sess .st{display:flex;flex-direction:column;min-width:0}.sess .st b{font-family:var(--display);font-weight:400;font-size:20px;text-transform:uppercase;color:var(--fg);line-height:1.1}.sess .st small{color:var(--muted);font-size:12.5px}
.sess ul.sg{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.sess ul.sg li{display:flex;align-items:baseline;gap:8px;font-size:14px;color:var(--fg)}.sess ul.sg li small{color:var(--muted)}.sess ul.sg li span{margin-left:auto;font-family:var(--display);font-size:15px}
.why{display:flex;flex-direction:column;gap:5px}.why .wh{display:flex;justify-content:space-between;gap:10px;color:var(--fg)}.why .wh span{font-family:var(--display);font-size:16px}
.why .wbar{height:8px;background:var(--soft)}.why .wbar i{display:block;height:100%;background:var(--gold)}.why small{color:var(--body);font-size:13px}
.playbtn{display:block;text-align:center;text-decoration:none;font-family:var(--display);font-weight:400;font-size:20px;text-transform:uppercase;letter-spacing:.5px;padding:14px 18px}
a.ghost.playbtn{border:1px solid var(--line);color:var(--fg)}
details.card>summary{list-style:none}details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:" +";color:var(--gold-ink)}details.card[open]>summary::after{content:" –"}
/* report */
.verdict{background:var(--ink);color:var(--on-ink);padding:20px;display:flex;flex-direction:column;gap:8px;border-left:6px solid var(--gold)}
.verdict .k{font-size:11px;font-weight:700;letter-spacing:1.8px;text-transform:uppercase;color:var(--gold)}
.verdict .hc{font-family:var(--display);font-size:72px;line-height:.9;color:var(--on-ink)}
.verdict .pill{align-self:flex-start;font-size:11px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;padding:5px 10px}
.pill.g{background:var(--good);color:#fff}.pill.a{background:var(--warn);color:var(--fg)}.pill.r{background:var(--bad);color:#fff}
.verdict p{margin:0;color:rgba(244,241,234,.88)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line)}
.stats div{padding:12px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:2px;min-width:0}
.stats div:first-child{border-left:0}
.stats b{font-family:var(--display);font-weight:400;font-size:28px;color:var(--fg);line-height:1}
.up{color:var(--good)}.down{color:var(--bad)}
.grid{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:8px 6px;text-align:left;border-bottom:1px solid var(--line);font-size:14px;color:var(--fg)}
th{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;font-weight:700;background:var(--soft)}
td.r,th.r{text-align:right}
.cta{background:var(--ink);color:var(--on-ink);padding:18px 20px;display:flex;flex-direction:column;gap:6px;border-bottom:6px solid var(--gold)}
.cta b{font-family:var(--display);font-weight:400;font-size:22px;letter-spacing:.3px;text-transform:uppercase;line-height:1.1}
.cta b span{color:var(--gold)}
.cta small{color:var(--on-ink-muted);font-size:11px;letter-spacing:2px;font-weight:700;text-transform:uppercase}
.resume{border:2px solid var(--ink);background:var(--soft);padding:14px;display:flex;flex-direction:column;gap:10px}
@media (max-width:380px){.stats b{font-size:22px}.call .d{font-size:46px}}
</style>

<script id="mgplanLib">/* =====================================================================
   Macro Golf plan engine
   Turns test results + the pre-test audit into a weekly practice plan,

   Runs in the browser (inside each test) and in Node (for the app's
   server to build the emailed report). No dependencies.
   ===================================================================== */
(function(root){
"use strict";

/* ---------- Putting baseline: average putts to hole out, by level ---------- */
var PT={grid:[2,3,4,5,6,8,10,12,15,20,25,30,40,50,60],tab:{
 "Tour":[1.01,1.04,1.13,1.23,1.34,1.5,1.61,1.68,1.78,1.87,1.93,1.98,2.06,2.14,2.21],

 "25":[1.09,1.262,1.463,1.623,1.73,1.906,2.028,2.088,2.158,2.253,2.315,2.376,2.438,2.487,2.532],
 "30":[1.11,1.294,1.517,1.687,1.793,2.03,2.152,2.216,2.281,2.389,2.445,2.486,2.544,2.596,2.656]}};
var LVN=[["Tour",-5],["0",0],["5",5],["10",10],["15",15],["20",20],["25",25],["30",30]];
function rowE(row,ft){const g=PT.grid;if(ft<=1)return 1;if(ft<=g[0])return 1+(row[0]-1)*(ft-1)/(g[0]-1);
  for(let i=1;i<g.length;i++)if(ft<=g[i])return row[i-1]+(row[i]-row[i-1])*(ft-g[i-1])/(g[i]-g[i-1]);
  const n=g.length;return row[n-1]+(row[n-1]-row[n-2])/(g[n-1]-g[n-2])*(ft-g[n-1])}
function puttE(n,ft){let i=1;while(i<LVN.length-1&&n>LVN[i][1])i++;const a=LVN[i-1],b=LVN[i],t=(n-a[1])/(b[1]-a[1]);
  const ea=rowE(PT.tab[a[0]],ft),eb=rowE(PT.tab[b[0]],ft);return Math.max(1,ea+(eb-ea)*t)}
/* rough make rate from a distance: holed, or two putts from the leave */
function makeRate(n,ft){return Math.max(0.02,Math.min(0.99,1-(puttE(n,ft)-1)/Math.max(1.0,puttE(n,Math.max(1.5,ft*0.12)))))}

/* ---------- Helpers ---------- */
var num=h=>h==="Tour"?-5:typeof h==="number"?h:parseFloat(h);
function hcLabel(n){if(n===null||n===undefined||isNaN(n))return"–";const r=Math.round(n);if(r<=-5)return"Tour";if(r<0)return"+"+(-r);if(r===0)return"Scratch";return (r>36?"36+":r)+" hc"}
function targetLabel(h){return h==="Tour"?"Tour":String(h)==="0"?"Scratch":h+" hc"}
var sgn=(x,d=2)=>{const r=Math.abs(x).toFixed(d);return parseFloat(r)===0?r:(x>=0?"+":"−")+r};
var esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
var sum=a=>a.reduce((x,y)=>x+y,0);
var pct=x=>Math.round(x*100)+"%";

/* ---------- The games a plan can prescribe ---------- */
var GAMES={
 holeout:{name:"Hole Out",mins:15,url:"https://claude.ai/artifact/3F9UXNF3Km2fo6hwojPdNa",what:"24 putts from 3, 4 and 5 ft, from four sides of the hole"},
 insanity:{name:"Insanity",mins:15,url:"https://claude.ai/artifact/DdYgcWAtcstiX6SbbCfqts",what:"20 putts from 6–12 ft"},
 ms12:{name:"Money Stealers",set:"12–24 ft",mins:20,url:"https://claude.ai/artifact/Tu21tdJcuXUx4BzWWTHT4A",what:"Pace control: finish every putt between 1 ft short and 2 ft past"},

 corridor:{name:"Driver Corridor",mins:20,url:"https://claude.ai/artifact/RH7TcnpgzwGA7sxBhGFz2H",what:"Tee shots into a fairway corridor",sim:true},
 strikes:{name:"3 Strikes",mins:15,url:"https://claude.ai/artifact/AbYYqBxzAq2GC14y3zy2ob",what:"Speed training: push club speed up before you run out of strikes"}
};
var TESTS={
 putting:{name:"Putting Test",url:"https://claude.ai/artifact/2dijvxGV7SRMGpkRrHS7V1",group:"Putting"},
 short:{name:"Short Game Test",url:"https://claude.ai/artifact/Ry4s5HZNJTACC6rEcZTDVR",group:"Short game"},

/* ---------- Areas: how often each comes up in a round, and the game that trains it ----------

var AREAS={

 "putt.m":  {group:"Putting",name:"Putts from 6–10 ft",freq:4,game:"insanity",unit:"putt"},

 "sg.slope": {group:"Short game",name:"Awkward lies",freq:1,game:"par18",unit:"shot"},

 "lg.wedge":{group:"Approach",name:"Wedges and short irons",freq:5,game:"darts",unit:"shot"},
 "lg.mid":  {group:"Approach",name:"Mid irons",freq:4,game:"lava",unit:"shot"},
 "lg.long": {group:"Approach",name:"Long irons and hybrids",freq:3,game:"lava",unit:"shot"},
 "lg.fwg":  {group:"Approach",name:"Fairway clubs into the green",freq:1,game:"lava",unit:"shot"},
 "lg.fwt":  {group:"Driving",name:"Fairway clubs off the tee",freq:2,game:"corridor",unit:"shot"},
 "lg.drv":  {group:"Driving",name:"Driver accuracy",freq:11,game:"corridor",unit:"drive"},
 "lg.speed":{group:"Driving",name:"Driver distance",freq:11,game:"strikes",unit:"drive"}
};
var GROUPS=["Driving","Approach","Short game","Putting"];
var GROUP_TEST={"Driving":"long","Approach":"long","Short game":"short","Putting":"putting"};

/* =====================================================================
   1. Leaks: one entry per area tested.
      Each test hands in {key, n, per (strokes gained per shot vs the
      target handicap), you, level} and gets back perRound.
   ===================================================================== */
function leaks(list){
  return list.filter(x=>AREAS[x.key]&&x.n>0).map(x=>{const a=AREAS[x.key];
    return Object.assign({},x,{area:a,name:a.name,group:a.group,freq:a.freq,game:a.game,perRound:x.per*a.freq})});
}

/* =====================================================================
   2. The plan. Practice time goes where the shots are.
   ===================================================================== */
function build(allLeaks,audit){
  const sessions=Math.max(1,Math.min(7,+audit.sessions||2)),mins=Math.max(15,+audit.minutes||60);
  const weekly=sessions*mins,simOk=audit.sim!==false;
  const losses=allLeaks.filter(l=>l.perRound<=-0.05).sort((a,b)=>a.perRound-b.perRound);
  const strengths=allLeaks.filter(l=>l.perRound>=0.05).sort((a,b)=>b.perRound-a.perRound);
  const totalLoss=-sum(losses.map(l=>l.perRound));
  /* group losses by the game that trains them */
  const byGame={};losses.forEach(l=>{let g=l.game;if(GAMES[g].sim&&!simOk)g=l.group==="Approach"?"bank":g==="corridor"?"strikes":g;
    (byGame[g]=byGame[g]||{game:g,leaks:[],loss:0});byGame[g].leaks.push(l);byGame[g].loss+=-l.perRound});
  let ranked=Object.values(byGame).sort((a,b)=>b.loss-a.loss);
  /* keep the games that cover most of the shots lost, up to what the week can hold */
  const maxGames=Math.max(1,Math.min(4,Math.floor(weekly/20)));
  const chosen=[];let cov=0;
  for(const g of ranked){if(chosen.length>=maxGames)break;if(chosen.length&&cov>=totalLoss*0.85)break;chosen.push(g);cov+=g.loss}
  /* nothing lost: keep the weakest area sharp */
  if(!chosen.length&&allLeaks.length){const w=allLeaks.slice().sort((a,b)=>a.perRound-b.perRound)[0];chosen.push({game:w.game,leaks:[w],loss:0,maintain:true})}
  /* plays per week in proportion to shots lost, at least one each, within the week's minutes */
  const avg=chosen.length?sum(chosen.map(c=>GAMES[c.game].mins))/chosen.length:20;
  let plays=Math.max(chosen.length,Math.floor(weekly/avg));
  const W=sum(chosen.map(c=>c.loss))||1;
  chosen.forEach(c=>{c.plays=Math.max(1,Math.round(c.loss/W*plays))});
  const used=()=>sum(chosen.map(c=>c.plays*GAMES[c.game].mins));
  while(used()>weekly){const c=chosen.slice().reverse().find(x=>x.plays>1);if(!c)break;c.plays--}
  while(chosen.length&&used()+GAMES[chosen[0].game].mins<=weekly){const c=chosen.slice().sort((a,b)=>a.plays/a.loss-b.plays/b.loss)[0];if(used()+GAMES[c.game].mins>weekly)break;c.plays++}
  chosen.forEach(c=>{c.share=totalLoss?c.loss/totalLoss:0;c.minutes=c.plays*GAMES[c.game].mins});
  /* lay the plays out over the week's sessions */
  const queue=[];const tmp=chosen.map(c=>({c,left:c.plays}));
  while(tmp.some(t=>t.left>0))tmp.forEach(t=>{if(t.left>0){queue.push(t.c);t.left--}});
  const week=Array.from({length:sessions},()=>({games:[],mins:0}));
  queue.forEach(c=>{const m=GAMES[c.game].mins,byMin=(a,b)=>a.mins-b.mins;let s=week.filter(x=>x.mins+m<=mins&&!x.games.includes(c.game)).sort(byMin)[0]||week.filter(x=>x.mins+m<=mins).sort(byMin)[0]||week.slice().sort(byMin)[0];s.games.push(c.game);s.mins+=m});
  const gain=0.5*sum(chosen.map(c=>c.loss));
  return {sessions,mins,weekly,chosen,losses,strengths,totalLoss,gain,week:week.filter(s=>s.games.length),retestWeeks:6};
}

/* the reasoning line for one prescribed game */
function why(c,target){
  const T=targetLabel(target);
  return c.leaks.map(l=>`${l.name}: ${sgn(l.per)} per ${l.area.unit} against ${T}. These come up ${l.freq===1?"about once a round":l.freq<1?"about once every "+Math.round(1/l.freq)+" rounds":"about "+l.freq+" times a round"}, so that's ${Math.abs(l.perRound).toFixed(1)} shots a round.`+(l.you?` ${l.you}.`:"")+(l.level?` ${l.level}.`:""));
}

function report(ctx){
  /* ctx: {player, date, coach, target, test:"putting"|"short"|"long", result:{hc, sg, n, prevHc, prevDate, headline}, leaks, audit, logo} */
  const T=targetLabel(ctx.target),test=TESTS[ctx.test],plan=build(ctx.leaks,ctx.audit||{}),A=ctx.audit||{},TL=ctx.testLeaks||ctx.leaks;
  const srcs=[...new Set(ctx.leaks.map(l=>l.test).filter(Boolean))].map(k=>TESTS[k].name);
  const date=ctx.date||new Date().toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"});
  const name=esc(ctx.player||"Player"),logo=ctx.logo?`<img src="${ctx.logo}" alt="Macro Golf" style="height:34px">`:`<b style="font-family:Anton,Impact;color:#FFD900;font-size:22px">MACRO GOLF</b>`;
  let page=0;const total=7;
  const run=()=>`<div class="run"><span>${name} · Your ${esc(test.name)} report</span><span>Macro Golf</span></div>`;
  const foot=()=>`<div class="foot"><span>${esc(test.name)} · ${esc(date)}</span><b>macro.golf · ${String(++page+1).padStart(2,"0")} / ${String(total).padStart(2,"0")}</b></div>`;
  const losses=plan.losses,strengths=plan.strengths;
  const worst=losses[0],best=strengths[0];
  /* group view for "what you thought" */
  const tested=[...new Set(ctx.leaks.map(l=>l.group))];
  const groupLoss=g=>-sum(ctx.leaks.filter(l=>l.group===g).map(l=>l.perRound));
  const thought=A.weakest&&GROUP_TEST[A.weakest]?A.weakest:null;
  let vsText;
  if(!thought)vsText=`You weren't sure which part of your game costs you most. This test found ${worst?`<b>${esc(worst.name.toLowerCase())}</b> costing the most`:"no clear leak"}.`;
  else if(!tested.includes(thought))vsText=`This test measures ${esc(tested.join(" and ").toLowerCase())}, not ${esc(thought.toLowerCase())}. Take the <b>${esc(TESTS[GROUP_TEST[thought]].name)}</b> to check it.`;
  else{const gl=groupLoss(thought);vsText=worst&&worst.group===thought?`The test agrees. ${esc(worst.name)} is where most shots went.`:gl>0.1?`${esc(thought)} does cost you ${gl.toFixed(1)} shots a round, but ${worst?esc(worst.name.toLowerCase())+" costs more":"nothing stood out more"}.`:`${esc(thought)} is not costing you shots against your target in this test.`}

  /* ---- page 1: cover ---- */
  let h=`<section class="pg dark cov"><div class="top">${logo}<span>Individual practice report</span></div>
  <div class="mid"><div class="bar" style="width:78px;height:8px;margin:0"></div><div class="nm">${name.split(" ").join("<br>")}</div><div class="tt">Your ${esc(test.name)} report</div>
  <p class="lede">What your test measured, where your shots are going, and the practice plan built from it: what to play, how often, and why.</p></div>
  <div class="facts"><div><small>Test handicap</small><b>${hcLabel(ctx.result.hc)}</b></div><div><small>Target</small><b>${esc(T)}</b></div><div><small>Shots a round vs target</small><b>${sgn(sum(TL.map(l=>l.perRound)),1)}</b></div>
  <div><small>Test date</small><b class="s">${esc(date)}</b></div><div><small>Coach</small><b class="s">${esc(ctx.coach||"Macro Golf")}</b></div><div><small>Retest</small><b class="s">In ${plan.retestWeeks} weeks</b></div></div></section>`;

  /* ---- page 2: purpose + where you are ---- */
  h+=`<section class="pg">${run()}<div class="eb">01 / The report</div><h2>What this report does</h2><div class="bar"></div>
  <p>This report takes your ${esc(test.name)} and turns it into practice. Every shot you hit was scored against what a ${esc(T)} golfer would expect from the same position. That tells us, shot by shot, where you gain and where you lose.</p>
  <p>We then work out how often each of those shots comes up in a real round. A small loss on a shot you face eleven times a round matters more than a big loss on one you face once. Your practice time is split the same way: most time where most shots are lost.</p>

  <div class="eb">03 / The question</div><h2>What you thought, what we measured</h2><div class="bar"></div>
  <div class="vs"><div class="a"><small>What you told us</small><b>${esc(thought||"Not sure")}</b><p>The part of your game you felt was costing you most.</p></div>
  <div class="b"><small>What we measured</small><b>${worst?esc(worst.name):"No clear leak"}</b><p>${worst?`${Math.abs(worst.perRound).toFixed(1)} shots a round against ${esc(T)}.`:`Every area was within 0.05 shots a round of ${esc(T)}.`}</p></div></div>

  /* ---- page 3: where the shots go ---- */
  const L=TL.slice().sort((a,b)=>a.perRound-b.perRound),mx=Math.max(0.3,...L.map(l=>Math.abs(l.perRound)));
  h+=`<section class="pg">${run()}<div class="eb">04 / Your result</div><h2>${esc(ctx.result.headline||"What the test found")}</h2><div class="bar"></div>
  <p>Strokes gained per shot is how much better or worse each shot left you than a ${esc(T)} golfer from the same spot. Plus is better than your target, minus is worse. Shots a round multiplies that by how often each shot comes up on the course.</p>
  <table><thead><tr><th>Area</th><th>Shots</th><th>Per shot</th><th>A round</th><th>Shots a round</th></tr></thead><tbody>

  ${(()=>{const lo=-sum(L.filter(l=>l.perRound<0).map(l=>l.perRound)),ga=sum(L.filter(l=>l.perRound>0).map(l=>l.perRound));return `<p class="src" style="margin-top:-6px">Shots lost ${lo.toFixed(1)} · shots gained ${ga.toFixed(1)} · overall ${sgn(ga-lo,1)} a round.${L.some(l=>l.key==="lg.speed")?" *Driver distance is worked out from the same drives as driver accuracy, so they're only counted once in the shots total.":""}</p>`})()}
  <div class="eb">Shots a round against ${esc(T)}</div>

  if(f==="pace")return {type:"count",id:"drill",title:"Lag ladder",mins:m,total:r5(m*1.5),res:[],viz:"lag",cap:"Finish inside a putter length",lines:["Putt to 20, 30 and 40 ft, then repeat.","Tick if it finishes within a putter length of the hole."]};
  return {type:"count",id:"drill",title:"Gate drill",mins:m,total:r5(m*1.5),res:[],viz:"gate",cap:"Through the gate",lines:["Two tees just wider than the ball, a putter head in front of it.",f==="short"?"Putt from 4 ft. Tick if it goes through the gate.":"Putt from 8 ft. Tick if it goes through the gate."]};
}
function game(c,m){

  if(heat&&hits.length)g+=`<g filter="url(#fcSoft)">${hits.map(h=>`<circle cx="${h.x}" cy="${h.y}" r="20" fill="url(#fcHeat)"/>`).join("")}</g>`;
  g+=`</g><path d="${FACE}" fill="none" stroke="#6f757d" stroke-width="1.6"/><path d="M92 43 L221 60" stroke="#ffffff" stroke-width="1.6" opacity=".9" stroke-linecap="round"/>`;
  /* the middle of the face */
  g+=`<rect x="108" y="74" width="62" height="40" rx="12" fill="none" stroke="#0B0B0B" stroke-width="1.2" stroke-dasharray="4 4" opacity=".45"/>`;

  /* strikes: numbered marks, the latest one ringed in yellow */
  hits.forEach((h,i)=>{const last=i===hits.length-1;g+=(last?`<circle cx="${h.x}" cy="${h.y}" r="11" fill="none" stroke="#FFD900" stroke-width="2.5"/>`:"")+
    `<circle cx="${h.x}" cy="${h.y}" r="7" fill="#0B0B0B" stroke="#ffffff" stroke-width="1.5"/>`+T(h.x,h.y+3,i+1,{s:8,c:"#FFFFFF"})});

function faceZone(h){const hz=h.x<108?"Toe":h.x>170?"Heel":"Centre",vz=h.y<74?"high":h.y>114?"low":"";return {hz,vz,centre:hz==="Centre"&&!vz}}

function missing(c){
  const as=c.areas||[];
  if(!as.length)return "Choose an area";
  if(FAM[as[0]]==="long"&&c.lm===null)return "Answer the launch monitor question";
  if(as.includes("app")&&!c.zones.length)return "Pick at least one distance";
  if(as.includes("short")&&c.bunker===null)return "Answer the bunker question";
  for(const a of ORDER)if(as.includes(a)&&!fl(c,a).length)return "Choose what to work on"+(as.length>1?" for "+AREAS[a].toLowerCase():"");
  return null;
}
function planList(B,cur){return `<div class="planlist">${B.map((b,i)=>`<div class="row ${i<cur?"done":""} ${i===cur?"cur":""}"><span class="n">${i<cur?"✓":String(i+1).padStart(2,"0")}</span><span class="t">${b.title}<small>${blockSub(b)}</small></span><span class="m">${b.mins} min</span></div>`).join("")}</div>`}
function blockSub(b){return ({play:()=>"Real game · counts on the leaderboard",tick:()=>b.id==="body"?"Same for everyone":b.id==="tech"?"Your own focus":b.id==="pwarm"?"Feel the pace":"Finish well",ladder:()=>"7 to 8 shots",strike:()=>b.balls+" balls · tap the face",zones:()=>(b.zones.length*b.rounds)+" balls · tick or cross",count:()=>b.total+" balls · tick or cross",carry:()=>b.targets.length+" balls · carry the number",speed:()=>"Until 3 strikes",game:()=>b.shots.length+" shots · strokes gained"})[b.type]()}
function historyHTML(){if(!LOGS.length)return "";
  return `<section class="sec-h"><span class="eyebrow">Your sessions</span><h2>Practice history</h2></section><div class="card"><div class="stats"><div><span class="label">Streak</span><b>${streak()} day${streak()===1?"":"s"}</b></div><div><span class="label">Sessions</span><b>${LOGS.length}</b></div><div><span class="label">This week</span><b>${LOGS.filter(l=>Date.now()-l.t<7*864e5).length}</b></div></div>
   <div class="grid"><table><thead><tr><th>Date</th><th>Area</th><th class="r">Played like</th><th class="r">SG</th></tr></thead><tbody>${LOGS.slice(0,8).map(l=>`<tr><td>${new Date(l.t).toLocaleDateString("en-GB",{day:"numeric",month:"short"})}</td><td>${l.areas?areaNames(l.areas):AREAS[l.area]}</td><td class="r">${l.plan?"Plan":hcTxt(l.hc)}</td><td class="r ${l.sg==null?"":l.sg>=0?"up":"down"}">${l.sg==null?"–":fmt(l.sg)}</td></tr>`).join("")}</tbody></table></div></div>`}
function streak(){const days=new Set(LOGS.map(l=>new Date(l.t).toDateString()));let n=0,d=new Date();if(!days.has(d.toDateString()))d.setDate(d.getDate()-1);while(days.has(d.toDateString())){n++;d.setDate(d.getDate()-1)}return n}
const esc=s=>String(s||"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
function bindSetup(){const c=draft;
  const on=(id,ev,f)=>{const e=$(id);if(e)e.addEventListener(ev,f)};

/* ---------- running a session ---------- */
function startSession(){const c=JSON.parse(JSON.stringify(draft));S={step:"run",cfg:c,blocks:build(c),bi:0,t0:Date.now()};ui={};save();render();window.scrollTo(0,0)}
function cur(){return S.blocks[S.bi]}
function games(){return S.blocks.filter(b=>b.type==="game")}
function combo(list){list=list||games();return {shots:[].concat(...list.map(g=>g.shots.slice(0,g.res.length))),res:[].concat(...list.map(g=>g.res))}}
function renderRun(){
  const c=S.cfg,b=cur();strip(c);

  let h=S.plan?`<div class="board"><div><span class="label">Session ${S.plan.idx+1} of ${S.plan.n} this week</span><div class="big tnum">${S.bi+1}<small style="font-size:.4em;color:var(--on-ink-muted)"> / ${S.blocks.length}</small></div></div>

    <div class="bstat">Block ${S.bi+1} of ${S.blocks.length}: ${b.title}.${b.type==="play"?" Your score counts on the leaderboard.":""}</div></div>`:`<div class="board"><div><span class="label">Strokes gained · ${games().length>1?"games":"game"}</span><div class="big tnum">${n?fmt(sg):"0.0"}</div></div>
    <div class="side"><span class="label">Playing like</span><b>${n?hcTxt(playsLike(g)):"–"}</b></div>
    <div class="prog">${S.blocks.map((x,i)=>`<i class="${i<S.bi?"on":i===S.bi?"cur":""}"></i>`).join("")}</div>
    <div class="bstat">Block ${S.bi+1} of ${S.blocks.length}: ${b.title}. Plus is better than ${hcName(c.target)}, minus is worse.</div></div>`;
  h+=`<div class="card"><div class="blockhead"><div style="min-width:0"><span class="eyebrow">${String(S.bi+1).padStart(2,"0")} / ${blockSub(b)}</span><h2>${b.title}</h2></div><span class="mins">${b.mins}<small>MIN</small></span></div>`;
  h+=({tick:runTick,ladder:runLadder,strike:runStrike,zones:runZones,count:runCount,carry:runCarry,speed:runSpeed,game:runGame,play:runPlay})[b.type](b,c);
  h+=`</div><div class="btns"><button class="ghost" data-act="back" ${S.bi===0?"disabled":""}>Previous block</button><button class="ghost" data-act="skip">${S.bi===S.blocks.length-1?"Finish session":"Skip this block"}</button></div>`;
  h+=`<details class="card"><summary class="label" style="cursor:pointer">Your plan</summary>${planList(S.blocks,S.bi)}<button class="linky" data-act="quit">End session and see the report</button></details>`;
  app.innerHTML=h;bindRun(b);
}
const lines=b=>b.lines?`<ul class="steps">${b.lines.map(l=>`<li>${l}</li>`).join("")}</ul>`:"";
function nextBtn(label,dis){return `<button class="primary" data-act="next" ${dis?"disabled":""}>${label||"Done, next block"}</button>`}
function runTick(b){return lines(b)+(b.video?`<button class="dark playbtn" data-act="vid">▶ Play the 5 minute warm up</button>`:"")+(b.timer?`<div class="timer"><b class="tnum" id="tmr">${mmss(timerLeft(b))}</b><button class="dark" data-act="timer">${ui.timer?"Pause":"Start timer"}</button></div>`:"")+nextBtn("✓ Done, next block")}
function timerLeft(b){if(b.left===undefined)b.left=b.mins*60;return b.left}
const mmss=s=>Math.floor(s/60)+":"+String(Math.max(0,Math.floor(s%60))).padStart(2,"0");
function runLadder(b){const last=b.shots[b.shots.length-1],top=last?last.c:0,hits=b.shots.filter(s=>s.ok).length,done=top>=70;
  return `<ul class="steps"><li>Start with a short chip. Every shot must carry to where the last ball finished.</li><li>Each shot gets longer and the target changes every time, until you reach 70 yds.</li></ul>
   <div class="call"><span class="label">${last?"Carry it to where your last ball finished":"First shot"}</span><div class="d tnum">${last?last.c+"<small>yds</small>":"Short chip"}</div></div>
   <div class="ladbar"><i style="width:${Math.min(100,top/70*100)}%"></i></div><span class="muted">${top} of 70 yds · ${hits} of ${b.shots.length-(b.shots.length?1:0)} carried to the last ball</span>
   ${b.shots.length?`<div class="tally">${b.shots.map(s=>`<span class="${s.ok===null?"":s.ok?"ok":"no"}">${s.c}</span>`).join("")}</div>`:""}
   ${done?nextBtn("✓ 70 yds reached, next block"):`<div class="bigin"><input id="ladIn" inputmode="numeric" placeholder="Carry (yds)" aria-label="Carry in yards"><button class="dark" data-act="ladAdd">Enter</button></div>${S.cfg.lm?"":`<span class="muted">No launch monitor: use your best read off the flags.</span>`}`}
   ${b.shots.length?`<button class="linky" data-act="ladUndo">Undo last</button>`:""}`}
function runStrike(b){const n=b.hits.length,done=n>=b.balls;
  return (b.lines?lines(b):`<ul class="steps"><li>Strike set up station: low point check and strike spray (foot spray works too).</li></ul>`)+
   `<div class="call"><span class="label">${done?"Your strike map":"Ball "+(n+1)+" of "+b.balls}</span><span class="muted" style="font-size:14px">${done?faceSummary(b.hits):"Tap where it came off the face."}</span></div>
   <div class="viz" id="face">${faceSVG(b.hits,done||n>=3)}</div>${n?`<span class="muted">${faceSummary(b.hits)}</span><button class="linky" data-act="faceUndo">Undo last</button>`:""}`+nextBtn(done?"✓ Next block":"Tap the face "+(b.balls-n)+" more time"+(b.balls-n===1?"":"s"),!done)}
function runZones(b){const tot=b.zones.length*b.rounds,n=b.res.length,done=n>=tot,zi=n%b.zones.length,hit=b.res.filter(Boolean).length;
  return lines(b)+`<div class="zones">${b.zones.map((z,i)=>`<div class="${!done&&i===zi?"cur":""}"><b>${i+1}</b>${z[0]}–${z[1]}</div>`).join("")}</div>
   <div class="call"><span class="label">${done?"Ladder done":"Ball "+(n+1)+" of "+tot+" · trip "+(Math.floor(n/b.zones.length)+1)}</span><div class="d">${done?hit+"<small>of "+tot+"</small>":"Zone "+(zi+1)+"<small>"+b.zones[zi][0]+"–"+b.zones[zi][1]+" yds</small>"}</div></div>
   ${done?"":`<div class="okno"><button class="y" data-act="zr" data-v="1">✓ In</button><button class="x" data-act="zr" data-v="0">✕ Out</button></div>`}
   ${n?`<div class="tally">${b.res.map(r=>`<span class="${r?"ok":"no"}">${r?"✓":"✕"}</span>`).join("")}</div><button class="linky" data-act="zUndo">Undo last</button>`:""}`+nextBtn(done?"✓ Next block":"Finish early",false)}
function runCount(b){const n=b.res.length,done=n>=b.total,hit=b.res.filter(Boolean).length;
  return `<div class="viz">${vizSVG(b.viz,b)}</div><p class="vizcap">${b.cap}</p>`+lines(b)+
   `<div class="call"><span class="label">${done?"Done":"Ball "+(n+1)+" of "+b.total}</span><div class="d tnum">${b.calls&&!done?b.calls[n]:hit+"<small>of "+n+"</small>"}</div></div>
   ${done?"":`<div class="okno"><button class="y" data-act="cr" data-v="1">✓ Yes</button><button class="x" data-act="cr" data-v="0">✕ No</button></div>`}
   ${n?`<div class="tally">${b.res.map(r=>`<span class="${r?"ok":"no"}">${r?"✓":"✕"}</span>`).join("")}</div><button class="linky" data-act="cUndo">Undo last</button>`:""}`+nextBtn(done?"✓ Next block":"Finish early")}
const carryPts=(t,c)=>{const e=Math.abs(c-t);return e<=3?3:e<=6?2:e<=9?1:0};
function runCarry(b){const n=b.res.length,done=n>=b.targets.length,pts=sum(b.res.map((c,i)=>carryPts(b.targets[i],c)));
  return `<ul class="steps"><li>Carry the ball the exact number on screen.</li><li>Within 3 yds scores 3, within 6 scores 2, within 9 scores 1.</li></ul>
   <div class="call"><span class="label">${done?"Score":"Ball "+(n+1)+" of "+b.targets.length}</span><div class="d tnum">${done?pts+"<small>of "+b.targets.length*3+"</small>":b.targets[n]+"<small>yds</small>"}</div></div>
   ${ui.flash?flashHTML():""}
   ${done?"":`<div class="bigin"><input id="carIn" inputmode="numeric" placeholder="Carry (yds)" aria-label="Carry in yards"><button class="dark" data-act="carAdd">Enter</button></div>`}
   ${n?`<div class="tally">${b.res.map((c,i)=>{const p=carryPts(b.targets[i],c);return `<span class="${p>=2?"ok":p===1?"mid":"no"}">${b.targets[i]}→${c}</span>`}).join("")}</div><span class="muted">${pts} points so far</span><button class="linky" data-act="carUndo">Undo last</button>`:""}`+nextBtn(done?"✓ Next block":"Finish early")}
function runSpeed(b){const best=b.base.length?Math.max(...b.base,...b.swings.filter(x=>x.up).map(x=>x.v)):0,st=b.swings.filter(x=>x.strike).length,inBase=b.base.length<5,over=st>=3;
  return `<ul class="steps"><li>${inBase?"Hit 5 balls with maximum intent. Your fastest becomes the number to beat.":"Beat the number. Slower is a strike. Three strikes and you're done."}</li></ul>
   <div class="seg"><button data-act="metric" data-v="club" ${pr(b.metric==="club")}>Club speed</button><button data-act="metric" data-v="ball" ${pr(b.metric==="ball")}>Ball speed</button></div>
   <div class="spd"><div><span class="label">To beat</span><b class="tnum">${best||"–"}</b></div><div><span class="label">Swings</span><b class="tnum">${b.base.length+b.swings.length}</b></div><div><span class="label">Strikes</span><div class="strikes" style="justify-content:center">${[0,1,2].map(i=>`<i class="${i<st?"on":""}">${i<st?"✕":""}</i>`).join("")}</div></div></div>
   ${over?`<div class="call"><span class="label">Top speed</span><div class="d">${best}<small>mph</small></div></div>`:`<div class="bigin"><input id="spdIn" inputmode="decimal" placeholder="${inBase?"Warm-up ball "+(b.base.length+1)+" (mph)":"Speed (mph)"}" aria-label="Speed in mph"><button class="dark" data-act="spdAdd">Enter</button></div>`}
   ${b.base.length||b.swings.length?`<button class="linky" data-act="spdUndo">Undo last</button>`:""}`+nextBtn(over?"✓ Next block":"Finish early")}

/* the strokes gained game */
function playsLike(g){const k=g.res.length;if(!k)return null;let lo=-12,hi=45;for(let i=0;i<40;i++){const mid=(lo+hi)/2;if(sum(g.res.map((r,j)=>shotSG(g.shots[j],r,mid).sg))>0)hi=mid;else lo=mid}return (lo+hi)/2}
function flashHTML(){const f=ui.flash;return `<div class="flash ${f.cls}"><span>${f.txt}</span><b>${f.big}</b></div>`}
function runGame(b,c){const n=b.res.length;
  if(n>=b.shots.length)return `<p style="margin:0">All ${b.shots.length} shots done.</p>${ui.flash?flashHTML():""}`+nextBtn("✓ Next block");
  const s=b.shots[n];let h=`<ul class="steps"><li>Play every shot with your full routine. One ball each.</li></ul><div class="call"><span class="label">Shot ${n+1} of ${b.shots.length}</span>`;
  if(s.kind==="app")h+=`<div class="d tnum">${s.d}<small>yds</small></div><div class="facts"><span>Fairway lie</span><span>Flag ${s.d} yds</span>${s.haz?`<span class="hz">${s.haz.name}</span>`:""}</div>`;
  if(s.kind==="tee")h+=`<div class="d tnum">${s.L}<small>yd par ${s.par}</small></div><div class="facts"><span>Driver</span><span>Fairway ${s.fwHalf*2} yds wide</span>${s.haz?`<span class="hz">${s.haz.name}${s.haz.type==="bunker"?" "+s.haz.from+"–"+s.haz.to:""}</span>`:""}</div>`;
  if(s.kind==="sg")h+=`<div class="d tnum">${s.d}<small>yds</small></div><b style="color:var(--fg)">${s.name}</b><div class="facts">${s.facts.map(f=>`<span>${f}</span>`).join("")}</div>`;
  if(s.kind==="putt")h+=`<div class="d tnum">${s.ft}<small>ft</small></div><div class="facts">${s.facts.slice(1).map(f=>`<span>${f}</span>`).join("")}</div>`;
  h+=`</div>`;
  if(ui.flash)h+=flashHTML();
  if(s.kind==="app"||s.kind==="tee"){
    const mode=ui.entry||(c.lm?"lm":"tap");
    h+=`<div class="seg"><button data-act="entry" data-v="tap" ${pr(mode==="tap")}>Tap the picture</button><button data-act="entry" data-v="lm" ${pr(mode==="lm")}>Type numbers</button></div>`;
    const ball=mode==="tap"?ui.tapBall:null;
    h+=`<div class="viz ${mode==="tap"?"tap":""}" id="pic">${s.kind==="app"?appSVG(s,ball):teeSVG(s,ball)}</div>`;
    if(mode==="tap")h+=`<span class="muted">${ball?(s.kind==="app"?describeApp(s,ball):describeTee(s,ball)):"Tap where the ball finished."}</span><button class="primary" data-act="scoreTap" ${ball?"":"disabled"}>Score shot</button>`;
    else h+=`<div class="lmrow"><label class="fld"><span class="label">Carry (yds)</span><input id="gC" inputmode="numeric"></label><label class="fld"><span class="label">Offline (yds)</span><input id="gO" inputmode="numeric" placeholder="0"></label></div>
      <div class="seg"><button data-act="dir" data-v="L" ${pr(ui.dir==="L")}>Left</button><button data-act="dir" data-v="C" ${pr(ui.dir==="C")}>Straight</button><button data-act="dir" data-v="R" ${pr(ui.dir==="R")}>Right</button></div>
      <button class="primary" data-act="scoreLm">Score shot</button>`;
  }
  if(s.kind==="sg"){h+=`<div class="viz">${sgSVG(s)}</div><span class="qh" style="font-weight:600;color:var(--fg)">How far from the hole did it finish?</span>
    <div class="leave"><button class="hole" data-act="lv" data-v="0">Holed</button>${[1,2,3,4,5,6,8,10,12,15,20,25,30,40].map(v=>`<button data-act="lv" data-v="${v}">${v}${v===40?"+":""}<small style="font-size:10px"> ft</small></button>`).join("")}</div>
    <button class="linky" data-act="reroll">Can't set this up? Give me another shot</button>`}
  if(s.kind==="putt"){h+=`<div class="viz">${puttSVG(s)}</div>`;
    if(s.mode==="hm")h+=`<div class="okno"><button class="y" data-act="pr" data-v="0">✓ Holed</button><button class="x" data-act="pr" data-v="1.5">✕ Missed</button></div>`;
    else h+=`<span class="qh" style="font-weight:600;color:var(--fg)">Where did it finish?</span><div class="res7"><button class="hole" data-act="pr" data-v="0">Holed</button>${PACE.map(p=>`<button data-act="pr" data-v="${p[1]}" data-l="${p[0]}"><b>${p[0].split(" ")[0]}</b>${p[0].split(" ").slice(1).join(" ")}</button>`).join("")}</div>`;
    h+=`<button class="linky" data-act="reroll">Can't set this up? Give me another putt</button>`}
  if(n)h+=`<button class="linky" data-act="gUndo">Undo last shot</button>`;
  return h;
}
const PACE=[["Short 3+ ft",4],["Short 1–3 ft",2],["Short under 1 ft",.7],["Past under 2 ft",1.2],["Past 2–4 ft",3],["Past 4+ ft",5]];
const inZone=ft=>ft===.7||ft===1.2;
function describeApp(s,b){const st=endApp(s,b.c,b.o);return `Carry ${b.c} yds, ${b.o===0?"straight":Math.abs(b.o)+" yds "+(b.o<0?"left":"right")}. ${st.desc}.`}
function describeTee(s,b){const st=endTee(s,b.c,b.o);return `Carry about ${b.c} yds, ${b.o===0?"straight":Math.abs(b.o)+" yds "+(b.o<0?"left":"right")}. ${st.desc}.`}
function recordShot(r){const g=cur(),s=g.shots[g.res.length],o=shotSG(s,r,hcNum(S.cfg.target));g.res.push(r);
  let txt=o.st.desc;if(s.kind==="putt"&&s.mode==="pace"&&fl(S.cfg,"putt").includes("pace"))txt+=r.ft===0?" · 2 points":inZone(r.ft)?" · in the zone, 1 point":" · outside the zone";
  ui.flash={cls:o.sg>=0?"p":"m",txt,big:fmt2(o.sg)};ui.tapBall=null;ui.dir=null;save();render()}

/* ---------- report ---------- */
function finish(){if(S&&S.plan){planDone();LOGS.unshift({t:Date.now(),areas:S.cfg.areas,mins:S.cfg.mins,plan:true,games:S.blocks.filter(b=>b.type==="play"&&b.opened).map(b=>b.title),target:S.cfg.target,hc:null,sg:null,n:0});LOGS=LOGS.slice(0,60);wr(LOG,LOGS);S.step="report";save();render();window.scrollTo(0,0);return}
  const g=combo(),c=S.cfg,tn=hcNum(c.target),list=g.res.map((r,i)=>({s:g.shots[i],r,...shotSG(g.shots[i],r,tn)}));
  const hc=playsLike(g),sg=sum(list.map(x=>x.sg));
  if(!S.logged&&list.length){LOGS.unshift({t:Date.now(),areas:ORDER.filter(a=>c.areas.includes(a)),mins:c.mins,focus:c.focus,target:c.target,hc,sg,n:list.length,cfg:c});LOGS=LOGS.slice(0,60);wr(LOG,LOGS);S.logged=true}
  S.step="report";save();render();window.scrollTo(0,0)}
function shotLabel(s){if(s.kind==="app")return s.d+" yds";if(s.kind==="tee")return s.L+" yd par "+s.par;if(s.kind==="sg")return s.d+" yds · "+s.facts[0];return s.ft+" ft · "+s.facts[1]}
function renderReport(){if(S.plan)return renderPlanReport();
  const c=S.cfg,g=combo(),tn=hcNum(c.target),as=ORDER.filter(a=>c.areas.includes(a));strip(c);
  const list=g.res.map((r,i)=>({s:g.shots[i],r,...shotSG(g.shots[i],r,tn)}));const n=list.length,hc=playsLike(g),sg=sum(list.map(x=>x.sg));
  let h=`<section class="sec-h"><span class="eyebrow">Session report · ${new Date(S.t0).toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"})}</span><h2>${esc(c.name)?esc(c.name)+"'s":"Your"} ${areaNames(as).toLowerCase()} session</h2></section>`;
  if(!n){h+=`<div class="card"><p style="margin:0">You didn't play any shots in the strokes gained game, so there's no handicap for this session. Your drill scores are below.</p></div>`}
  else{const diff=tn-hc,pill=diff>=1?["g","Better than your target"]:diff>=-2?["a","Close to your target"]:["r","Behind your target"];
    const msg=diff>=1?`You practised like a ${hcTxt(hc)} player, about ${Math.abs(diff).toFixed(0)} shots better than ${hcName(c.target)}. That's a strong session.`:diff>=-2?`You practised like a ${hcTxt(hc)} player, right around your ${hcName(c.target)} target.`:`You practised like a ${hcTxt(hc)} player, about ${Math.abs(diff).toFixed(0)} shots behind your ${hcName(c.target)} target. This is the area to keep working on.`;
    h+=`<div class="verdict"><span class="k">You practised like</span><span class="hc">${hcTxt(hc)}</span><span class="pill ${pill[0]}">${pill[1]}</span><p>${msg}</p></div>
     <div class="stats"><div><span class="label">Strokes gained</span><b class="${sg>=0?"up":"down"}">${fmt(sg)}</b></div><div><span class="label">Per shot</span><b class="${sg>=0?"up":"down"}">${fmt2(sg/n)}</b></div><div><span class="label">Shots</span><b>${n}</b></div></div>`;
    if(as.length>1)h+=`<div class="card"><span class="eyebrow">By area</span><div class="grid"><table><thead><tr><th>Area</th><th class="r">Played like</th><th class="r">SG</th><th class="r">Per shot</th></tr></thead><tbody>${as.map(a=>{const gg=combo(games().filter(x=>x.area===a)),l=gg.res.map((r,i)=>shotSG(gg.shots[i],r,tn).sg);return l.length?`<tr><td>${AREAS[a]}</td><td class="r">${hcTxt(playsLike(gg))}</td><td class="r ${sum(l)>=0?"up":"down"}">${fmt(sum(l))}</td><td class="r">${fmt2(sum(l)/l.length)}</td></tr>`:""}).join("")}</tbody></table></div></div>`;
    as.forEach(a=>{const l=list.filter(x=>areaOf(x.s)===a);if(l.length)h+=keyStats(view(c,a),l,as.length>1)});
    const srt=list.slice().sort((a,b)=>b.sg-a.sg),best=srt[0],worst=srt[srt.length-1];
    h+=`<div class="card"><span class="eyebrow">Best and worst</span><div class="stats" style="grid-template-columns:1fr 1fr"><div><span class="label">Best shot</span><b class="up">${fmt2(best.sg)}</b><span class="muted">${shotLabel(best.s)} · ${best.st.desc}</span></div><div><span class="label">Costliest shot</span><b class="down">${fmt2(worst.sg)}</b><span class="muted">${shotLabel(worst.s)} · ${worst.st.desc}</span></div></div>
      <div class="grid"><table><thead><tr><th>#</th><th>Shot</th><th>Result</th><th class="r">SG</th></tr></thead><tbody>${list.map((x,i)=>`<tr><td>${i+1}</td><td>${shotLabel(x.s)}</td><td>${x.st.desc}</td><td class="r ${x.sg>=0?"up":"down"}">${fmt2(x.sg)}</td></tr>`).join("")}</tbody></table></div></div>`}
  const blk=S.blocks.filter(b=>b.type!=="game"&&b.type!=="tick").map(blockResult).filter(Boolean);
  if(blk.length)h+=`<div class="card"><span class="eyebrow">Drills and stations</span><div class="grid"><table><tbody>${blk.map(x=>`<tr><td>${x[0]}</td><td class="r"><b>${x[1]}</b></td></tr>`).join("")}</tbody></table></div>
    ${S.blocks.filter(b=>b.type==="strike"&&b.hits.length).map(b=>`<span class="label">${b.title}</span><div class="viz">${faceSVG(b.hits,true)}</div>`).join("")}</div>`;
  h+=`<div class="btns"><button class="primary" data-act="new">Plan another session</button></div>`;
  h+=historyHTML();
  app.innerHTML=h;
}
function areaOf(s){return {app:"app",tee:"drive",sg:"short",putt:"putt"}[s.kind]}
function keyStats(c,list,named){let rows=[];
  if(c.area==="app"){const gr=list.filter(x=>x.st.zone==="green").length,ins=list.filter(x=>x.st.zone==="green"&&x.st.rem*3<=15).length;rows=[["Greens hit",gr+" of "+list.length],["Inside 15 ft",ins],["Penalties",list.filter(x=>x.st.zone==="pen").length]];
    c.zones.forEach(z=>{const l=list.filter(x=>x.s.d>=z[0]&&x.s.d<=z[1]);if(l.length)rows.push([z[0]+"–"+z[1]+" yds",fmt2(sum(l.map(x=>x.sg))/l.length)+" per shot"])})}
  if(c.area==="drive")rows=[["Fairways",list.filter(x=>x.st.zone==="fw").length+" of "+list.length],["Penalties",list.filter(x=>x.st.zone==="pen").length]];
  if(c.area==="short"){const ud=list.filter(x=>x.r.ft<=4).length;rows=[["Inside 4 ft (likely up and down)",ud+" of "+list.length],["Holed",list.filter(x=>x.r.ft===0).length]];
    ["fw","tight","rough","sand"].forEach(l=>{const t=list.filter(x=>x.s.lie===l);if(t.length)rows.push([{fw:"Fairway",tight:"Tight lie",rough:"Rough",sand:"Bunker"}[l],fmt2(sum(t.map(x=>x.sg))/t.length)+" per shot"])})}
  if(c.area==="putt"){rows=[["Holed",list.filter(x=>x.r.ft===0).length+" of "+list.length]];
    if(list.some(x=>x.s.mode==="pace")){const pts=sum(list.map(x=>x.r.ft===0?2:inZone(x.r.ft)?1:0));rows.push(["Pace points (zone 1 ft short to 2 ft past)",pts+" of "+list.length*2]);rows.push(["Left short",list.filter(x=>x.r.ft>0&&/Short/.test(x.r.label||"")).length])}
    [...new Set(list.map(x=>x.s.ft))].forEach(f=>{const t=list.filter(x=>x.s.ft===f);rows.push([f+" ft",t.filter(x=>x.r.ft===0).length+" of "+t.length+" holed"])})}
  return `<div class="card"><span class="eyebrow">${named?AREAS[c.area]+": the key numbers":"The key numbers"}</span><div class="grid"><table><tbody>${rows.map(r=>`<tr><td>${r[0]}</td><td class="r"><b>${r[1]}</b></td></tr>`).join("")}</tbody></table></div></div>`}
function blockResult(b){
  if(b.type==="ladder"&&b.shots.length)return [b.title,b.shots.filter(s=>s.ok).length+" of "+b.shots.length+" on target · "+b.shots.length+" shots to 70"];
  if(b.type==="strike"&&b.hits.length)return [b.title,faceSummary(b.hits)];
  if((b.type==="zones")&&b.res.length)return [b.title,b.res.filter(Boolean).length+" of "+b.res.length+" in the zone"];
  if(b.type==="count"&&b.res.length)return [b.title,b.res.filter(Boolean).length+" of "+b.res.length];
  if(b.type==="carry"&&b.res.length)return [b.title,sum(b.res.map((c,i)=>carryPts(b.targets[i],c)))+" of "+b.res.length*3+" points"];
  if(b.type==="speed"&&b.base.length){const best=Math.max(...b.base,...b.swings.filter(x=>x.up).map(x=>x.v));return [b.title,"Top "+(b.metric==="club"?"club":"ball")+" speed "+best+" mph (warm-up best "+Math.max(...b.base)+")"]}
  return null}

/* ---------- events ---------- */
function goNext(){ui={entry:ui.entry};if(S.bi>=S.blocks.length-1)return finish();S.bi++;save();render();window.scrollTo(0,0)}
function bindRun(b){
  const face=$("face");if(face)face.querySelector("svg").addEventListener("click",e=>{if(b.hits.length>=b.balls)return;const p=svgPt(e);b.hits.push({x:Math.round(p.x),y:Math.round(p.y)});save();render()});
  const pic=$("pic");if(pic&&pic.classList.contains("tap"))pic.querySelector("svg").addEventListener("click",e=>{const p=svgPt(e),s=b.shots[b.res.length];ui.tapBall=s.kind==="app"?appFromTap(s,p.x,p.y):teeFromTap(s,p.x,p.y);ui.flash=null;render()});
  const enter=(id,act)=>{const e=$(id);if(e){e.addEventListener("keydown",ev=>{if(ev.key==="Enter")handle(act,null,null)})}};

   <div class="side"><span class="label">Sessions</span><b>${n} × ${p.mins} min</b></div>
   <div class="prog">${p.week.map((_,i)=>`<i class="${done.includes(i)?"on":i===next?"cur":""}"></i>`).join("")}</div>
   <div class="bstat">${next<0?"Every session done this week. That's how you get better.":done.length?`${n-done.length} to go this week. Keep it going.`:`You've got ${n} practice session${n===1?"":"s"} this week. Start whenever you're ready.`}</div></div>`;
  if(retest)h+=`<div class="warnbox"><b>Time to retest</b>It's been ${p.retestWeeks} weeks. Take your tests again and rebuild your plan to see what's improved.</div>`;
  if(p.missing&&p.missing.length)h+=`<div class="recnote">This plan doesn't cover ${p.missing.map(k=>TEST_PLAN[k][1]).join(" or ")}. <button class="linky" data-act="tests">Add ${p.missing.length>1?"them":"it"}</button></div>`;
  p.week.forEach((s,i)=>{const isDone=done.includes(i),areas=gameAreas(s.games);
    h+=`<div class="sess ${isDone?"done":i===next?"next":""}"><div class="sh"><span class="sn">${isDone?"✓":i+1}</span><div class="st"><b>Session ${i+1} · ${areas.map(a=>AREAS[a]).join(" + ")}</b><small>${["app","drive"].some(a=>areas.includes(a))?"On the range or simulator":"Short game area and putting green"} · ${p.mins} min · ${isDone?"done this week":"to do"}</small></div></div>
     <ul class="sg">${[...new Set(s.games)].map(g=>{const G=MacroPlan.GAMES[g],k=s.games.filter(x=>x===g).length;return `<li><b>${esc(G.name)}${k>1?" ×"+k:""}</b>${G.set?` <small>${G.set}</small>`:""}<span>${G.mins*k} min</span></li>`}).join("")}</ul>
     ${isDone?`<button class="linky" data-act="startPlan" data-v="${i}">Do it again</button>`:`<button class="${i===next?"primary":"ghost"}" data-act="startPlan" data-v="${i}">Start session ${i+1}</button>`}</div>`});
  h+=whyCard();
  h+=`<div class="btns"><button class="ghost" data-act="build">Build a one-off session</button><button class="ghost" data-act="tests">Tests and plan</button></div>`;
  return h}
function whyCard(){const P=PG(),p=P.plan,T=hcName(p.target||"10");if(!p.chosen.length)return "";
  return `<details class="card" ${ui.why?"open":""}><summary class="label" style="cursor:pointer">Why your plan looks like this</summary>
   <p style="margin:0">Built from your ${p.from.map(k=>TEST_PLAN[k][1]).join(", ")} on ${niceDay(p.t)}, compared with a ${T} player. Practice time goes where you lose the most shots.</p>
   ${p.chosen.map(c=>{const G=MacroPlan.GAMES[c.game],w=c.leaks.slice().sort((a,b)=>a.perRound-b.perRound)[0];
     return `<div class="why"><div class="wh"><b>${esc(G.name)}</b><span>${c.plays}× a week</span></div><div class="wbar"><i style="width:${Math.round(Math.max(.06,c.share||0)*100)}%"></i></div>
      <small>${c.maintain?"Nothing big to fix here, this keeps you sharp.":`${esc(w.name)}: losing ${Math.abs(w.perRound).toFixed(1)} shot${Math.abs(w.perRound)>=1.05?"s":""} a round against a ${T} player.`}</small></div>`}).join("")}
   ${p.strengths.length?`<p class="muted" style="margin:0">Already strong: ${p.strengths.map(s=>esc(s.name).toLowerCase()).join(", ")}.</p>`:""}
   ${p.gain>0.05?`<div class="recnote">Fix half of what these games target and that's about <b>${p.gain.toFixed(1)} shots a round</b>.</div>`:""}</details>`}
function renderHome(){const P=PG();stripHome();hiLine();fetchTests();
  let h="";const ip=rd(KEY);
  if(ip&&ip.step==="run"&&ip.blocks){const b=ip.blocks[ip.bi]||{};h+=`<div class="resume"><b>${ip.plan?"Session "+(ip.plan.idx+1)+" is in progress":"You have a session in progress"}</b><span class="muted">${b.type==="play"&&b.opened?"Back from "+esc(b.title)+"? Carry on to tick it off.":"Block "+(ip.bi+1)+" of "+ip.blocks.length+": "+esc(b.title||"")}</span><div class="btns"><button class="dark" data-act="resume">Carry on</button><button class="ghost" data-act="discard">Start again</button></div></div>`}
  if(!P.profile||ui.editProf)h+=profileCard();
  else if(!P.plan||ui.tests)h+=testsCard();
  else h+=weekCard();
  h+=historyHTML();
  app.innerHTML=h;bindHome()}
function bindHome(){const n=$("pName");if(n)n.addEventListener("input",e=>{ui.prof.name=e.target.value;const b=document.querySelector('[data-act="saveProf"]');if(b)b.disabled=!(ui.prof.sessions&&ui.prof.mins&&ui.prof.sim!==null&&e.target.value.trim())});
  const t=$("pTarget");if(t)t.addEventListener("change",e=>{ui.prof.target=e.target.value})}
/* returns true when it handled the action */
function homeAct(act,v,el){const P=PG();
  switch(act){
    case "home":hview="home";ui={};S=null;render();window.scrollTo(0,0);return true;
    case "build":hview="build";draft=null;ui={};render();window.scrollTo(0,0);return true;
    case "pf":{const k=el.dataset.k;ui.prof[k]=k==="sim"?v==="yes":+v;render();return true}
    case "saveProf":{const pr=ui.prof;if(!pr||!String(pr.name||"").trim())return true;const changed=P.profile&&(P.profile.sessions!==pr.sessions||P.profile.mins!==pr.mins||P.profile.sim!==pr.sim||P.profile.target!==pr.target);
      P.profile={name:pr.name.trim(),sessions:pr.sessions,mins:pr.mins,sim:pr.sim,target:pr.target};if(!window.S.player)window.S.player=pr.name.trim();
      if(P.plan&&changed)makePlan();window.save();ui={};render();window.scrollTo(0,0);return true}
    case "editProf":ui={editProf:true};render();window.scrollTo(0,0);return true;
    case "tests":ui={tests:true};render();window.scrollTo(0,0);return true;
    case "skipT":P.skip=P.skip||{};P.skip[v]=!P.skip[v];window.save();render();return true;
    case "mkPlan":case "mkPlanAnyway":makePlan();ui={why:true};render();window.scrollTo(0,0);return true;
    case "startPlan":startPlanSession(+v);return true;
    case "play":{const b=S&&S.step==="run"?cur():null;if(b){b.opened=true;save()}return true}
    case "vid":if(window.MGVideo)MGVideo.open("Express 5 Minute Golf Warm Up","rxkqwwoq0t");return true;
  }
  return false}

/* a real game: open its page (scores save there and count on its leaderboard), then tick it off here */
function runPlay(b){const G=MacroPlan.GAMES[b.game];
  return `<div class="viz">${gameArt(b.game)}</div><p class="vizcap">${esc(G.what)}</p>
   ${G.set?`<div class="recnote">Play it on the <b>${G.set}</b> setting.</div>`:""}
   <ul class="steps"><li>Tap Play. ${esc(G.name)} opens with its own scorecard.</li><li>Your score saves to your record and counts on the ${esc(G.name)} leaderboard.</li><li>When you've finished, come back here and tick it off.</li></ul>
   ${b.opened?`<div class="resume"><b>Back from ${esc(G.name)}?</b><span class="muted">Tick it off and move on to the next block.</span></div>`:""}
   <a class="${b.opened?"ghost":"dark"} playbtn" href="${site(GAME_URL[b.game])}" data-act="play">▶ ${b.opened?"Open":"Play"} ${esc(G.name)}</a>`+nextBtn(b.opened?"✓ Played it, next block":"✓ Already played it, next block")}
/* end of a planned session: tick it off for the week */
function planDone(){const P=PG(),wk=S.plan.week,i=S.plan.idx;P.weeks=P.weeks||{};const a=P.weeks[wk]=P.weeks[wk]||[];if(!a.includes(i))a.push(i);
  Object.keys(P.weeks).sort().slice(0,-12).forEach(k=>delete P.weeks[k]);window.save()}
function renderPlanReport(){const P=PG(),c=S.cfg,done=doneThisWeek(),n=S.plan.n,played=S.blocks.filter(b=>b.type==="play"&&b.opened),strikes=S.blocks.filter(b=>b.type==="strike"&&b.hits.length);
  stripHome();hiLine();
  let h=`<div class="verdict"><span class="k">Session ${S.plan.idx+1} done · ${new Date(S.t0).toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"})}</span><span class="hc">${done.length}/${n}</span><p>${done.length>=n?"That's every session this week. Brilliant work"+(firstName()?", "+esc(firstName()):"")+".":`${n-done.length} more this week. Keep it rolling.`}</p></div>`;
  if(played.length)h+=`<div class="card"><span class="eyebrow">Games played</span>${played.map(b=>`<div class="trow ok"><span class="tn">✓</span><div class="tt"><b>${esc(b.title)}</b><small>Score saved. Check the leaderboard on the game page.</small></div></div>`).join("")}</div>`;
  if(strikes.length)h+=`<div class="card"><span class="eyebrow">Your strike map</span>${strikes.map(b=>`<div class="viz">${faceSVG(b.hits,true)}</div><span class="muted">${faceSummary(b.hits)}</span>`).join("")}</div>`;
  h+=`<div class="btns"><button class="primary" data-act="home">Back to my week</button></div>`+historyHTML();
  app.innerHTML=h}

/* resume where they left off */
if(S&&S.step==="report"){S=null}
if(S&&S.step==="run"){S=null}  /* show the setup screen with a "carry on" card first */
render();
window.MacroPractice={E,shotSG,build,recommend,playsLike,combo};
})();
</script>

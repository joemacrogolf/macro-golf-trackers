   <div class="seg"><button data-act="metric" data-v="club" ${pr(b.metric==="club")}>Club speed</button><button data-act="metric" data-v="ball" ${pr(b.metric==="ball")}>Ball speed</button></div>
   <div class="spd"><div><span class="label">To beat</span><b class="tnum">${best||"–"}</b></div><div><span class="label">Swings</span><b class="tnum">${b.base.length+b.swings.length}</b></div><div><span class="label">Strikes</span><div class="strikes" style="justify-content:center">${[0,1,2].map(i=>`<i class="${i<st?"on":""}">${i<st?"✕":""}</i>`).join("")}</div></div></div>
   ${over?`<div class="call"><span class="label">Top speed</span><div class="d">${best}<small>mph</small></div></div>`:`<div class="bigin"><input id="spdIn" inputmode="decimal" placeholder="${inBase?"Warm-up ball "+(b.base.length+1)+" (mph)":"Speed (mph)"}" aria-label="Speed in mph"><button class="dark" data-act="spdAdd">Enter</button></div>`}
   ${b.base.length||b.swings.length?`<button class="linky" data-act="spdUndo">Undo last</button>`:""}`+nextBtn(over?"✓ Next block":"Finish early")}

/* the strokes gained game */
function playsLike(g){const k=g.res.length;if(!k)return null;let lo=-12,hi=45;for(let i=0;i<40;i++){const mid=(lo+hi)/2;if(sum(g.res.map((r,j)=>shotSG(g.shots[j],r,mid).sg))>0)hi=mid;else lo=mid}return (lo+hi)/2}
function flashHTML(){const f=ui.flash;return `<div class="flash ${f.cls}"><span>${f.txt}</span><b>${f.big}</b></div>`}
function runGame(b,c){const n=b.res.length;
  if(n>=b.shots.length)return `<p style="margin:0">All ${b.shots.length} shots done.</p>${ui.flash?flashHTML():""}`+nextBtn("✓ Next block");
  const s=b.shots[n];let h=`<ul class="steps"><li>Play every shot with your full routine. One ball each.</li></ul><div class="call"><span class="label">Shot ${n+1} of ${b.shots.length}</span>`;
  if(s.kind==="app")h+=`<div class="d tnum">${s.d}<small>yds</small></div><div class="facts"><span>Fairway lie</span><span>Flag ${s.d} yds</span>${s.haz?`<span class="hz">${s.haz.name}</span>`:""}</div>`;
  if(s.kind==="tee")h+=`<div class="d tnum">${s.L}<small>yd par ${s.par}</small></div><div class="facts"><span>Driver</span><span>Fairway ${s.fwHalf*2} yds wide</span>${s.haz?`<span class="hz">${s.haz.name}${s.haz.type==="bunker"?" "+s.haz.from+"–"+s.haz.to:""}</span>`:""}</div>`;
  if(s.kind==="sg")h+=`<div class="d tnum">${s.d}<small>yds</small></div><b style="color:var(--fg)">${s.name}</b><div class="facts">${s.facts.map(f=>`<span>${f}</span>`).join("")}</div>`;
  if(s.kind==="putt")h+=`<div class="d tnum">${s.ft}<small>ft</small></div><div class="facts">${s.facts.slice(1).map(f=>`<span>${f}</span>`).join("")}</div>`;
  h+=`</div>`;

   ${ui.reset?`<div class="warnbox"><b>Reset your plan?</b>This clears your 6 week plan and the sessions you've ticked off. Your test results, your answers and your game scores stay, so you can build a new plan straight away.</div><div class="btns"><button class="primary" data-act="resetYes">Yes, reset my plan</button><button class="ghost" data-act="resetNo">Cancel</button></div>`:`<button class="linky" data-act="resetAsk">Reset my plan</button>`}`;
  return h}
function whyCard(){const P=PG(),p=P.plan,T=hcName(p.target||"10");
  if(!p.targets){if(!p.chosen||!p.chosen.length)return "";return `<div class="recnote">Rebuild your plan to see the new layout. <button class="linky" data-act="tests">Rebuild</button></div>`}
  const mx=Math.max(...p.targets.map(t=>t.mins));
  return `<details class="card" ${ui.why?"open":""}><summary class="label" style="cursor:pointer">Why your plan looks like this</summary>
   <p style="margin:0">Built from your ${p.from.map(k=>TEST_PLAN[k][1]).join(", ")} on ${niceDay(p.t)}, compared with a ${T} player. The same sessions run for ${p.retestWeeks} weeks, with the drills changing week to week, then you retest. Every area that's costing you shots gets practice time, and the biggest leaks get the most.</p>
   ${p.targets.map(t=>`<div class="why"><div class="wh"><b>${esc(t.name)}</b><span>${t.mins} min a week</span></div><div class="wbar"><i style="width:${Math.round(t.mins/mx*100)}%"></i></div>
      <small>${t.maintain?"Nothing big to fix, this keeps it sharp.":`Losing ${t.loss.toFixed(1)} shot${t.loss>=1.05?"s":""} a round against a ${T} player.`} ${t.full?`${t.full>1?"Full games":"A full game"}: ${(t.games||[t.game]).map(g=>esc(MacroPlan.GAMES[g].name)).join(", ")}${t.mins>sum((t.games||[t.game]).map(g=>MacroPlan.GAMES[g].mins))+2?", plus focused work":""}.`:"Focused drills and short strokes gained games. Better use of the time than a full game."}</small></div>`).join("")}
   ${p.keepSharp?`<p class="muted" style="margin:0">Every range session also has a few minutes of iron play and driving, so neither gets neglected. The biggest leak still gets the main chunk of time.</p>`:""}
   ${p.lava?`<div class="recnote"><b>Lava ideas, ${({L:"left",R:"right",S:"short",G:"long"})[p.lava.side]} is lava.</b> ${esc(p.lava.why)} Your approach${p.lava.side==="L"||p.lava.side==="R"?" and driving":""} drills practise keeping the ball off that side.</div>`:""}
   ${p.strengths.length?`<p class="muted" style="margin:0">Already strong: ${p.strengths.map(s=>esc(s.name).toLowerCase()).join(", ")}.</p>`:""}
   ${p.totalLoss>0.1?`<div class="recnote">These areas cost you about <b>${p.totalLoss.toFixed(1)} shots a round</b> against a ${T} player. Halve that and you're ${(p.totalLoss/2).toFixed(1)} shots better.</div>`:""}</details>`}
function renderHome(){if(backFromGame())return;const P=PG();stripHome();hiLine();fetchTests();try{loadStreak()}catch(e){}
  let h="";const ip=rd(KEY);
  if(ip&&ip.step==="run"&&ip.blocks){const b=ip.blocks[ip.bi]||{};h+=`<div class="resume"><b>${ip.plan?"Session "+(ip.plan.idx+1)+" is in progress":"You have a session in progress"}</b><span class="muted">${b.type==="play"&&b.opened?"Back from "+esc(b.title)+"? Carry on to tick it off.":"Block "+(ip.bi+1)+" of "+ip.blocks.length+": "+esc(b.title||"")}</span><div class="btns"><button class="dark" data-act="resume">Carry on</button><button class="ghost" data-act="discard">Start again</button></div></div>`}
  if(!P.profile||ui.editProf)h+=profileCard();
  else if(!P.plan||ui.tests)h+=testsCard();
  else h+=weekCard();
  h+=historyHTML();
  app.innerHTML=h;bindHome()}
function bindHome(){const n=$("pName");if(n)n.addEventListener("input",e=>{ui.prof.name=e.target.value;const b=document.querySelector('[data-act="saveProf"]');if(b)b.disabled=!(ui.prof.sessions&&ui.prof.mins&&ui.prof.sim!==null&&e.target.value.trim())});
  const t=$("pTarget");if(t)t.addEventListener("change",e=>{ui.prof.target=e.target.value})}
/* returns true when it handled the action */
function homeAct(act,v,el){const P=PG();
  switch(act){
    case "home":hview="home";ui={};S=null;render();window.scrollTo(0,0);return true;
    case "build":hview="build";draft=null;ui={};render();window.scrollTo(0,0);return true;
    case "pf":{const k=el.dataset.k;ui.prof[k]=k==="sim"?v==="yes":+v;render();return true}
    case "saveProf":{const pr=ui.prof;if(!pr||!String(pr.name||"").trim())return true;const changed=P.profile&&(P.profile.sessions!==pr.sessions||P.profile.mins!==pr.mins||P.profile.sim!==pr.sim||P.profile.target!==pr.target);
      P.profile={name:pr.name.trim(),sessions:pr.sessions,mins:pr.mins,sim:pr.sim,target:pr.target};if(!window.S.player)window.S.player=pr.name.trim();
      if(P.plan&&changed)makePlan();window.save();ui={};render();window.scrollTo(0,0);return true}
    case "editProf":ui={editProf:true};render();window.scrollTo(0,0);return true;
    case "tests":ui={tests:true};render();window.scrollTo(0,0);return true;
    case "skipT":P.skip=P.skip||{};P.skip[v]=!P.skip[v];window.save();render();return true;
    case "resetAsk":ui.reset=true;render();setTimeout(()=>{const b=document.querySelector('[data-act="resetYes"]');if(b)b.scrollIntoView({block:"center"})},0);return true;
    case "resetNo":ui.reset=false;render();return true;
    /* reset: the plan and its ticked sessions go; tests, profile, history and game scores stay */
    case "resetYes":{const P=PG();delete P.plan;P.weeks={};const ip=rd(KEY);if(ip&&ip.plan)wr(KEY,null);window.save();ui={tests:true};render();window.scrollTo(0,0);return true}
    case "mkPlan":case "mkPlanAnyway":makePlan();ui={why:true};render();window.scrollTo(0,0);return true;
    case "startPlan":startPlanSession(+v);return true;
    case "play":{const b=S&&S.step==="run"?cur():null;if(b){b.opened=true;save();try{localStorage.setItem("mgplan-return",JSON.stringify({url:location.href.split("#")[0],g:GAME_URL[b.game],t:Date.now(),name:String((PG().profile||{}).name||window.S.player||knownName()||"").trim(),hc:String(S.cfg.target||(PG().plan||{}).target||"")}))}catch(e){}}return true}
    case "vid":if(window.MGVideo)MGVideo.open("Express 5 Minute Golf Warm Up","rxkqwwoq0t");return true;
    case "gvid":{const g=GAME_VID[v];if(g&&window.MGVideo)MGVideo.open("How to play "+MacroPlan.GAMES[v].name,g);return true}
  }
  return false}

/* a real game: open its page (scores save there and count on its leaderboard), then tick it off here */
/* "How to play" videos from the Practice Games library (same ones the game pages use) */
const GAME_VID={holeout:"v79x5jmgq4",ms12:"03wsak6uxo",ms24:"03wsak6uxo",insanity:"583iekejmx",bank:"fb5shey97s",par18:"jiak1zvshi"};
const vidBtn=(g,cls)=>GAME_VID[g]?`<button class="${cls||"ghost"} gvid" data-act="gvid" data-v="${g}">▶ Watch how to play</button>`:"";
function runPlay(b){const G=MacroPlan.GAMES[b.game];
  return (b.game==="strikes"?SPEEDWARN:"")+`<div class="viz">${gameArt(b.game)}</div><p class="vizcap">${esc(G.what)}</p>
   ${G.set?`<div class="recnote">Play it on the <b>${G.set}</b> setting.</div>`:""}
   ${vidBtn(b.game)}
   <ul class="steps"><li>Tap Play. ${esc(G.name)} opens with its own scorecard.</li><li>Your score saves to your record and counts on the ${esc(G.name)} leaderboard.</li><li>When the game is done, it brings you straight back here to the next block.</li></ul>
   ${b.opened?`<div class="resume"><b>Back from ${esc(G.name)}?</b><span class="muted">Tick it off and move on to the next block.</span></div>`:""}
   <a class="${b.opened?"ghost":"dark"} playbtn" href="${site(GAME_URL[b.game])}?from=plan" data-act="play">▶ ${b.opened?"Open":"Play"} ${esc(G.name)}</a>`+nextBtn(b.opened?"✓ Played it, next block":"✓ Already played it, next block")}
/* end of a planned session: tick it off for the week */
function planDone(){const P=PG(),wk=S.plan.week,i=S.plan.idx;P.weeks=P.weeks||{};const a=P.weeks[wk]=P.weeks[wk]||[];if(!a.includes(i))a.push(i);
  Object.keys(P.weeks).sort().slice(0,-12).forEach(k=>delete P.weeks[k]);window.save()}
function renderPlanReport(){const P=PG(),c=S.cfg,done=doneThisWeek(),n=S.plan.n,played=S.blocks.filter(b=>b.type==="play"&&b.opened),strikes=S.blocks.filter(b=>b.type==="strike"&&b.hits.length);
  stripHome();hiLine();
  let h=`<div class="verdict"><span class="k">Session ${S.plan.idx+1} done · ${new Date(S.t0).toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"})}</span><span class="hc">${done.length}/${n}</span><p>${done.length>=n?"That's every session this week. Brilliant work"+(firstName()?", "+esc(firstName()):"")+".":`${n-done.length} more this week. Keep it rolling.`}</p></div>`;
  if(played.length)h+=`<div class="card"><span class="eyebrow">Games played</span>${played.map(b=>`<div class="trow ok"><span class="tn">✓</span><div class="tt"><b>${esc(b.title)}</b><small>Score saved. Check the leaderboard on the game page.</small></div></div>`).join("")}</div>`;
  if(strikes.length)h+=`<div class="card"><span class="eyebrow">Your strike map</span>${strikes.map(b=>`<div class="viz">${faceSVG(b.hits,true)}</div><span class="muted">${faceSummary(b.hits)}</span>`).join("")}</div>`;
  const lads=S.blocks.filter(b=>b.type==="lad5"&&b.res.length),pb=ladPB();
  if(lads.length)h+=`<div class="card"><span class="eyebrow">Landing ladder</span>${lads.map(b=>`<div class="trow ok"><span class="tn">${b.res.filter(Boolean).length}</span><div class="tt"><b>${b.res.filter(Boolean).length} of ${b.seq.length} points${b.newPB?" · new personal best":""}</b><small>${pb?"Personal best "+pb.best+"/"+b.seq.length+". ":""}Just for the drill, not strokes gained.</small></div></div>`).join("")}</div>`;
  h+=`<div class="btns"><button class="primary" data-act="home">Back to my week</button></div>`+historyHTML();
  app.innerHTML=h}

/* resume where they left off */
if(S&&S.step==="report"){S=null}
if(S&&S.step==="run"){S=null}  /* show the setup screen with a "carry on" card first */
render();
window.MacroPractice={E,shotSG,build,recommend,playsLike,combo};
})();

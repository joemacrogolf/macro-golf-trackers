<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: Macro Golf house style, same as the games and tests. Black cover band with yellow bar and stacked caps, black live board, white cards with yellow eyebrow labels, square corners */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --line:rgba(11,11,11,0.16); --fg:#0B0B0B; --muted:#77715F; --body:#3B3830;
  --ink:#0B0B0B; --on-ink:#F4F1EA; --on-ink-muted:#9C988C;
  --gold:#FFD900; --gold-ink:#8a7f00; --soft:#F4F1EA;
  --good:#1FA855; --warn:#F5A800; --bad:#E0352B;
  --display:"Anton","Arial Narrow",Impact,sans-serif; --text:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;border-radius:0}
body{background:var(--bg);color:var(--body);font-family:var(--text);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
.wrap{max-width:580px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--display);font-weight:400;text-transform:uppercase;letter-spacing:-.3px;margin:0;color:var(--fg);text-wrap:balance}
.tnum{font-variant-numeric:tabular-nums}
.muted{color:var(--muted);font-size:13px}
.label{font-size:11px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted)}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:2.4px;text-transform:uppercase;color:var(--gold-ink)}
button{font-family:var(--text);font-weight:700;border:0;padding:12px 16px;cursor:pointer;letter-spacing:.04em;color:var(--fg);background:transparent}
button:disabled{opacity:.4;cursor:not-allowed}
input,select{font-family:var(--text);color:var(--fg)}
input:focus-visible,select:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* cover */
.cover{background:var(--ink);color:var(--on-ink);padding:22px 22px 18px;display:flex;flex-direction:column;gap:16px}
.brand{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.brand .logo{height:34px;width:auto;display:block}
.brand .sub{font-size:10px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:rgba(244,241,234,.62)}
.goldbar{width:74px;height:7px;background:var(--gold)}
.cover h1{font-size:clamp(46px,14vw,68px);line-height:.94;letter-spacing:-1px;color:var(--on-ink)}
.cover h1 span{display:block}
.cover h1 .g{color:var(--gold);font-size:.46em;line-height:1.06;letter-spacing:-.3px;margin-top:6px}
.strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid rgba(244,241,234,.18);padding-top:12px}
.strip>div{display:flex;flex-direction:column;gap:2px;min-width:0;padding:0 10px;border-left:1px solid rgba(244,241,234,.18)}
.strip>div:first-child{padding-left:0;border-left:0}
.strip .k{font-size:10px;font-weight:700;letter-spacing:1.8px;text-transform:uppercase;color:var(--gold)}
.strip .v{font-family:var(--display);font-size:16px;line-height:1.15;text-transform:uppercase;color:var(--on-ink);overflow-wrap:anywhere}

/* section heads and cards */
.sec-h{display:flex;flex-direction:column;gap:6px}
.sec-h h2{font-size:28px;line-height:1.08}
.sec-h h2::after{content:"";display:block;width:74px;height:6px;background:var(--gold);margin-top:14px}
.card{background:var(--surface);border:1px solid var(--line);padding:20px;display:flex;flex-direction:column;gap:16px}
.q{display:flex;flex-direction:column;gap:8px}
.q .qh{font-weight:600;color:var(--fg);font-size:16px}
.q .qs{font-size:13px;color:var(--muted)}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld input,.fld select{font-size:18px;font-weight:600;padding:10px 12px;border:1px solid var(--line);background:var(--bg);width:100%;min-width:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* choice buttons */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--bg);padding:10px 14px;font-size:14px;color:var(--fg);display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--gold);border-color:var(--gold)}
.chip:disabled{text-decoration:line-through}
.lvl{display:grid;gap:10px}
.lvl button{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;background:var(--bg);border:1px solid var(--line);border-left:6px solid var(--line);padding:14px}
.lvl button b{font-family:var(--display);font-weight:400;font-size:20px;letter-spacing:-.3px;text-transform:uppercase;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lvl button small{font-weight:400;font-size:13px;color:var(--body);letter-spacing:0}
.lvl button[aria-pressed="true"]{border-color:var(--ink);border-left-color:var(--gold);background:var(--soft)}
.rec{font-family:var(--text);background:var(--ink);color:var(--gold);font-size:9px;letter-spacing:1.6px;padding:4px 7px;font-weight:700;text-transform:uppercase}
.recnote{font-size:13px;color:var(--fg);background:var(--soft);border-left:6px solid var(--gold);padding:10px 12px}
.yn{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line)}
.yn button{font-family:var(--display);font-weight:400;font-size:18px;text-transform:uppercase;color:var(--muted);background:var(--bg)}
.yn button+button{border-left:1px solid var(--line)}
.yn button[aria-pressed="true"]{background:var(--gold);color:var(--fg)}
.rangeRow{display:flex;align-items:center;gap:12px}
.rangeRow input[type=range]{flex:1;min-width:0;accent-color:var(--ink)}
.rangeRow output{font-family:var(--display);font-size:24px;color:var(--fg);min-width:84px;text-align:right}
.custom{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}
.custom input{font-size:16px;font-weight:600;padding:9px 10px;border:1px solid var(--line);width:100%;min-width:0}

.primary{background:var(--gold);color:var(--fg);font-family:var(--display);font-weight:400;font-size:20px;text-transform:uppercase;letter-spacing:.5px;padding:14px 18px}
.dark{background:var(--ink);color:var(--gold);font-family:var(--display);font-weight:400;font-size:18px;text-transform:uppercase;letter-spacing:.5px;padding:12px 16px}
.ghost{border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btns>*{flex:1}
.linky{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;font-weight:400;font-size:13px;letter-spacing:0}

/* plan preview */
.planlist{display:flex;flex-direction:column;border:1px solid var(--line)}
.planlist .row{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.planlist .row:first-child{border-top:0}
.planlist .n{font-family:var(--display);font-size:18px;color:var(--gold-ink)}
.planlist .t{font-weight:600;color:var(--fg);min-width:0}
.planlist .t small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.planlist .m{font-family:var(--display);font-size:16px;color:var(--fg)}
.planlist .row.done .n{color:var(--good)}
.planlist .row.cur{background:var(--soft);box-shadow:inset 6px 0 0 var(--gold)}

/* run: board */
.board{background:var(--ink);color:var(--on-ink);padding:16px 18px;display:grid;grid-template-columns:1fr auto;gap:4px 14px;align-items:end;border-left:6px solid var(--gold)}
.board .label{color:var(--gold)}
.board .big{font-family:var(--display);font-size:64px;line-height:.9;color:var(--on-ink)}
.board .side{text-align:right;display:flex;flex-direction:column;gap:2px}
.board .side b{font-family:var(--display);font-weight:400;font-size:22px;color:var(--on-ink)}
.prog{grid-column:1/-1;display:flex;gap:4px;margin-top:10px}
.prog6 .pc{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}.pch{display:flex;justify-content:space-between;align-items:baseline;gap:8px}.pch b{font-family:var(--display);font-weight:400;font-size:20px;text-transform:uppercase}.pch small{color:var(--muted);font-size:12px}
.pcbig{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}.pcbig span{font-family:var(--display);font-size:30px;line-height:1}.pcbig i{font-style:normal;color:var(--muted)}.pcbig em{font-style:normal;font-weight:700;font-size:13px;margin-left:auto;padding:3px 8px;background:var(--line)}.pcbig.up em{background:#1FA855;color:#fff}.pcbig.down em{background:#E0352B;color:#fff}
.pcl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}.pcl li{display:grid;grid-template-columns:1fr auto 52px;gap:8px;align-items:baseline;font-size:14px}.pcl small{color:var(--muted);font-size:12px}.pcl b{text-align:right;font-size:13px}.pcl li.up b{color:#1FA855}.pcl li.down b{color:#E0352B}
.welcome{background:var(--ink);color:var(--on-ink);border-left:6px solid var(--gold);padding:18px;display:flex;flex-direction:column;gap:14px}
.welcome .wtop{display:grid;grid-template-columns:1fr 112px;gap:12px;align-items:start}.welcome .wk{font-weight:700;font-size:11px;letter-spacing:2.2px;text-transform:uppercase;color:var(--gold)}
.welcome h2{font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:30px;line-height:1;margin:6px 0 8px;color:var(--on-ink)}.welcome p{margin:0;font-size:15px;line-height:1.5;color:#d9d5cb}
.wodds{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}.wodds .ring{width:104px;height:104px}.wodds small{font-size:11px;line-height:1.3;color:#c9c4b6}
.wmeta{font-size:14px;color:#d9d5cb;border-top:1px solid rgba(244,241,234,.14);padding-top:10px}.wmeta b{color:var(--gold)}
.goals{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}.goals li{background:rgba(244,241,234,.06);padding:12px;display:flex;flex-direction:column;gap:8px}
.goals .gh{display:flex;justify-content:space-between;gap:8px;align-items:baseline}.goals .gh b{font-size:15px}.goals .gh small{color:var(--gold);font-size:12px;font-weight:700;white-space:nowrap}
.goals .gv{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}.goals .gv span{font-family:var(--display);font-size:28px;line-height:1}.goals .gv small{display:block;font-family:Inter,system-ui,sans-serif;font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:#9d988a;margin-bottom:2px}
.goals .gv i{font-style:normal;color:#9d988a}.goals .ggoal{color:var(--gold)}.goals .gv em{font-style:normal;margin-left:auto;font-size:12px;font-weight:700;color:#0B0B0B;background:var(--gold);padding:3px 8px}
.gbar{height:7px;background:rgba(244,241,234,.14)}.gbar i{display:block;height:100%;background:var(--gold)}.goals .gp{font-size:12px;color:#c9c4b6}
.ghow summary{cursor:pointer;font-weight:700;font-size:13px;color:var(--gold)}.ghow p{margin:8px 0 0!important;font-size:14px!important}
.pcg{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}.pcg li{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:baseline;font-size:13px;padding:6px 8px;background:var(--line)}.pcg li.hit{background:rgba(31,168,85,.14)}.pcg small{color:var(--muted)}.pcg b{font-size:12px}.pcg li.hit b{color:#1FA855}
.vlink{border:0;background:none;padding:2px 4px;font:700 12px Inter,system-ui,sans-serif;color:var(--fg);text-decoration:underline;cursor:pointer;white-space:nowrap}.gvid{width:100%}
.wk6{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}.wk6 div{border:1px solid var(--line);padding:6px 4px;text-align:center;display:flex;flex-direction:column;gap:2px}.wk6 small{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}.wk6 b{font-family:var(--display);font-weight:400;font-size:17px}.wk6 .full{background:var(--ink);border-color:var(--ink)}.wk6 .full b,.wk6 .full small{color:var(--gold)}.wk6 .part{background:rgba(255,218,0,.18)}.wk6 .now{border:2px solid var(--gold)}.wk6 .next b{color:var(--muted)}
.prog i{flex:1;height:5px;background:rgba(244,241,234,.18)}
.prog i.on{background:var(--gold)}.prog i.cur{background:var(--on-ink)}
.bstat{grid-column:1/-1;font-size:13px;color:rgba(244,241,234,.85)}

.blockhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.blockhead h2{font-size:30px;line-height:1.02}
.mins{font-family:var(--display);font-size:26px;color:var(--fg);white-space:nowrap}
.mins small{font-family:var(--text);font-size:11px;font-weight:700;letter-spacing:1.6px;color:var(--muted);margin-left:3px}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;color:var(--body)}
.timer{display:flex;align-items:center;gap:12px;border:1px solid var(--line);padding:10px 12px}
.timer b{font-family:var(--display);font-size:32px;color:var(--fg);flex:1}
.viz{border:2px solid var(--ink);line-height:0}
.viz svg{display:block;width:100%;height:auto}
.vizcap{font-family:var(--display);font-size:20px;text-transform:uppercase;color:var(--fg);text-align:center;margin:0}
.tap{cursor:crosshair;touch-action:manipulation}

/* entries */
.bigin{display:grid;grid-template-columns:1fr auto;gap:10px}
.bigin input{font-size:30px;font-weight:700;padding:10px 14px;border:1px solid var(--line);width:100%;min-width:0}
.tally{display:flex;flex-wrap:wrap;gap:6px}
.tally span{font-size:13px;font-weight:700;padding:5px 9px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.tally span.ok{background:var(--good);border-color:var(--good);color:#fff}
.tally span.no{background:var(--bad);border-color:var(--bad);color:#fff}
.tally span.mid{background:var(--warn);border-color:var(--warn);color:var(--fg)}
.ladbar{position:relative;height:12px;background:var(--soft)}
.ladbar i{position:absolute;inset:0 auto 0 0;background:var(--gold)}
.okno{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.okno button{font-family:var(--display);font-weight:400;font-size:22px;text-transform:uppercase;padding:16px}
.okno .y{background:var(--good);color:#fff}.okno .x{background:var(--bad);color:#fff}
.lad{background:#2d5a27;border:1px solid var(--line)}.lad svg{display:block;width:100%;height:auto}
.ladpb{display:flex;gap:8px;flex-wrap:wrap}.ladpb span{border:1px solid var(--line);padding:6px 10px;font-size:13px;font-weight:700}.ladpb span.new{background:var(--gold);border-color:var(--gold);color:#0B0B0B}
.zones{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.zones div{border:1px solid var(--line);padding:8px 2px;text-align:center;font-size:12px;font-weight:700;color:var(--muted)}
.zones div b{display:block;font-family:var(--display);font-weight:400;font-size:18px;color:var(--fg)}
.zones div.cur{border:2px solid var(--ink);background:var(--gold)}
.zones div.cur b{color:var(--fg)}
.call{background:var(--soft);padding:14px;display:flex;flex-direction:column;gap:4px}
.call .d{font-family:var(--display);font-size:56px;line-height:.9;color:var(--fg)}
.call .d small{font-size:22px;color:var(--muted);margin-left:4px}
.facts{display:flex;flex-wrap:wrap;gap:6px}
.facts span{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);padding:3px 7px;background:var(--bg);color:var(--fg)}
.facts span.hz{background:var(--ink);color:var(--gold);border-color:var(--ink)}
.seg{display:flex;border:1px solid var(--line)}
.seg button{flex:1;padding:10px 6px;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--gold)}
.lmrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lmrow input{font-size:24px;font-weight:700;padding:10px 12px;border:1px solid var(--line);width:100%;min-width:0}
.res7{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.res7 button{border:1px solid var(--line);background:var(--bg);padding:12px 4px;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:2px}
.res7 button b{font-family:var(--display);font-weight:400;font-size:20px}
.res7 button.hole{grid-column:1/-1;background:var(--good);color:#fff;border-color:var(--good)}
.leave{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.leave button{border:1px solid var(--line);background:var(--bg);padding:12px 2px;font-family:var(--display);font-weight:400;font-size:18px}
.leave button.hole{grid-column:1/-1;background:var(--good);color:#fff;border-color:var(--good);font-size:20px}
.flash{padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;color:#fff;animation:pop .35s ease}
.flash b{font-family:var(--display);font-weight:400;font-size:36px;line-height:1}
.flash span{font-size:14px}
.flash.p{background:var(--good)}.flash.m{background:var(--bad)}.flash.z{background:var(--ink)}
@keyframes pop{from{transform:scale(.97);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.flash{animation:none}}
.spd{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.spd div{border:1px solid var(--line);padding:10px;text-align:center}
.spd div b{display:block;font-family:var(--display);font-size:28px;color:var(--fg)}
.strikes{display:flex;gap:6px}
.strikes i{width:28px;height:28px;border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-weight:700}
.strikes i.on{background:var(--bad);border-color:var(--bad);color:#fff}

/* plan home */
.cover h1 .hi{font-family:var(--text);font-size:15px;font-weight:700;letter-spacing:.02em;text-transform:none;color:var(--gold);line-height:1.2;margin-bottom:10px}
.tests{display:flex;flex-direction:column;border:1px solid var(--line)}
.trow{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;padding:12px;border-top:1px solid var(--line)}
.trow:first-child{border-top:0}
.trow .tn{width:30px;height:30px;display:grid;place-items:center;font-family:var(--display);font-size:16px;background:var(--soft);color:var(--fg)}
.trow.ok .tn{background:var(--good);color:#fff}.trow.skip{background:var(--soft)}.trow.skip .tn{background:transparent;border:1px dashed var(--muted);color:var(--muted)}.trow.skip .tt b{color:var(--muted)}
.tsm{font-size:13px;padding:8px 12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);white-space:nowrap}.trow .ta{min-width:0}
.trow .ta .tbtn,.trow .ta .tsm{width:100%;text-align:center}
.trow .tt{min-width:0;display:flex;flex-direction:column}.trow .tt b{color:var(--fg)}.trow .tt small{color:var(--muted);font-size:12.5px}
.trow .ta{display:flex;flex-direction:column;align-items:stretch;gap:6px}
.tbtn{text-decoration:none;font-size:15px;padding:9px 14px}
.warnbox{background:#fff5bf;border-left:6px solid var(--gold);padding:12px 14px;font-size:14px;color:var(--fg)}
.warnbox b{display:block;font-size:11px;letter-spacing:1.6px;text-transform:uppercase;margin-bottom:3px}
.sess{border:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:12px;background:var(--bg)}
.sess.next{border:2px solid var(--ink);box-shadow:inset 6px 0 0 var(--gold)}
.sess.done{background:var(--soft)}
.sess .sh{display:flex;gap:12px;align-items:center}
.sess .sn{width:34px;height:34px;display:grid;place-items:center;background:var(--ink);color:var(--gold);font-family:var(--display);font-size:18px;flex:0 0 auto}
.sess.done .sn{background:var(--good);color:#fff}
.sess .st{display:flex;flex-direction:column;min-width:0}.sess .st b{font-family:var(--display);font-weight:400;font-size:20px;text-transform:uppercase;color:var(--fg);line-height:1.1}.sess .st small{color:var(--muted);font-size:12.5px}
.sess ul.sg{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.sess ul.sg li{display:flex;align-items:baseline;gap:8px;font-size:14px;color:var(--fg)}.sess ul.sg li small{color:var(--muted)}.sess ul.sg li span{margin-left:auto;font-family:var(--display);font-size:15px}
.sess ul.sg li small.tag{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:4px;background:var(--line,rgba(0,0,0,.08));color:var(--muted);white-space:nowrap}.sess ul.sg li small.tag.g{background:var(--accent,#ffda00);color:#201f1b}
.why{display:flex;flex-direction:column;gap:5px}.why .wh{display:flex;justify-content:space-between;gap:10px;color:var(--fg)}.why .wh span{font-family:var(--display);font-size:16px}
.why .wbar{height:8px;background:var(--soft)}.why .wbar i{display:block;height:100%;background:var(--gold)}.why small{color:var(--body);font-size:13px}
.playbtn{display:block;text-align:center;text-decoration:none;font-family:var(--display);font-weight:400;font-size:20px;text-transform:uppercase;letter-spacing:.5px;padding:14px 18px}
a.ghost.playbtn{border:1px solid var(--line);color:var(--fg)}
details.card>summary{list-style:none}details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:" +";color:var(--gold-ink)}details.card[open]>summary::after{content:" –"}
/* report */
.verdict{background:var(--ink);color:var(--on-ink);padding:20px;display:flex;flex-direction:column;gap:8px;border-left:6px solid var(--gold)}
.verdict .k{font-size:11px;font-weight:700;letter-spacing:1.8px;text-transform:uppercase;color:var(--gold)}
.verdict .hc{font-family:var(--display);font-size:72px;line-height:.9;color:var(--on-ink)}
.verdict .pill{align-self:flex-start;font-size:11px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;padding:5px 10px}
.pill.g{background:var(--good);color:#fff}.pill.a{background:var(--warn);color:var(--fg)}.pill.r{background:var(--bad);color:#fff}
.verdict p{margin:0;color:rgba(244,241,234,.88)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line)}
.stats div{padding:12px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:2px;min-width:0}
.stats div:first-child{border-left:0}
.stats b{font-family:var(--display);font-weight:400;font-size:28px;color:var(--fg);line-height:1}
.up{color:var(--good)}.down{color:var(--bad)}
.grid{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:8px 6px;text-align:left;border-bottom:1px solid var(--line);font-size:14px;color:var(--fg)}
th{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;font-weight:700;background:var(--soft)}
td.r,th.r{text-align:right}
.cta{background:var(--ink);color:var(--on-ink);padding:18px 20px;display:flex;flex-direction:column;gap:6px;border-bottom:6px solid var(--gold)}
.cta b{font-family:var(--display);font-weight:400;font-size:22px;letter-spacing:.3px;text-transform:uppercase;line-height:1.1}
.cta b span{color:var(--gold)}
.cta small{color:var(--on-ink-muted);font-size:11px;letter-spacing:2px;font-weight:700;text-transform:uppercase}
.resume{border:2px solid var(--ink);background:var(--soft);padding:14px;display:flex;flex-direction:column;gap:10px}
@media (max-width:380px){.stats b{font-size:22px}.call .d{font-size:46px}}
</style>

<script id="mgplanLib">/* =====================================================================
   Macro Golf plan engine
   Turns test results + the pre-test audit into a weekly practice plan,
   with the statistics behind every choice, and renders the full report.
   Runs in the browser (inside each test) and in Node (for the app's
   server to build the emailed report). No dependencies.
   ===================================================================== */
(function(root){
"use strict";

/* ---------- Putting baseline: average putts to hole out, by level ---------- */
var PT={grid:[2,3,4,5,6,8,10,12,15,20,25,30,40,50,60],tab:{
 "Tour":[1.01,1.04,1.13,1.23,1.34,1.5,1.61,1.68,1.78,1.87,1.93,1.98,2.06,2.14,2.21],

 "30":[1.11,1.294,1.517,1.687,1.793,2.03,2.152,2.216,2.281,2.389,2.445,2.486,2.544,2.596,2.656]}};
var LVN=[["Tour",-5],["0",0],["5",5],["10",10],["15",15],["20",20],["25",25],["30",30]];
function rowE(row,ft){const g=PT.grid;if(ft<=1)return 1;if(ft<=g[0])return 1+(row[0]-1)*(ft-1)/(g[0]-1);
  for(let i=1;i<g.length;i++)if(ft<=g[i])return row[i-1]+(row[i]-row[i-1])*(ft-g[i-1])/(g[i]-g[i-1]);
  const n=g.length;return row[n-1]+(row[n-1]-row[n-2])/(g[n-1]-g[n-2])*(ft-g[n-1])}
function puttE(n,ft){let i=1;while(i<LVN.length-1&&n>LVN[i][1])i++;const a=LVN[i-1],b=LVN[i],t=(n-a[1])/(b[1]-a[1]);
  const ea=rowE(PT.tab[a[0]],ft),eb=rowE(PT.tab[b[0]],ft);return Math.max(1,ea+(eb-ea)*t)}
/* rough make rate from a distance: holed, or two putts from the leave */
function makeRate(n,ft){return Math.max(0.02,Math.min(0.99,1-(puttE(n,ft)-1)/Math.max(1.0,puttE(n,Math.max(1.5,ft*0.12)))))}

/* ---------- Helpers ---------- */
var num=h=>h==="Tour"?-5:typeof h==="number"?h:parseFloat(h);

function targetLabel(h){return h==="Tour"?"Tour":String(h)==="0"?"Scratch":h+" hc"}
var sgn=(x,d=2)=>{const r=Math.abs(x).toFixed(d);return parseFloat(r)===0?r:(x>=0?"+":"−")+r};
var esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
var sum=a=>a.reduce((x,y)=>x+y,0);
var pct=x=>Math.round(x*100)+"%";

};

 putting:{name:"Putting Test",url:"https://claude.ai/artifact/2dijvxGV7SRMGpkRrHS7V1",group:"Putting"},
 short:{name:"Short Game Test",url:"https://claude.ai/artifact/Ry4s5HZNJTACC6rEcZTDVR",group:"Short game"},

};

/* ---------- Areas: how often each comes up in a round, and the game that trains it ----------
   freq = estimated shots per round for a 10–15 handicap (Shot Scope and Mark Broadie's round data). */
var AREAS={
 "putt.s":  {group:"Putting",name:"Putts from 3–6 ft",freq:5,game:"holeout",unit:"putt"},
 "putt.m":  {group:"Putting",name:"Putts from 6–10 ft",freq:4,game:"insanity",unit:"putt"},
 "putt.mid":{group:"Putting",name:"Putts from 10–20 ft",freq:5,game:"ms12",unit:"putt"},
 "putt.l":  {group:"Putting",name:"Putts from 20–35 ft",freq:4,game:"ms24",unit:"putt"},
 "putt.lag":{group:"Putting",name:"Putts from 35–50 ft",freq:2,game:"ms24",unit:"putt"},

 "sg.pitch": {group:"Short game",name:"Pitching",freq:2,game:"bank",unit:"shot"},

 "sg.bunker":{group:"Short game",name:"Bunker play",freq:1,game:"par18",unit:"shot"},
 "sg.slope": {group:"Short game",name:"Awkward lies",freq:1,game:"par18",unit:"shot"},
 "sg.lob":   {group:"Short game",name:"Lob and flop shots",freq:0.5,game:"bank",unit:"shot"},
 "lg.wedge":{group:"Approach",name:"Wedges and short irons",freq:5,game:"darts",unit:"shot"},
 "lg.mid":  {group:"Approach",name:"Mid irons",freq:4,game:"lava",unit:"shot"},

 "lg.drv":  {group:"Driving",name:"Driver accuracy",freq:11,game:"corridor",unit:"drive"},
 "lg.speed":{group:"Driving",name:"Driver distance",freq:11,game:"strikes",unit:"drive"}
};
var GROUPS=["Driving","Approach","Short game","Putting"];
var GROUP_TEST={"Driving":"long","Approach":"long","Short game":"short","Putting":"putting"};

/* =====================================================================
   1. Leaks: one entry per area tested.
      Each test hands in {key, n, per (strokes gained per shot vs the
      target handicap), you, level} and gets back perRound.
   ===================================================================== */
function leaks(list){
  return list.filter(x=>AREAS[x.key]&&x.n>0).map(x=>{const a=AREAS[x.key];
    return Object.assign({},x,{area:a,name:a.name,group:a.group,freq:a.freq,game:a.game,perRound:x.per*a.freq})});
}

/* =====================================================================
   2. The plan. Practice time goes where the shots are.
   ===================================================================== */
function build(allLeaks,audit){
  const sessions=Math.max(1,Math.min(7,+audit.sessions||2)),mins=Math.max(15,+audit.minutes||60);
  const weekly=sessions*mins,simOk=audit.sim!==false;
  const losses=allLeaks.filter(l=>l.perRound<=-0.05).sort((a,b)=>a.perRound-b.perRound);
  const strengths=allLeaks.filter(l=>l.perRound>=0.05).sort((a,b)=>b.perRound-a.perRound);
  const totalLoss=-sum(losses.map(l=>l.perRound));
  /* group losses by the game that trains them */
  const byGame={};losses.forEach(l=>{let g=l.game;if(GAMES[g].sim&&!simOk)g=l.group==="Approach"?"bank":g==="corridor"?"strikes":g;
    (byGame[g]=byGame[g]||{game:g,leaks:[],loss:0});byGame[g].leaks.push(l);byGame[g].loss+=-l.perRound});
  let ranked=Object.values(byGame).sort((a,b)=>b.loss-a.loss);
  /* keep the games that cover most of the shots lost, up to what the week can hold */
  const maxGames=Math.max(1,Math.min(4,Math.floor(weekly/20)));
  const chosen=[];let cov=0;
  for(const g of ranked){if(chosen.length>=maxGames)break;if(chosen.length&&cov>=totalLoss*0.85)break;chosen.push(g);cov+=g.loss}
  /* nothing lost: keep the weakest area sharp */
  if(!chosen.length&&allLeaks.length){const w=allLeaks.slice().sort((a,b)=>a.perRound-b.perRound)[0];chosen.push({game:w.game,leaks:[w],loss:0,maintain:true})}
  /* plays per week in proportion to shots lost, at least one each, within the week's minutes */
  const avg=chosen.length?sum(chosen.map(c=>GAMES[c.game].mins))/chosen.length:20;
  let plays=Math.max(chosen.length,Math.floor(weekly/avg));
  const W=sum(chosen.map(c=>c.loss))||1;
  chosen.forEach(c=>{c.plays=Math.max(1,Math.round(c.loss/W*plays))});
  const used=()=>sum(chosen.map(c=>c.plays*GAMES[c.game].mins));
  while(used()>weekly){const c=chosen.slice().reverse().find(x=>x.plays>1);if(!c)break;c.plays--}
  while(chosen.length&&used()+GAMES[chosen[0].game].mins<=weekly){const c=chosen.slice().sort((a,b)=>a.plays/a.loss-b.plays/b.loss)[0];if(used()+GAMES[c.game].mins>weekly)break;c.plays++}
  chosen.forEach(c=>{c.share=totalLoss?c.loss/totalLoss:0;c.minutes=c.plays*GAMES[c.game].mins});
  /* lay the plays out over the week's sessions */
  const queue=[];const tmp=chosen.map(c=>({c,left:c.plays}));
  while(tmp.some(t=>t.left>0))tmp.forEach(t=>{if(t.left>0){queue.push(t.c);t.left--}});
  const week=Array.from({length:sessions},()=>({games:[],mins:0}));
  queue.forEach(c=>{const m=GAMES[c.game].mins,byMin=(a,b)=>a.mins-b.mins;let s=week.filter(x=>x.mins+m<=mins&&!x.games.includes(c.game)).sort(byMin)[0]||week.filter(x=>x.mins+m<=mins).sort(byMin)[0]||week.slice().sort(byMin)[0];s.games.push(c.game);s.mins+=m});
  const gain=0.5*sum(chosen.map(c=>c.loss));
  return {sessions,mins,weekly,chosen,losses,strengths,totalLoss,gain,week:week.filter(s=>s.games.length),retestWeeks:6};
}

/* the reasoning line for one prescribed game */
function why(c,target){
  const T=targetLabel(target);
  return c.leaks.map(l=>`${l.name}: ${sgn(l.per)} per ${l.area.unit} against ${T}. These come up ${l.freq===1?"about once a round":l.freq<1?"about once every "+Math.round(1/l.freq)+" rounds":"about "+l.freq+" times a round"}, so that's ${Math.abs(l.perRound).toFixed(1)} shots a round.`+(l.you?` ${l.you}.`:"")+(l.level?` ${l.level}.`:""));
}

  <p>We keep three things separate: what you told us, what we measured, and what we think it means. Where a number is an estimate, we say so.</p>

  <div class="tiles"><div class="tile y"><small>Handicap</small><b>${A.handicap!=null&&A.handicap!==""?esc(A.handicap):"–"}</b><span>From your audit</span></div>

  ${ctx.result.prevHc!=null?`<div class="pull">Last ${esc(test.name)}: ${hcLabel(ctx.result.prevHc)}${ctx.result.prevDate?` (${esc(ctx.result.prevDate)})`:""}. Today: ${hcLabel(ctx.result.hc)}.</div>`:""}
  <div class="eb">03 / The question</div><h2>What you thought, what we measured</h2><div class="bar"></div>

  <div class="b"><small>What we measured</small><b>${worst?esc(worst.name):"No clear leak"}</b><p>${worst?`${Math.abs(worst.perRound).toFixed(1)} shots a round against ${esc(T)}.`:`Every area was within 0.05 shots a round of ${esc(T)}.`}</p></div></div>
  <p>${vsText}</p>
  ${ctx.complete===false?`<div class="box" style="background:#FFD900;color:#0B0B0B"><small style="color:#0B0B0B">Provisional plan</small><p style="color:#0B0B0B">This plan is built from ${(ctx.testsDone||[ctx.test]).length} of 3 tests, so it only covers ${esc((ctx.testsDone||[ctx.test]).map(k=>TESTS[k].group.toLowerCase()).join(" and "))}. Finish the other tests and generate a new report to get a plan for your whole game.</p></div>`:""}${foot()}</section>`;

  /* ---- page 3: where the shots go ---- */
  const L=TL.slice().sort((a,b)=>a.perRound-b.perRound),mx=Math.max(0.3,...L.map(l=>Math.abs(l.perRound)));
  h+=`<section class="pg">${run()}<div class="eb">04 / Your result</div><h2>${esc(ctx.result.headline||"What the test found")}</h2><div class="bar"></div>
  <p>Strokes gained per shot is how much better or worse each shot left you than a ${esc(T)} golfer from the same spot. Plus is better than your target, minus is worse. Shots a round multiplies that by how often each shot comes up on the course.</p>
  <table><thead><tr><th>Area</th><th>Shots</th><th>Per shot</th><th>A round</th><th>Shots a round</th></tr></thead><tbody>
  ${L.map(l=>`<tr><td>${esc(l.name)}${l.key==="lg.speed"?"*":""}</td><td>${l.key==="lg.speed"?"–":l.n}</td><td class="${l.per>=0?"up":"dn"}">${sgn(l.per)}</td><td>~${l.freq}</td><td class="${l.perRound>=0?"up":"dn"}">${sgn(l.perRound,1)}</td></tr>`).join("")}
  <tr><td><b>Total</b></td><td><b>${sum(L.filter(l=>l.key!=="lg.speed").map(l=>l.n))}</b></td><td></td><td></td><td class="${sum(L.map(l=>l.perRound))>=0?"up":"dn"}"><b>${sgn(sum(L.map(l=>l.perRound)),1)}</b></td></tr></tbody></table>
  ${(()=>{const lo=-sum(L.filter(l=>l.perRound<0).map(l=>l.perRound)),ga=sum(L.filter(l=>l.perRound>0).map(l=>l.perRound));return `<p class="src" style="margin-top:-6px">Shots lost ${lo.toFixed(1)} · shots gained ${ga.toFixed(1)} · overall ${sgn(ga-lo,1)} a round.${L.some(l=>l.key==="lg.speed")?" *Driver distance is worked out from the same drives as driver accuracy, so they're only counted once in the shots total.":""}</p>`})()}
  <div class="eb">Shots a round against ${esc(T)}</div>
  <div class="bars">${L.map(l=>{const w=Math.min(100,Math.abs(l.perRound)/mx*100);return `<div class="br"><span>${esc(l.name)}</span><span class="l">${l.perRound<0?`<i style="width:${w}%"></i>`:""}</span><span class="r">${l.perRound>0?`<i style="width:${w}%"></i>`:""}</span><span class="v">${sgn(l.perRound,1)}</span></div>`}).join("")}

  ${worst?`<div class="pull">${esc(worst.name)} is costing you about ${Math.abs(worst.perRound).toFixed(1)} shots a round. That's ${pct(-worst.perRound/(plan.totalLoss||1))} of the ${plan.totalLoss.toFixed(1)} shots a round you're losing${srcs.length>1?" across your tests":""}.</div>`:""}
  ${foot()}</section>`;

  /* ---- page 4–5: the plan ---- */
  const gcard=(c,i)=>{const g=GAMES[c.game];return `<div class="game${i===0?" k":""}"><div class="hd"><span class="no">${i+1}</span><span class="t"><a href="${g.url}">${esc(g.name)}${g.set?` · ${esc(g.set)}`:""}</a></span>
   <span class="dose">${c.plays}× a week<small>${c.minutes} min · ${c.maintain?"keep it sharp":pct(c.share)+" of shots lost"}</small></span></div>

  h+=`<section class="pg">${run()}<div class="eb">05 / Your plan${ctx.complete===false?" · provisional":""}</div><h2>What to play and why</h2><div class="bar"></div>
  <p>You told us you practice ${plan.sessions} time${plan.sessions>1?"s":""} a week for about ${plan.mins} minutes. That's ${plan.weekly} minutes a week. The games below use that time in proportion to the shots each area costs you.</p>
  ${plan.chosen.map(gcard).join("")}
  ${foot()}</section>`;

  h+=`<section class="pg">${run()}<div class="eb">06 / Your week</div><h2>How the week looks</h2><div class="bar"></div>
  <p>A suggested layout. Swap the days around to suit you; keep the number of times you play each game.</p>
  <div class="wk">${plan.week.map((s,i)=>`<div><small>Session ${i+1}</small>${s.games.map(g=>`<b>${esc(GAMES[g].name)}${GAMES[g].set?` <span style=\"font-family:Inter,sans-serif;font-size:10px\">${esc(GAMES[g].set)}</span>`:""}</b>`).join("")}<span>${s.mins} min</span></div>`).join("")}</div>
${plan.gain>0.05?`<div class="box"><small>What it's worth</small><p>Together these areas cost you about ${sum(plan.chosen.map(c=>c.loss)).toFixed(1)} shots a round against ${esc(T)}. If you close half of each gap over the next ${plan.retestWeeks} weeks, that's about ${plan.gain.toFixed(1)} shots a round. One shot a round is worth roughly one shot off your handicap.</p></div>`:""}
    <div class="eb">07 / What we would stop chasing</div><h2>Less of this</h2><div class="bar"></div>
  ${strengths.length?`<p>These areas are already at or better than ${esc(T)}. Extra time here buys very little, so the plan leaves them alone for now.</p>
  <div class="less">${strengths.slice(0,4).map((s,i)=>`<div><em>${String(i+1).padStart(2,"0")}</em><div><b>${esc(s.name)}</b><span>${sgn(s.per)} per ${s.area.unit}, about ${sgn(s.perRound,1)} shots a round against ${esc(T)}.${s.you?" "+esc(s.you)+".":""}</span></div></div>`).join("")}</div>`
  :`<p>Nothing in this test came out better than ${esc(T)} yet. That's normal for a first test against a stretching target. The plan puts your time where the gap is biggest first.</p>`}
  <div class="box"><small>How we read this</small><p>A test is one sample. Some of the gap between areas will be noise, which is why we retest rather than keep adding to the plan. If an area improves, its time moves to the next biggest leak.</p></div>
  ${foot()}</section>`;

  /* ---- page 6: retest + the rest of your game ---- */
  const doneT=new Set(ctx.leaks.map(l=>l.test).concat([ctx.test]));const others=Object.keys(TESTS).filter(k=>!doneT.has(k));
  h+=`<section class="pg">${run()}<div class="eb">08 / Then</div><h2>Retest in ${plan.retestWeeks} weeks</h2><div class="bar"></div>
  <p>After ${plan.retestWeeks} weeks, take the ${esc(test.name)} again. Same shots, same scoring, same target. Your new numbers build your next plan: areas that have closed the gap drop out, and the next biggest leak takes their time.</p>
  <div class="chips"><span>Test</span><span>Plan</span><span>Train</span><span>Retest</span><span>New plan</span></div>
  <div class="eb">09 / The rest of your game</div><h2>${others.length?"Tests to take next":"Your whole game"}</h2><div class="bar"></div>
  <p>${srcs.length>1?`This plan is built from your ${esc(srcs.join(", ").replace(/, ([^,]*)$/," and $1"))} results together, so your practice time is shared across your game by shots lost.`:`This plan is built from your ${esc(test.name)} only. It gets more accurate as each test is added, because practice time is then shared across your whole game by shots lost.`}</p>
  <div class="less">${others.map((k,i)=>`<div><em>${String(i+1).padStart(2,"0")}</em><div><b><a href="${TESTS[k].url}" style="color:inherit;text-decoration:none">${esc(TESTS[k].name)}</a></b><span>${k==="long"?"Driving and approach play, scored on a launch monitor.":k==="short"?"Chipping, pitching, rough, bunkers and awkward lies.":"Putting from 3 to 50 ft."}${thought&&GROUP_TEST[thought]===k?" You told us this is where you think shots go.":""}</span></div></div>`).join("")}</div>
  <div class="eb">10 / Where the numbers come from</div><h2>The statistics</h2><div class="bar"></div>
  <ul class="src">
   <li><b>Strokes gained.</b> Each shot is valued as the average strokes to hole out from where it started, minus one, minus the average from where it finished (Mark Broadie, <i>Every Shot Counts</i>, 2014). Tour values come from PGA Tour ShotLink data.</li>
   <li><b>Handicap levels.</b> The averages for each handicap come from Shot Scope's amateur performance data, matched to Broadie's tour baseline.</li>
   <li><b>Shots a round.</b> How often each shot comes up is an estimate for a 10–15 handicap from the same sources. Your own rounds will differ a little.</li>
   <li><b>Why games, not drills.</b> Practice with a score, random order and a consequence transfers to the course better than repeating one shot (Porter and Magill, 2010; Shea and Morgan, 1979).</li>
   <li><b>The estimate of what it's worth</b> assumes you close half of each gap. It is a planning figure, not a promise.</li></ul>
  ${foot()}</section>`;

  /* ---- page 7: big picture ---- */
  h+=`<section class="pg">${run()}<div class="eb">11 / The big picture</div><h2>What this means for you</h2><div class="bar"></div>
  <p>${worst?`Your test points clearly at ${esc(worst.name.toLowerCase())}${losses[1]?`, then ${esc(losses[1].name.toLowerCase())}`:""}. That's where your practice goes first.`:`Your test shows no single big leak against ${esc(T)}.`} ${best?`${esc(best.name)} is already a strength, so it gets no extra time.`:""}</p>
  <p>Play the games, keep the scores, and retest in ${plan.retestWeeks} weeks. The numbers will tell us what changed and where your time goes next.</p>
  <div class="big"><div>Test.</div><div>Plan.</div><div>Train.</div><div class="g">Retest.</div></div>
  <div style="display:flex;justify-content:space-between;align-items:flex-end;border-top:2px solid #0B0B0B;padding-top:16px;margin-top:26px">
  <div style="font-family:Anton,Impact,sans-serif;font-size:28px;line-height:1.05;text-transform:uppercase">Your practice.<br><span style="background:#FFD900;padding:0 6px">Changed forever.</span></div>
  <div style="font-size:11px;font-weight:700;letter-spacing:2px;color:#77715F;text-transform:uppercase;text-align:right">Copyright Macro Golf Studios Ltd<br>macro.golf</div></div>
  ${foot()}</section>`;
  return `<div class="mgr">${h}</div>`;
}

<script>/* one record for everything on this page, saved to the cloud by sync.js (same email + PIN as the golf games) */

<script>
(function(){
const $=id=>document.getElementById(id);
const app=$("app");

/* =====================================================================
   Strokes gained model (same baselines as the Long Game Test)
   ===================================================================== */
const FW=[[50,2.66],[60,2.70],[70,2.72],[80,2.75],[90,2.78],[100,2.80],[120,2.85],[140,2.91],[160,2.98],[180,3.05],[200,3.19],[220,3.32],[240,3.45],[260,3.55],[280,3.65],[300,3.71],[350,3.87],[400,4.00]];
const SG_SHORT={fw:[[0,1.0],[5,2.05],[10,2.18],[20,2.40],[30,2.52],[40,2.60],[50,2.66]],rough:[[0,1.0],[5,2.2],[10,2.34],[20,2.59],[30,2.70],[40,2.78],[50,2.87]]};
const PUTT=[[0,1.0],[2,1.01],[3,1.04],[4,1.13],[5,1.23],[6,1.34],[7,1.42],[8,1.50],[10,1.61],[15,1.78],[20,1.87],[30,1.98],[40,2.06],[50,2.14],[60,2.21],[90,2.35]];
function interp(t,x){if(x<=t[0][0])return t[0][1];for(let i=1;i<t.length;i++){if(x<=t[i][0]){const a=t[i-1],b=t[i];return a[1]+(b[1]-a[1])*(x-a[0])/(b[0]-a[0])}}const a=t[t.length-2],b=t[t.length-1];return b[1]+(b[1]-a[1])/(b[0]-a[0])*(x-b[0])}
const LV=[["Tour",-5,0,0,300,.60,.03],["0",0,.15,.06,270,.55,.05],["5",5,.32,.09,255,.52,.06],["10",10,.48,.12,240,.48,.08],["15",15,.63,.15,228,.45,.10],["20",20,.78,.18,215,.42,.12],["25",25,.93,.21,200,.40,.14],["30",30,1.08,.24,185,.38,.16]];
const TARGETS=LV.map(x=>x[0]);
const hcName=h=>h==="Tour"?"Tour":h==="0"?"Scratch":h+" hc";
const hcNum=h=>LV.find(x=>x[0]===h)[1];
function lerpL(a,b,t){const L=i=>a[i]+(b[i]-a[i])*t;return {g:Math.max(-0.2,L(2)),gp:Math.max(-0.05,L(3)),D:L(4),fw:Math.min(.8,Math.max(.2,L(5))),pen:Math.min(.4,Math.max(0,L(6)))}}
function P(n){if(n<=-5)return lerpL(LV[0],LV[1],(n+5)/5);for(let i=1;i<LV.length;i++){if(n<=LV[i][1]){const a=LV[i-1],b=LV[i];return lerpL(a,b,(n-a[1])/(b[1]-a[1]))}}const a=LV[LV.length-2],b=LV[LV.length-1];return lerpL(a,b,(n-a[1])/(b[1]-a[1]))}
/* expected strokes to hole out for handicap number n. lie: green (yds), fw, tight, rough, sand, trouble */
function E(n,lie,yds){const p=P(n);
  if(lie==="green"){const ft=yds*3;if(ft<=0)return 0;/* the Putting Test table: distance only */if(typeof puttE==="function")return puttE(n,ft);return interp(PUTT,ft)+p.gp*Math.min(1.3,0.4+ft/20)}
  if(lie==="sand")return interp(SG_SHORT.rough,Math.min(yds,50))+0.25+p.g*0.75*1.35+(yds>50?(yds-50)*0.006:0);
  if(yds<=50){const base=interp(lie==="rough"?SG_SHORT.rough:SG_SHORT.fw,yds)+(lie==="tight"?0.04:0);return base+p.g*0.75*(lie==="rough"?1.15:1)}
  const base=interp(FW,yds)+(lie==="fw"||lie==="tight"?0:lie==="rough"?0.15+0.1*Math.min(1,(yds-100)/100):0.45);
  return base+p.g*(0.6+0.4*Math.min(yds,300)/150)*(lie==="fw"||lie==="tight"?1:lie==="rough"?1.15:1.3);
}
function Etee(n,L){const p=P(n),R=Math.max(30,L-p.D);return 1+p.fw*E(n,"fw",R)+(1-p.fw-p.pen)*E(n,"rough",R)+p.pen*(1+E(n,"rough",R))}
const greenR=d=>8+0.03*d;
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const sum=a=>a.reduce((x,y)=>x+y,0);
const fmt=x=>(x>=0?"+":"−")+Math.abs(x).toFixed(1);
const fmt2=x=>(x>=0?"+":"−")+Math.abs(x).toFixed(2);
function hcTxt(x){if(x===null||x===undefined||isNaN(x))return"–";const r=Math.round(x);if(r<=-10)return"+10";if(r<0)return"+"+(-r);if(r===0)return"Scratch";return (r>36?"36+":r)+" hc"}

/* where a full shot finished and what it is worth */
function endApp(s,carry,off){
  const ao=Math.abs(off),h=s.haz,onHaz=h&&ao>0&&((off<0&&h.side==="L")||(off>0&&h.side==="R"));
  const dc=carry-s.d,p=Math.sqrt(dc*dc+ao*ao);
  if(onHaz&&ao>h.line)return {pen:1,lie:"rough",rem:Math.max(15,p),desc:"Penalty",zone:"pen"};
  if(p<=greenR(s.d))return {pen:0,lie:"green",rem:p,desc:Math.round(p*3)+" ft",zone:"green"};
  return {pen:0,lie:ao>30?"trouble":p<=greenR(s.d)+10?"fw":"rough",rem:p,desc:"Missed green, "+Math.round(p)+" yds",zone:"miss"};
}
function endTee(s,carry,off){
  const ao=Math.abs(off),h=s.haz,onHaz=h&&ao>0&&((off<0&&h.side==="L")||(off>0&&h.side==="R"));
  const total=carry*1.06,ahead=s.L-total,rem=Math.max(5,Math.sqrt(ahead*ahead+ao*ao));
  if(onHaz&&h.type!=="bunker"&&ao>h.line)return {pen:1,lie:"rough",rem:Math.max(5,Math.abs(ahead)),desc:"Penalty",zone:"pen"};
  if(h&&h.type==="bunker"&&onHaz&&total>=h.from&&total<=h.to&&ao>=h.inner&&ao<=h.outer)return {pen:0,lie:"sand",rem,desc:"Fairway bunker",zone:"miss"};
  if(ao<=s.fwHalf)return {pen:0,lie:"fw",rem,desc:"Fairway",zone:"fw"};
  if(ao<=s.fwHalf+20)return {pen:0,lie:"rough",rem,desc:"Rough",zone:"miss"};
  return {pen:0,lie:"trouble",rem,desc:"Trouble",zone:"miss"};
}
/* strokes gained for any recorded shot, against handicap number n */
function shotSG(s,r,n){
  if(s.kind==="app"){const st=endApp(s,r.c,r.o);return {sg:E(n,"fw",s.d)-1-st.pen-E(n,st.lie,st.rem),st}}
  if(s.kind==="tee"){const st=endTee(s,r.c,r.o);return {sg:Etee(n,s.L)-1-st.pen-E(n,st.lie,st.rem),st}}
  if(s.kind==="sg"){const after=r.ft===0?0:E(n,"green",r.ft/3);return {sg:E(n,s.lie,s.d)+s.adj*(1+Math.max(0,n)/30)-1-after,st:{desc:r.ft===0?"Holed":r.ft+" ft"}}}
  if(s.kind==="putt"){/* distance only: slope and break don't change the number */const after=r.ft===0?0:E(n,"green",r.ft/3);return {sg:E(n,"green",s.ft/3)-1-after,st:{desc:r.ft===0?"Holed":r.label||r.ft+" ft"}}}
  return {sg:0,st:{desc:""}};
}

const AREAS={drive:"Driving",app:"Approach",short:"Short game",putt:"Putting"};
const FAM={drive:"long",app:"long",short:"near",putt:"near"};
const ORDER=["app","drive","short","putt"];
const areaNames=as=>(as||[]).map(a=>AREAS[a]).join(" + ");
const fl=(c,a)=>{const f=(c.focus||{})[a];return Array.isArray(f)?f:f?[f]:[]};
const view=(c,a)=>{const fs=fl(c,a);return Object.assign({},c,{area:a,focus:fs[0],focuses:fs})};
const has=(c,k)=>(c.focuses||[c.focus]).includes(k);
function norm2(x){if(x)norm(x.cfg);return x}
function norm(c){if(c&&c.focus)Object.keys(c.focus).forEach(a=>{if(!Array.isArray(c.focus[a]))c.focus[a]=c.focus[a]?[c.focus[a]]:[]});return c}
const AREA_SUB={drive:"Long game · tee shots",app:"Long game · into the green",short:"Chips, pitches and bunkers",putt:"On the green"};
/* weekly-play weights from the plan builder: how many times each shot comes up in a round */
const FREQ={"lg.drv":11,"lg.speed":11,"lg.fwt":2,"lg.wedge":5,"lg.mid":4,"lg.long":3,"lg.fwg":1,"sg.chip":3,"sg.pitch":2,"sg.rough":1.5,"sg.bunker":1,"sg.slope":1,"sg.lob":.5,"putt.s":5,"putt.m":4,"putt.mid":5,"putt.l":4,"putt.lag":2};
const SUBNAME={"lg.drv":"driver accuracy","lg.speed":"driver distance","lg.fwt":"fairway clubs off the tee","lg.wedge":"wedges and short irons","lg.mid":"mid irons","lg.long":"long irons and hybrids","lg.fwg":"fairway clubs into the green","sg.chip":"chipping","sg.pitch":"pitching","sg.rough":"short game from the rough","sg.bunker":"bunker play","sg.slope":"awkward lies","sg.lob":"lob and flop shots","putt.s":"putts from 3–6 ft","putt.m":"putts from 6–10 ft","putt.mid":"putts from 10–20 ft","putt.l":"putts from 20–35 ft","putt.lag":"putts from 35–50 ft"};
const groupOf=k=>k==="lg.drv"||k==="lg.speed"||k==="lg.fwt"?"drive":k.startsWith("lg.")?"app":k.startsWith("sg.")?"short":"putt";
const TESTNAME={long:"Long Game Test",short:"Short Game Test",putting:"Putting Test"};
/* recommendation: the area that loses most shots per round across the last 12 weeks of tests */
function recommend(){
  const all=rd("macroResults")||{};let rows=[];
  Object.keys(all).forEach(t=>{const v=all[t];if(v&&v.raw&&(!v.t||Date.now()-v.t<84*864e5))v.raw.forEach(x=>{if(FREQ[x.key]&&x.n>0)rows.push({key:x.key,test:t,pr:x.per*FREQ[x.key]})})});
  if(!rows.length)return null;
  const g={};rows.forEach(r=>{const k=groupOf(r.key);g[k]=(g[k]||0)+r.pr});
  const area=Object.keys(g).sort((a,b)=>g[a]-g[b])[0];
  const worst=rows.filter(r=>groupOf(r.key)===area).sort((a,b)=>a.pr-b.pr)[0];
  if(g[area]>-0.05)return {area:null,tests:[...new Set(rows.map(r=>r.test))]};
  return {area,lost:-g[area],sub:worst.key,test:worst.test,tests:[...new Set(rows.map(r=>r.test))]};
}
function recFocus(rec,area){if(!rec||rec.area!==area)return null;const k=rec.sub;
  if(area==="drive")return k==="lg.speed"?"speed":"accuracy";
  if(area==="app")return "distance";
  if(area==="short")return ["sg.bunker","sg.rough","sg.slope"].includes(k)?"strike":k==="sg.lob"?"flight":"distance";
  if(area==="putt")return k==="putt.s"?"short":k==="putt.m"||k==="putt.mid"?"mid":"pace";}
function recZones(rec){if(!rec||rec.area!=="app")return null;return {"lg.wedge":[[100,125],[125,150]],"lg.mid":[[150,175]],"lg.long":[[175,200]],"lg.fwg":[[175,200]]}[rec.sub]||null}

const TIME={ /* minutes for: warm-up, technical, focus drill, game, warm-down */
  long:{30:[12,0,0,15,3],45:[12,10,8,12,3],60:[12,15,10,20,3],90:[12,18,20,35,5],120:[12,20,30,53,5]},
  short:{30:[5,0,7,15,3],45:[5,7,10,20,3],60:[5,10,12,30,3],90:[5,15,20,45,5],120:[5,20,30,60,5]},
  putt:{30:[0,0,8,19,3],45:[0,7,10,25,3],60:[0,10,12,35,3],90:[0,12,20,53,5],120:[0,15,30,70,5]}
};
const r5=x=>Math.max(5,Math.round(x/5)*5);
function build(c){
  const as=ORDER.filter(a=>c.areas.includes(a)),fam=FAM[as[0]]==="long"?"long":as.includes("short")?"short":"putt",T=TIME[fam][c.mins],B=[];
  const two=as.length>1,strikeMins=fam==="long"&&T[1]?2:0;
  let drillM=T[2],gameM=T[3];
  if(two&&drillM&&drillM<12){gameM+=drillM;drillM=0}
  if(fam==="long"){
    B.push({type:"tick",id:"body",title:"Body warm up",mins:5,lines:["Follow the full Macro Golf 5 minute body warm up in the app.","Tick it off when you're done."]});
    B.push({type:"ladder",id:"ladder",title:"Ladder up to 70 yds",mins:5,shots:[]});
    B.push({type:"strike",id:"strike1",title:"Strike station",mins:2,balls:5,hits:[]});
  }
  /* short game sessions (Jack, 13 Nov): body warm up, 5 min tight lie strike (the technical bit), then the landing ladder
     when there's time (45 min and up). That uses the technical minutes; anything short comes off the game. */
  let techM=T[1];
  if(fam==="short"){const lad=c.mins>=45,need=5+(lad?5:0);shortStart(B,lad);if(techM>=need)techM-=need;else{gameM-=need-techM;techM=0}if(techM<5){gameM+=techM;techM=0}}
  else if(as.includes("short")){const wm=5;gameM-=5;
    B.push({type:"zones",id:"warm",title:"Warm-up ladder",mins:wm,zones:[[10,12],[12,14],[14,16],[16,18],[18,20]],rounds:2,res:[],area:"short",
    lines:["Land each ball in the next zone. Each zone is 2 yds deep.","Two trips up the ladder."]});}
  if(techM)B.push({type:"tick",id:"tech",title:"What you're working on technically",mins:techM-strikeMins,timer:true,
    lines:fam==="putt"?["Your own stroke work. Rehearse it, then bring it into a few putts.","Focus on the movement, not where the ball goes."]:["Your own swing work. Rehearse it with no ball, then bring it into the ball with slow motion swings.","Focus on the movement, not the ball flight."]});
  if(strikeMins)B.push({type:"strike",id:"strike2",title:"Strike station repeat",mins:2,balls:5,hits:[],lines:["Check the strike holds after the technical work."]});
  as.forEach((a,k)=>{const v=view(c,a),fs=v.focuses,dm=two?Math.round(drillM/2):drillM;let gm=two?(k===0?Math.ceil(gameM/2):Math.floor(gameM/2)):gameM;
    if(dm&&fs.length){const per=Math.max(5,Math.round(dm/fs.length));gm-=per*fs.length-dm;
      fs.forEach(f=>{const d=drill(Object.assign({},v,{focus:f}),per);d.area=a;if(two)d.title=AREAS[a]+": "+d.title;B.push(d)})}
    const g=game(v,gm);g.area=a;if(two)g.title=AREAS[a]+": strokes gained game";B.push(g)});
  B.push(warmDown(view(c,as[as.length-1]),T[4]));
  return B;
}
function drill(c,m){
  const f=c.focus;
  if(c.area==="drive"){
    if(f==="speed")return {type:"speed",id:"drill",title:"Speed push",mins:m,base:[],swings:[],metric:"club"};
    return {type:"count",id:"drill",title:"Start line gate",mins:m,total:r5(m),res:[],viz:"corridor",cap:"Start it between the targets",lines:["Pick two flags or markers about 30 yds apart. Every drive has to start between them.","Tick if it starts inside the gate."]};
  }
  if(c.area==="app"){
    if(f==="strike")return {type:"strike",id:"drill",title:"Strike focus",mins:m,balls:Math.max(10,r5(m)),hits:[],lines:["Same club, same target. Tap where each ball came off the face."]};
    if(f==="misses"){const sd=c.lavaSide;if(sd==="S"||sd==="G")return {type:"count",id:"drill",title:"Safe side",mins:m,total:r5(m),res:[],viz:"safe",side:sd,cap:sd==="S"?"Never short":"Never long",lines:sd==="S"?["Pick a flag in your zone. Short of the flag is lava: take enough club.","Tick if the ball finishes on the green or past the flag."]:["Pick a flag in your zone. Long is lava: favour the front of the green.","Tick if the ball finishes on the green or short of the flag."]};
      return {type:"count",id:"drill",title:"Safe side",mins:m,total:r5(m),res:[],viz:"safe",side:sd,cap:"Miss it on the safe side",lines:["Pick a flag in your zone. Your "+(sd==="L"?"left":"right")+" side is trouble.","Tick if the ball finishes on the green or on the safe side."]}}
    const tg=[];const z=c.zones;for(let i=0;i<Math.max(6,Math.round(m));i++){const zz=z[i%z.length];tg.push(Math.round(ri(zz[0],zz[1])))}
    return {type:"carry",id:"drill",title:"Carry the number",mins:m,targets:shuffle(tg),res:[]};
  }
  if(c.area==="short"){
    if(f==="strike"){const sand=c.bunker;return {type:"count",id:"drill",title:sand?"Ball first from the sand":"Ball first from a tight lie",mins:m,total:r5(m*1.2),res:[],viz:sand?"sandline":"tightlie",cap:sand?"Ball first. Sand after the line.":"Ball first. Turf after the ball.",
      lines:sand?["Draw a line in the sand. Set the ball just in front of it.","Chip it out. Tick if you hit the ball first and the sand was only touched after the line."]:["Find the tightest or wettest lie you can.","Tick if you hit the ball first, then the turf."]}}
    if(f==="flight"){const calls=[];for(let i=0;i<Math.max(9,Math.round(m*1.2/3)*3);i++)calls.push(["Low","Mid","High"][i%3]);return {type:"count",id:"drill",title:"Three flights",mins:m,total:calls.length,calls,res:[],viz:"flights",cap:"One flag. Three flights.",lines:["Pick one flag. Play the flight called on screen.","Tick if the ball flew the way you called it."]}}
    const top=Math.min(c.chipMax,40),zs=[];for(let i=0;i<5;i++){const a=Math.round(15+(top-17)*i/4);zs.push([a,a+2])}
    return {type:"zones",id:"drill",title:"Landing zones",mins:m,zones:zs,rounds:Math.max(2,Math.round(m*1.2/5)),res:[],lines:["Set five clubs on the ground to mark the zones. Each zone is 2 yds deep.","Land the ball in the zone shown. Work up through them."]};
  }
  if(f==="break")return {type:"count",id:"drill",title:"Tee in the hole",mins:m,total:r5(m*1.5),res:[],viz:"breaker",cap:"Visualise this shape.",lines:["Push a tee into the middle of the hole.","Tick if the ball falls in the side."]};
  if(f==="pace")return {type:"count",id:"drill",title:"Lag ladder",mins:m,total:r5(m*1.5),res:[],viz:"lag",cap:"Finish inside a putter length",lines:["Putt to 20, 30 and 40 ft, then repeat.","Tick if it finishes within a putter length of the hole."]};
  return {type:"count",id:"drill",title:"Gate drill",mins:m,total:r5(m*1.5),res:[],viz:"gate",cap:"Through the gate",lines:["Two tees just wider than the ball, a putter head in front of it.",f==="short"?"Putt from 4 ft. Tick if it goes through the gate.":"Putt from 8 ft. Tick if it goes through the gate."]};
}
function game(c,m){
  let shots=[];
  if(c.area==="app"){const n=Math.min(40,Math.max(8,Math.round(m/1.0)));const z=c.zones;
    for(let i=0;i<n;i++){const zz=z[i%z.length],d=ri(zz[0],zz[1]);shots.push(appShot(d,c))}shots=shuffle(shots)}
  else if(c.area==="drive"){const n=Math.min(30,Math.max(8,Math.round(m/1.25)));for(let i=0;i<n;i++)shots.push(teeShot(c,i))}
  else if(c.area==="short"){const n=Math.min(45,Math.max(10,Math.round(m/1.1)));for(let i=0;i<n;i++)shots.push(sgShot(c,["E","M","H"][i%3]))}
  else{shots=puttSet(c,Math.min(70,Math.max(12,Math.round(m/0.75))))}
  return {type:"game",id:"game",title:"Strokes gained game",mins:m,shots,res:[]};
}
function warmDown(c,m){
  const L={drive:["Three drives with your full on-course routine. Pick a fairway on the range and commit to it.","Finish on a shot you like."],
    app:["Three balls with your full on-course routine. New target and new club every ball.","Finish on a shot you like."],
    short:["Five 3 ft putts to finish.","Walk away with the ball going in."],
    putt:["Three 3 ft putts in a row to finish.","Walk away with the ball going in."]}[c.area];
  return {type:"tick",id:"down",title:"Warm down",mins:m,lines:L};
}

/* shot generators */
function hazard(chance,side){if(Math.random()>chance)return null;side=side||pick(["L","R"]);const t=pick(["Water","Out of bounds"]);return {type:t==="Water"?"water":"ob",side,line:12,name:t+" "+(side==="L"?"left":"right")}}
function appShot(d,c){const lava=has(c,"misses")&&(c.lavaSide==="L"||c.lavaSide==="R");return {kind:"app",d,haz:lava?{type:"water",side:c.lavaSide,line:12,name:"Water "+(c.lavaSide==="L"?"left":"right")}:hazard(0.3)}}
function teeShot(c,i){const club=c.drvCarry;const L=Math.round((club*1.06+ri(110,175))/5)*5,par=L>470?5:4,fwHalf=pick([13,14,15,16]);
  const r=Math.random(),side=pick(["L","R"]),sd=side==="L"?"left":"right";let haz=null;
  if(r<0.25){const from=Math.round((club*1.06-20+ri(-10,10))/5)*5;haz={type:"bunker",side,from,to:from+25,inner:fwHalf-6,outer:fwHalf+8,line:999,name:"Bunker "+sd}}
  else if(r<0.6){const t=r<0.45?"Water":"Out of bounds";haz={type:t==="Water"?"water":"ob",side,line:fwHalf+15,name:t+" "+sd}}
  return {kind:"tee",L,par,fwHalf,haz}}
const SG_SIT={
  E:[["Plenty of green",0],["Middle pin",0],["Good lie",0]],
  M:[["Front pin",.06],["Back pin",.05],["Raised green",.06],["Over a slope",.06]],
  H:[["Short-sided",.18],["Green running away",.18],["Over a bunker",.2]]
};
function sgShot(c,diff){
  const lies=["fw","fw","tight","rough"];if(c.bunker)lies.push("sand");
  if(has(c,"strike")){lies.push("tight","tight");if(c.bunker)lies.push("sand","sand")}
  let lie=pick(lies);const max=Math.max(15,Math.min(50,c.chipMax));
  let d=lie==="sand"?ri(8,Math.max(10,Math.min(c.bunkerMax,30))):has(c,"distance")?ri(10,max):ri(6,max);
  const sit=pick(SG_SIT[diff]).slice();let adj=sit[1];
  if(lie==="sand"&&diff==="H"&&Math.random()<.5){sit[0]="Plugged";adj=.35}
  if(lie==="rough"&&diff==="H")adj+=.08;
  if(has(c,"flight")&&Math.random()<.4){sit[0]=pick(["Over a bunker","Under a branch, keep it low","Raised green"]);}
  const lieName={fw:"Fairway",tight:"Tight lie",rough:"Rough",sand:"Bunker"}[lie];
  const type=lie==="sand"?"Bunker shot":d<=20?"Chip":"Pitch";
  return {kind:"sg",lie,d,adj,diff,name:type+" · "+sit[0],facts:[lieName,d+" yds",sit[0]]};
}
function brk(){return {slope:pick(["Uphill","Downhill","Flat"]),bk:pick(["Straight","Small break","Medium break","High break"]),dir:pick(["left to right","right to left"])}}
function puttSet(c,n){const fs=c.focuses&&c.focuses.length?c.focuses:[c.focus];if(fs.length<2)return puttOne(c,fs[0],n);
  const per=Math.ceil(n/fs.length);return [].concat(...fs.map(f=>puttOne(c,f,per))).slice(0,n)}
function puttOne(c,f,n){const out=[];
  if(f==="short"){const sides=[["North","Downhill"],["East","Sidehill"],["South","Uphill"],["West","Sidehill"]];let i=0;
    while(out.length<n){const ft=[3,4,5][Math.floor(i/4)%3],sd=sides[i%4];out.push({kind:"putt",ft,adj:sd[1]==="Downhill"?.04:sd[1]==="Sidehill"?.03:0,mode:"hm",facts:[ft+" ft",sd[0],sd[1]]});i++}}
  else if(f==="mid"){let i=0;while(out.length<n){const ft=[6,8,10,12][Math.floor(i/5)%4],b=brk();out.push({kind:"putt",ft,adj:(b.slope==="Downhill"?.05:0)+(b.bk==="High break"?.06:b.bk==="Medium break"?.03:0),mode:"hm",facts:[ft+" ft",b.slope,b.bk==="Straight"?"Straight":b.bk+", "+b.dir]});i++}}
  else if(f==="pace"){const st=n>=20?[12,15,18,21,24,24,27,30,33,36]:[12,15,18,21,24];let i=0;while(out.length<n){const ft=st[Math.floor(i/2)%st.length],b=brk();out.push({kind:"putt",ft,adj:0,mode:"pace",facts:[ft+" ft",b.slope,b.bk==="Straight"?"Straight":b.bk+", "+b.dir]});i++}}
  else{let i=0;while(out.length<n){const ft=[6,8,10,12,15][i%5],bk=pick(["Medium break","High break"]),dir=pick(["left to right","right to left"]),sl=pick(["Uphill","Downhill","Flat"]);out.push({kind:"putt",ft,adj:bk==="High break"?.07:.04,mode:"pace",dir,facts:[ft+" ft",sl,bk+", "+dir]});i++}}
  return out}

const C={deep:"#1d4d2b",rough:"#3d7a45",fw:"#6aa85a",green:"#8fd07a",water:"#2b7fc4",sand:"#eadcae",ink:"#0B0B0B",white:"#FFFFFF",gold:"#FFD900",turf:"#5d8f4e"};
const T=(x,y,str,o={})=>`<text x="${x}" y="${y}" font-family="Inter,Arial,sans-serif" font-size="${o.s||10}" font-weight="${o.w||700}" text-anchor="${o.a||"middle"}" fill="${o.c||C.white}" letter-spacing=".5">${str}</text>`;
const flag=(x,y)=>`<line x1="${x}" y1="${y}" x2="${x}" y2="${y-20}" stroke="${C.white}" stroke-width="1.5"/><path d="M${x} ${y-20} l9 3 -9 3z" fill="${C.gold}"/>`;
const ballDot=(x,y)=>`<circle cx="${x}" cy="${y}" r="5.5" fill="${C.white}" stroke="${C.ink}" stroke-width="2"/>`;
/* approach geometry: tap position <-> carry and offline */
const AG={W:300,H:180,k:2.4};AG.cx=150;AG.cy=AG.H/2+6;
function appSVG(s,ball){const {W,H,k,cx,cy}=AG,r=greenR(s.d),h=s.haz,X=y=>cx+y*k,Y=d=>cy-d*k;
  let g=`<rect width="${W}" height="${H}" fill="${C.rough}"/><ellipse cx="${cx}" cy="${cy}" rx="${(r+7)*k}" ry="${(r+5)*k}" fill="${C.fw}"/><ellipse cx="${cx}" cy="${cy}" rx="${r*k}" ry="${r*k*.85}" fill="${C.green}"/>`+flag(cx,cy);
  if(h){const sg=h.side==="L"?-1:1;
    if(h.type==="ob"){const x1=X(sg*h.line);g+=`<line x1="${x1}" y1="0" x2="${x1}" y2="${H}" stroke="${C.white}" stroke-width="2" stroke-dasharray="2 7"/>`+T(sg<0?x1-14:x1+14,cy+3,"OB")}
    else{const x1=X(sg*h.line),x2=sg<0?0:W;g+=`<rect x="${Math.min(x1,x2)}" y="0" width="${Math.abs(x2-x1)}" height="${H}" fill="${C.water}"/>`+T((x1+x2)/2,cy+3,"WATER")}}

function appFromTap(s,x,y){return {c:Math.round(s.d+(AG.cy-y)/AG.k),o:Math.round((x-AG.cx)/AG.k)}}
function teeGeo(s){const W=300,H=300,top=26,bot=H-22,sy=(bot-top)/(s.L+10);return {W,H,top,bot,sy,X:y=>150+y*2.3,Y:d=>bot-d*sy}}
function teeSVG(s,ball){const G=teeGeo(s),{W,H,top,bot,X,Y}=G,L=s.L,fh=s.fwHalf,h=s.haz;
  let g=`<rect width="${W}" height="${H}" fill="${C.deep}"/><rect x="${X(-(fh+20))}" y="${top-10}" width="${(fh+20)*4.6}" height="${bot-top+18}" fill="${C.rough}"/>`;
  const f0=Math.min(110,L*0.3);g+=`<rect x="${X(-fh)}" y="${Y(L-22)}" width="${fh*4.6}" height="${Y(f0)-Y(L-22)}" rx="16" fill="${C.fw}"/>`;
  g+=`<circle cx="150" cy="${Y(L)}" r="${24}" fill="${C.green}"/>`+flag(150,Y(L))+`<rect x="141" y="${bot+2}" width="18" height="8" fill="${C.fw}"/>`;
  if(h){const sg=h.side==="L"?-1:1;
    if(h.type==="water"){const x1=X(sg*h.line),x2=sg<0?0:W;g+=`<rect x="${Math.min(x1,x2)}" y="${Y(L-5)}" width="${Math.abs(x2-x1)}" height="${Y(Math.max(80,L*0.3))-Y(L-5)}" fill="${C.water}"/>`+T((x1+x2)/2,Y(L*0.55),"WATER")}

function missing(c){
  const as=c.areas||[];
  if(!as.length)return "Choose an area";
  if(FAM[as[0]]==="long"&&c.lm===null)return "Answer the launch monitor question";
  if(as.includes("app")&&!c.zones.length)return "Pick at least one distance";
  if(as.includes("short")&&c.bunker===null)return "Answer the bunker question";

function planList(B,cur){return `<div class="planlist">${B.map((b,i)=>`<div class="row ${i<cur?"done":""} ${i===cur?"cur":""}"><span class="n">${i<cur?"✓":String(i+1).padStart(2,"0")}</span><span class="t">${b.title}<small>${blockSub(b)}</small></span><span class="m">${b.mins} min</span></div>`).join("")}</div>`}

   <div class="grid"><table><thead><tr><th>Date</th><th>Area</th><th class="r">Played like</th><th class="r">SG</th></tr></thead><tbody>${LOGS.slice(0,8).map(l=>`<tr><td>${new Date(l.t).toLocaleDateString("en-GB",{day:"numeric",month:"short"})}</td><td>${l.areas?areaNames(l.areas):AREAS[l.area]}</td><td class="r">${l.plan?"Plan":hcTxt(l.hc)}</td><td class="r ${l.sg==null?"":l.sg>=0?"up":"down"}">${l.sg==null?"–":fmt(l.sg)}</td></tr>`).join("")}</tbody></table></div></div>`}
function streak(){const days=new Set(LOGS.map(l=>new Date(l.t).toDateString()));let n=0,d=new Date();if(!days.has(d.toDateString()))d.setDate(d.getDate()-1);while(days.has(d.toDateString())){n++;d.setDate(d.getDate()-1)}return n}
const esc=s=>String(s||"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
function bindSetup(){const c=draft;
  const on=(id,ev,f)=>{const e=$(id);if(e)e.addEventListener(ev,f)};
  on("cName","input",e=>{c.name=e.target.value});
  on("cTarget","change",e=>{c.target=e.target.value;strip(c)});
  const slide=(id,key,fmtv)=>on(id,"input",e=>{c[key]=+e.target.value;$(id+"O").textContent=fmtv(c[key])});
  slide("cRange","rangeMax",v=>v>=320?"No limit":v+" yds");on("cRange","change",()=>{c.zones=c.zones.filter(z=>z[0]<=c.rangeMax||c.rangeMax>=320);renderSetup()});
  slide("cDrv","drvCarry",v=>v+" yds");on("cDrv","change",renderSetup);
  slide("cChip","chipMax",v=>v+" yds");on("cChip","change",renderSetup);
  slide("cBunk","bunkerMax",v=>v+" yds");on("cBunk","change",renderSetup);
}

/* ---------- running a session ---------- */
function startSession(){const c=JSON.parse(JSON.stringify(draft));S={step:"run",cfg:c,blocks:build(c),bi:0,t0:Date.now()};ui={};save();render();window.scrollTo(0,0)}
function cur(){return S.blocks[S.bi]}
function games(){return S.blocks.filter(b=>b.type==="game")}
function combo(list){list=list||games();return {shots:[].concat(...list.map(g=>g.shots.slice(0,g.res.length))),res:[].concat(...list.map(g=>g.res))}}
function renderRun(){
  const c=S.cfg,b=cur();strip(c);
  const g=combo(),n=g.res.length,tn=hcNum(c.target);

    <div class="side"><span class="label">Time</span><b>${c.mins} min</b></div>
    <div class="prog">${S.blocks.map((x,i)=>`<i class="${i<S.bi?"on":i===S.bi?"cur":""}"></i>`).join("")}</div>
    <div class="bstat">Block ${S.bi+1} of ${S.blocks.length}: ${b.title}.${b.type==="play"?" Your score counts on the leaderboard.":""}</div></div>`:`<div class="board"><div><span class="label">Strokes gained · ${games().length>1?"games":"game"}</span><div class="big tnum">${n?fmt(sg):"0.0"}</div></div>

    <div class="prog">${S.blocks.map((x,i)=>`<i class="${i<S.bi?"on":i===S.bi?"cur":""}"></i>`).join("")}</div>

  h+=`<div class="card"><div class="blockhead"><div style="min-width:0"><span class="eyebrow">${String(S.bi+1).padStart(2,"0")} / ${blockSub(b)}</span><h2>${b.title}</h2></div><span class="mins">${b.mins}<small>MIN</small></span></div>`;
  h+=({tick:runTick,ladder:runLadder,strike:runStrike,zones:runZones,lad5:runLad5,count:runCount,carry:runCarry,speed:runSpeed,game:runGame,play:runPlay})[b.type](b,c);
  h+=`</div><div class="btns"><button class="ghost" data-act="back" ${S.bi===0?"disabled":""}>Previous block</button><button class="ghost" data-act="skip">${S.bi===S.blocks.length-1?"Finish session":"Skip this block"}</button></div>`;
  h+=`<details class="card"><summary class="label" style="cursor:pointer">Your plan</summary>${planList(S.blocks,S.bi)}<button class="linky" data-act="quit">End session and see the report</button></details>`;

}
const lines=b=>b.lines?`<ul class="steps">${b.lines.map(l=>`<li>${l}</li>`).join("")}</ul>`:"";
function nextBtn(label,dis){return `<button class="primary" data-act="next" ${dis?"disabled":""}>${label||"Done, next block"}</button>`}
function runTick(b){return lines(b)+(b.video?`<button class="dark playbtn" data-act="vid">▶ Play the 5 minute warm up</button>`:"")+(b.timer?`<div class="timer"><b class="tnum" id="tmr">${mmss(timerLeft(b))}</b><button class="dark" data-act="timer">${ui.timer?"Pause":"Start timer"}</button></div>`:"")+nextBtn("✓ Done, next block")}
function timerLeft(b){if(b.left===undefined)b.left=b.mins*60;return b.left}
const mmss=s=>Math.floor(s/60)+":"+String(Math.max(0,Math.floor(s%60))).padStart(2,"0");
function runLadder(b){const last=b.shots[b.shots.length-1],top=last?last.c:0,hits=b.shots.filter(s=>s.ok).length,done=top>=70;
  return `<ul class="steps"><li>Start with a short chip. Every shot must carry to where the last ball finished.</li><li>Each shot gets longer and the target changes every time, until you reach 70 yds.</li></ul>
   <div class="call"><span class="label">${last?"Carry it to where your last ball finished":"First shot"}</span><div class="d tnum">${last?last.c+"<small>yds</small>":"Short chip"}</div></div>
   <div class="ladbar"><i style="width:${Math.min(100,top/70*100)}%"></i></div><span class="muted">${top} of 70 yds · ${hits} of ${b.shots.length-(b.shots.length?1:0)} carried to the last ball</span>
   ${b.shots.length?`<div class="tally">${b.shots.map(s=>`<span class="${s.ok===null?"":s.ok?"ok":"no"}">${s.c}</span>`).join("")}</div>`:""}

   ${b.shots.length?`<button class="linky" data-act="ladUndo">Undo last</button>`:""}`}
function runStrike(b){const n=b.hits.length,done=n>=b.balls;

   `<div class="call"><span class="label">${done?"Your strike map":"Ball "+(n+1)+" of "+b.balls}</span><span class="muted" style="font-size:14px">${done?faceSummary(b.hits):"Tap where it came off the face."}</span></div>
   <div class="viz" id="face">${faceSVG(b.hits,done||n>=3)}</div>${n?`<span class="muted">${faceSummary(b.hits)}</span><button class="linky" data-act="faceUndo">Undo last</button>`:""}`+nextBtn(done?"✓ Next block":"Tap the face "+(b.balls-n)+" more time"+(b.balls-n===1?"":"s"),!done)}
/* ---------- short game session start: body warm up, tight lie strike, then the landing ladder (Jack, 13 Nov) ---------- */
const LAD_Z=[[10,12],[12,14],[14,16],[16,18],[18,20]],LAD_SEQ=[0,1,2,3,4,4,3,2,1,0];
function shortStart(B,withLadder){
  B.push({type:"tick",id:"body",title:"Body warm up",mins:5,video:true,lines:["Play the Express 5 minute body warm up and follow along.","Tick it off when you're done."]});
  B.push({type:"tick",id:"tight",title:"Technical: tight lie strike",mins:5,timer:true,lines:["Find a tight lie: bare, firm or wet ground, something that's hard to chip off.","Ball first, then the ground. Chip off it for 5 minutes and just find the strike.","No target to worry about. A clean, crisp contact is the only goal."]});
  if(withLadder)B.push(ladBlock())}
function ladBlock(){return {type:"lad5",id:"lad5",title:"Landing ladder",mins:5,zones:LAD_Z,seq:LAD_SEQ,res:[]}}
/* the ladder picture: you and the ball at the bottom, six clubs on the ground from 10 yds, one every 6 ft (2 yds), the zone to land in lit up */
function ladSVG(b){const W=340,H=410,top=46,k=24,y=d=>top+(20-d)*k,by=H-34,n=b.res.length,done=n>=b.seq.length,zi=done?-1:b.seq[n],up=n<5;
  let g=`<rect width="${W}" height="${H}" fill="#2d5a27"/>`;for(let i=0;i<12;i++)g+=`<rect x="0" y="${i*36}" width="${W}" height="18" fill="#336530" opacity=".55"/>`;
  b.zones.forEach((z,i)=>{const on=i===zi,y1=y(z[1]),y2=y(z[0]);g+=`<rect x="54" y="${y1}" width="232" height="${y2-y1}" fill="${on?"#FFD900":"#fff"}" opacity="${on?.85:.06}"/>`;
    g+=`<text x="34" y="${(y1+y2)/2+7}" text-anchor="middle" font-family="Anton,Impact,sans-serif" font-size="20" fill="${on?"#FFD900":"#F4F1EA"}">${i+1}</text>`;
    const marks=b.res.map((r,j)=>({r,z:b.seq[j]})).filter(m=>m.z===i);marks.forEach((m,j)=>{const cx=254-j*22,cy=(y1+y2)/2;g+=`<circle cx="${cx}" cy="${cy}" r="8" fill="${m.r?"#1f8a4c":"#b3261e"}" stroke="#fff" stroke-width="1.5"/><text x="${cx}" y="${cy+4}" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">${m.r?"✓":"✕"}</text>`});
    if(on)g+=`<text x="${W/2-30}" y="${(y1+y2)/2+6}" text-anchor="middle" font-family="Anton,Impact,sans-serif" font-size="17" fill="#0B0B0B">LAND IT HERE</text>`});
  [10,12,14,16,18,20].forEach(d=>{const yy=y(d);g+=`<line x1="60" y1="${yy}" x2="262" y2="${yy}" stroke="#C9C6BE" stroke-width="3" stroke-linecap="round"/><rect x="262" y="${yy-3}" width="20" height="6" rx="2" fill="#141414"/><text x="${W-8}" y="${yy+4}" text-anchor="end" font-size="11" font-weight="700" fill="#F4F1EA">${d} yds</text>`});
  /* the gap from the ball to the first club is shortened */
  g+=`<line x1="${W/2}" y1="${y(10)+10}" x2="${W/2}" y2="${by-14}" stroke="#F4F1EA" stroke-width="1.5" stroke-dasharray="4 5" opacity=".7"/><text x="${W/2-8}" y="${(y(10)+by)/2+4}" text-anchor="end" font-size="11" font-weight="700" fill="#F4F1EA">10 yds to the first club</text>`;
  g+=`<circle cx="${W/2}" cy="${by}" r="7" fill="#fff" stroke="#999"/><text x="${W/2}" y="${by+24}" text-anchor="middle" font-size="11" font-weight="700" fill="#F4F1EA">YOU</text>`;
  if(zi>=0){const z=b.zones[zi],ty=y((z[0]+z[1])/2);g+=`<path d="M${W/2} ${by-10} Q ${W/2+70} ${(by+ty)/2} ${W/2+40} ${ty+8}" fill="none" stroke="#FFD900" stroke-width="3" stroke-dasharray="7 5"/><path d="M${W/2+40} ${ty+8} l10 -2 l-6 9 z" fill="#FFD900"/>`;
    g+=`<rect x="8" y="6" width="${up?118:134}" height="22" fill="#0B0B0B"/><text x="16" y="22" font-family="Anton,Impact,sans-serif" font-size="14" fill="#FFD900">${up?"GOING UP ↑":"COMING DOWN ↓"}</text>`}
  g+=`<text x="${W-8}" y="22" text-anchor="end" font-size="11" font-weight="700" fill="#F4F1EA">6 ft between clubs</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Landing ladder: six clubs from 10 to 20 yards, ${zi>=0?"land in zone "+(zi+1):"ladder done"}">${g}</svg>`}
function ladPB(){const P=PG();return P.lad||null}
function ladSave(b){const P=PG(),pts=b.res.filter(Boolean).length,old=P.lad||{best:null,n:0};if(b.saved)return;b.saved=true;
  b.newPB=old.best===null||pts>old.best;P.lad={best:old.best===null?pts:Math.max(old.best,pts),last:pts,n:(old.n||0)+1,t:Date.now()};window.save()}
function runLad5(b){const tot=b.seq.length,n=b.res.length,done=n>=tot,zi=done?-1:b.seq[n],pts=b.res.filter(Boolean).length,pb=ladPB();
  const setup=`<ul class="steps"><li>Lay a club on the ground 10 yds away. Then five more behind it, 6 ft (2 paces) apart. That makes 5 landing zones.</li><li>Chip one ball into zone 1, then 2, 3, 4 and 5. Then work back down: 5, 4, 3, 2, 1.</li><li>Tap ✓ if it landed in the zone, ✕ if it didn't, then go to the next zone either way. 1 point a zone. Just for the drill: it doesn't count towards strokes gained.</li></ul>`;
  return (n?"":setup)+`<div class="lad">${ladSVG(b)}</div>
   <div class="call"><span class="label">${done?"Ladder done":"Ball "+(n+1)+" of "+tot+" · "+(n<5?"going up":"coming down")}</span><div class="d">${done?pts+"<small>of "+tot+" points</small>":"Zone "+(zi+1)+"<small>"+b.zones[zi][0]+"–"+b.zones[zi][1]+" yds</small>"}</div></div>
   ${done?(b.newPB?`<div class="ladpb"><span class="new">${pb&&pb.n>1?"★ New personal best: "+pts+"/"+tot:"First ladder: "+pts+"/"+tot+" is the score to beat"}</span></div>`:""):`<div class="okno"><button class="y" data-act="lr" data-v="1">✓ Hit</button><button class="x" data-act="lr" data-v="0">✕ Missed</button></div>`}
   ${pb?`<div class="ladpb"><span>Personal best ${pb.best}/${tot}</span><span>Last time ${pb.last}/${tot}</span></div>`:""}
   ${n?`<div class="tally">${b.res.map(r=>`<span class="${r?"ok":"no"}">${r?"✓":"✕"}</span>`).join("")}</div>${done?"":`<button class="linky" data-act="lUndo">Undo last</button>`}`:""}`+nextBtn(done?"✓ Next block":"Finish early",false)}

   <div class="call"><span class="label">${done?"Ladder done":"Ball "+(n+1)+" of "+tot+" · trip "+(Math.floor(n/b.zones.length)+1)}</span><div class="d">${done?hit+"<small>of "+tot+"</small>":"Zone "+(zi+1)+"<small>"+b.zones[zi][0]+"–"+b.zones[zi][1]+" yds</small>"}</div></div>
   ${done?"":`<div class="okno"><button class="y" data-act="zr" data-v="1">✓ In</button><button class="x" data-act="zr" data-v="0">✕ Out</button></div>`}
   ${n?`<div class="tally">${b.res.map(r=>`<span class="${r?"ok":"no"}">${r?"✓":"✕"}</span>`).join("")}</div><button class="linky" data-act="zUndo">Undo last</button>`:""}`+nextBtn(done?"✓ Next block":"Finish early",false)}
function runCount(b){const n=b.res.length,done=n>=b.total,hit=b.res.filter(Boolean).length;
  return `<div class="viz">${vizSVG(b.viz,b)}</div><p class="vizcap">${b.cap}</p>`+lines(b)+
   `<div class="call"><span class="label">${done?"Done":"Ball "+(n+1)+" of "+b.total}</span><div class="d tnum">${b.calls&&!done?b.calls[n]:hit+"<small>of "+n+"</small>"}</div></div>
   ${done?"":`<div class="okno"><button class="y" data-act="cr" data-v="1">✓ Yes</button><button class="x" data-act="cr" data-v="0">✕ No</button></div>`}
   ${n?`<div class="tally">${b.res.map(r=>`<span class="${r?"ok":"no"}">${r?"✓":"✕"}</span>`).join("")}</div><button class="linky" data-act="cUndo">Undo last</button>`:""}`+nextBtn(done?"✓ Next block":"Finish early")}
const carryPts=(t,c)=>{const e=Math.abs(c-t);return e<=3?3:e<=6?2:e<=9?1:0};

  return `<ul class="steps"><li>Carry the ball the exact number on screen.</li><li>Within 3 yds scores 3, within 6 scores 2, within 9 scores 1.</li></ul>
   <div class="call"><span class="label">${done?"Score":"Ball "+(n+1)+" of "+b.targets.length}</span><div class="d tnum">${done?pts+"<small>of "+b.targets.length*3+"</small>":b.targets[n]+"<small>yds</small>"}</div></div>
   ${ui.flash?flashHTML():""}
   ${done?"":`<div class="bigin"><input id="carIn" inputmode="numeric" placeholder="Carry (yds)" aria-label="Carry in yards"><button class="dark" data-act="carAdd">Enter</button></div>`}
   ${n?`<div class="tally">${b.res.map((c,i)=>{const p=carryPts(b.targets[i],c);return `<span class="${p>=2?"ok":p===1?"mid":"no"}">${b.targets[i]}→${c}</span>`}).join("")}</div><span class="muted">${pts} points so far</span><button class="linky" data-act="carUndo">Undo last</button>`:""}`+nextBtn(done?"✓ Next block":"Finish early")}
/* speed training safety warning: shown on every speed block, 3 Strikes and the speed option */
const SPEEDWARN=`<div class="warnbox speedwarn" role="note"><b>Take care with speed training</b>Swinging at maximum speed puts extra load on your body. Warm up fully first, and stop straight away if anything hurts. Macro Golf accepts no liability for any injury caused while training for speed. If you're unsure whether you should be pushing your speed, speak to a Macro Golf coach before you start.</div>`;
function runSpeed(b){const best=b.base.length?Math.max(...b.base,...b.swings.filter(x=>x.up).map(x=>x.v)):0,st=b.swings.filter(x=>x.strike).length,inBase=b.base.length<5,over=st>=3;

<style>
/* Paul Goddard golf plan: Macro Golf house style (black cover band, yellow bar, square corners) */
#pg{--bg:#FFFFFF;--line:rgba(11,11,11,0.16);--fg:#0B0B0B;--muted:#77715F;--body:#3B3830;--ink:#0B0B0B;--on-ink:#F4F1EA;--gold:#FFD900;--gold-ink:#8a7f00;--soft:#F4F1EA;--good:#1FA855;--warn:#F5A800;--bad:#E0352B;
  --display:"Anton","Arial Narrow",Impact,sans-serif;--text:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  background:var(--bg);color:var(--body);font-family:var(--text);font-size:15px;line-height:1.55;padding:16px 16px 90px}
#pg *{box-sizing:border-box;border-radius:0}
#pg .wrap{max-width:580px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
#pg h1,#pg h2,#pg h3{font-family:var(--display);font-weight:400;text-transform:uppercase;letter-spacing:-.3px;margin:0;color:var(--fg)}
#pg .tnum{font-variant-numeric:tabular-nums}
#pg .muted{color:var(--muted);font-size:13px}
#pg .label{font-size:11px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted)}
#pg .eyebrow{font-size:11px;font-weight:700;letter-spacing:2.4px;text-transform:uppercase;color:var(--gold-ink)}
#pg button{font-family:var(--text);font-weight:700;border:0;padding:12px 16px;cursor:pointer;letter-spacing:.04em;color:var(--fg);background:transparent}
#pg button:disabled{opacity:.4;cursor:not-allowed}
#pg input,#pg select{font-family:var(--text);color:var(--fg)}
#pg input:focus-visible,#pg button:focus-visible,#pg select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#pg .cover{background:var(--ink);color:var(--on-ink);padding:22px 22px 18px;display:flex;flex-direction:column;gap:16px}
#pg .goldbar{width:74px;height:7px;background:var(--gold)}
#pg .cover h1{font-size:clamp(46px,14vw,66px);line-height:.94;letter-spacing:-1px;color:var(--on-ink)}
#pg .cover h1 span{display:block}#pg .cover h1 .g{color:var(--gold);font-size:.46em;line-height:1.06;margin-top:6px}
#pg .sub{font-size:10px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:rgba(244,241,234,.62)}
#pg .strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid rgba(244,241,234,.18);padding-top:12px}
#pg .strip>div{display:flex;flex-direction:column;gap:2px;min-width:0;padding:0 10px;border-left:1px solid rgba(244,241,234,.18)}
#pg .strip>div:first-child{padding-left:0;border-left:0}
#pg .strip .k{font-size:10px;font-weight:700;letter-spacing:1.8px;text-transform:uppercase;color:var(--gold)}
#pg .strip .v{font-family:var(--display);font-size:16px;line-height:1.15;text-transform:uppercase;color:var(--on-ink)}
#pg .sec-h{display:flex;flex-direction:column;gap:6px;margin-top:10px}
#pg .sec-h h2{font-size:28px;line-height:1.08}
#pg .sec-h h2::after{content:"";display:block;width:74px;height:6px;background:var(--gold);margin-top:12px}
#pg .card{background:var(--bg);border:1px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:14px}
#pg .fld{display:flex;flex-direction:column;gap:4px;min-width:0}
#pg .fld input{font-size:18px;font-weight:600;padding:10px 12px;border:1px solid var(--line);background:var(--bg);width:100%;min-width:0}
#pg .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#pg .primary{background:var(--gold);color:var(--fg);font-family:var(--display);font-weight:400;font-size:20px;text-transform:uppercase;letter-spacing:.5px;padding:14px 18px}
#pg .dark{background:var(--ink);color:var(--gold);font-family:var(--display);font-weight:400;font-size:18px;text-transform:uppercase;letter-spacing:.5px;padding:12px 16px}
#pg .ghost{border:1px solid var(--line);background:var(--bg);color:var(--fg)}
#pg .btns{display:flex;gap:10px;flex-wrap:wrap}#pg .btns>*{flex:1}
#pg .linky{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;font-weight:400;font-size:13px;letter-spacing:0;align-self:flex-start}
#pg .seg{display:flex;border:1px solid var(--line)}
#pg .seg button{flex:1;padding:12px 6px;font-size:14px;color:var(--muted)}
#pg .seg button[aria-pressed="true"]{background:var(--ink);color:var(--gold)}
#pg .pick{display:grid;gap:10px}
#pg .pick button{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;background:var(--bg);border:1px solid var(--line);border-left:6px solid var(--line);padding:14px}
#pg .pick button b{font-family:var(--display);font-weight:400;font-size:22px;text-transform:uppercase;letter-spacing:-.3px}
#pg .pick button small{font-weight:400;font-size:13px;color:var(--body);letter-spacing:0}
#pg .pick button[aria-pressed="true"]{border-color:var(--ink);border-left-color:var(--gold);background:var(--soft)}
#pg .planlist{display:flex;flex-direction:column;border:1px solid var(--line)}
#pg .planlist .row{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:9px 12px;border-top:1px solid var(--line)}
#pg .planlist .row:first-child{border-top:0}
#pg .planlist .n{font-family:var(--display);font-size:18px;color:var(--gold-ink)}
#pg .planlist .t{font-weight:600;color:var(--fg);min-width:0}#pg .planlist .t small{display:block;font-weight:400;color:var(--muted);font-size:12px}
#pg .planlist .m{font-family:var(--display);font-size:16px;color:var(--fg)}
#pg .planlist .row.done .n{color:var(--good)}#pg .planlist .row.cur{background:var(--soft);box-shadow:inset 6px 0 0 var(--gold)}
#pg .planlist .grp{padding:8px 12px;background:var(--ink);color:var(--gold);font-size:11px;font-weight:700;letter-spacing:1.8px;text-transform:uppercase}
#pg .board{background:var(--ink);color:var(--on-ink);padding:16px 18px;display:grid;grid-template-columns:1fr auto;gap:4px 14px;align-items:end;border-left:6px solid var(--gold);position:sticky;top:0;z-index:5}
#pg .board .label{color:var(--gold)}
#pg .board .big{font-family:var(--display);font-size:52px;line-height:.9;color:var(--on-ink)}
#pg .board .side{text-align:right;display:flex;flex-direction:column;gap:2px}
#pg .board .side b{font-family:var(--display);font-weight:400;font-size:22px;color:var(--on-ink)}
#pg .board .side .label{color:rgba(244,241,234,.7)}
#pg .prog{grid-column:1/-1;display:flex;gap:3px;margin-top:8px}
#pg .prog i{flex:1;height:5px;background:rgba(244,241,234,.18)}#pg .prog i.on{background:var(--gold)}#pg .prog i.cur{background:var(--on-ink)}
#pg .blockhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
#pg .blockhead h2{font-size:28px;line-height:1.02}
#pg .mins{font-family:var(--display);font-size:24px;color:var(--fg);white-space:nowrap}
#pg .mins small{font-family:var(--text);font-size:11px;font-weight:700;letter-spacing:1.6px;color:var(--muted);margin-left:3px}
#pg .steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
#pg .feel{background:var(--ink);color:var(--on-ink);padding:16px;border-left:6px solid var(--gold);display:flex;flex-direction:column;gap:6px}
#pg .feel b{font-family:var(--display);font-weight:400;font-size:24px;line-height:1.1;text-transform:uppercase;color:var(--gold)}
#pg .timer{display:flex;align-items:center;gap:12px;border:1px solid var(--line);padding:8px 12px}
#pg .timer b{font-family:var(--display);font-size:30px;color:var(--fg);flex:1}
#pg .call{background:var(--soft);padding:14px;display:flex;flex-direction:column;gap:4px}
#pg .call .d{font-family:var(--display);font-size:52px;line-height:.9;color:var(--fg)}
#pg .call .d small{font-size:20px;color:var(--muted);margin-left:4px}
#pg .facts{display:flex;flex-wrap:wrap;gap:6px}
#pg .facts span{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);padding:3px 7px;background:var(--bg);color:var(--fg)}
#pg .lmrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#pg .lmrow input,#pg .bigin input{font-size:24px;font-weight:700;padding:10px 12px;border:1px solid var(--line);width:100%;min-width:0}
#pg .bigin{display:grid;grid-template-columns:1fr auto;gap:10px}
#pg .okno{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#pg .okno button{font-family:var(--display);font-weight:400;font-size:22px;text-transform:uppercase;padding:16px}
#pg .okno .y{background:var(--good);color:#fff}#pg .okno .x{background:var(--bad);color:#fff}
#pg .pts{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
#pg .pts button{border:1px solid var(--line);background:var(--bg);padding:10px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:600;letter-spacing:0;color:var(--muted)}
#pg .pts button b{font-family:var(--display);font-weight:400;font-size:24px;color:var(--fg)}
#pg .face{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
#pg .face button{border:1px solid var(--line);background:var(--bg);padding:14px 4px;font-size:13px}
#pg .face button.c{background:var(--gold);border-color:var(--gold)}
#pg .tally{display:flex;flex-wrap:wrap;gap:6px}
#pg .tally span{font-size:13px;font-weight:700;padding:5px 9px;border:1px solid var(--line);color:var(--fg)}
#pg .tally span.ok{background:var(--good);border-color:var(--good);color:#fff}#pg .tally span.no{background:var(--bad);border-color:var(--bad);color:#fff}#pg .tally span.mid{background:var(--warn);border-color:var(--warn)}
#pg .flash{padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;color:#fff}
#pg .flash b{font-family:var(--display);font-weight:400;font-size:32px;line-height:1}
#pg .flash span{font-size:14px}
#pg .flash.p{background:var(--good)}#pg .flash.m{background:var(--bad)}#pg .flash.z{background:var(--ink)}
#pg .verdict{background:var(--ink);color:var(--on-ink);padding:20px;display:flex;flex-direction:column;gap:8px;border-left:6px solid var(--gold)}
#pg .verdict .k{font-size:11px;font-weight:700;letter-spacing:1.8px;text-transform:uppercase;color:var(--gold)}
#pg .verdict .hc{font-family:var(--display);font-size:64px;line-height:.9;color:var(--on-ink)}
#pg .verdict p{margin:0;color:rgba(244,241,234,.88)}
#pg .stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line)}
#pg .stats div{padding:12px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:2px;min-width:0}
#pg .stats div:first-child{border-left:0}
#pg .stats b{font-family:var(--display);font-weight:400;font-size:26px;color:var(--fg);line-height:1}
#pg .up{color:var(--good)}#pg .down{color:var(--bad)}
#pg .grid{overflow-x:auto}
#pg table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
#pg th,#pg td{padding:8px 6px;text-align:left;border-bottom:1px solid var(--line);font-size:14px;color:var(--fg)}
#pg th{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;font-weight:700;background:var(--soft)}
#pg td.r,#pg th.r{text-align:right}
#pg .pb{display:inline-block;background:var(--gold);color:var(--fg);font-size:10px;font-weight:700;letter-spacing:1.4px;padding:2px 6px;margin-left:6px;text-transform:uppercase}
#pg .note{font-size:13px;color:var(--fg);background:var(--soft);border-left:6px solid var(--gold);padding:10px 12px}
#pg .resume{border:2px solid var(--ink);background:var(--soft);padding:14px;display:flex;flex-direction:column;gap:10px}
#pg .wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
#pg .wk div{border:1px solid var(--line);padding:6px 2px;text-align:center;font-size:11px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;gap:2px;min-height:58px}
#pg .wk div i{font-style:normal;font-size:8.5px;font-weight:700;letter-spacing:0;padding:2px 0;overflow:hidden}
#pg .wk div i.r{background:var(--ink);color:var(--gold)}#pg .wk div i.p{background:var(--gold);color:var(--fg)}
#pg .wk div.today{border:2px solid var(--ink)}
#pg .cta{background:var(--ink);color:var(--on-ink);padding:18px 20px;display:flex;flex-direction:column;gap:6px;border-bottom:6px solid var(--gold)}
#pg .cta b{font-family:var(--display);font-weight:400;font-size:22px;text-transform:uppercase;line-height:1.1}#pg .cta b span{color:var(--gold)}
#pg .cta small{color:#9C988C;font-size:11px;letter-spacing:2px;font-weight:700;text-transform:uppercase}
@media (max-width:380px){#pg .call .d{font-size:44px}#pg .board .big{font-size:44px}#pg .stats b{font-size:22px}}
</style>

<div id="pg"><div class="wrap">
  <header class="cover">
    <span class="sub">Macro Golf · Performance Plan</span>
    <div class="goldbar"></div>
    <h1><span id="hName">Paul Goddard</span><span class="g">Golf plan · goal scratch</span></h1>
    <div class="strip"><div><span class="k">Goal</span><span class="v">Scratch</span></div><div><span class="k">Rounds</span><span class="v">2 / week</span></div><div><span class="k">Range</span><span class="v">Practice</span></div></div>
  </header>
  <div id="main"></div>
  <div class="cta"><b>Every shot. <span>One number.</span></b><small>Copyright Macro Golf Studios Ltd · macro.golf</small></div>
</div></div>

<script src="{{BASE}}src/golf-sg.js"></script>
<script>
/* ---------- Paul Goddard golf plan ----------
   Round day: putting warm-up (start-line gate, Hole Out, Money Stealers) and range warm-up
   (the Practice Plan 30 min approach + driver, plus a 5 min technical station) in the order he picks.
   Range practice: the Practice Plan warm-up, technical station, Wedge Darts, warm down.
   Every shot that has a result is strokes gained against scratch (golf-sg.js baseline), and every
   session gets a handicap: the handicap whose average golfer would have gained exactly zero. */
var KEY="mgPaulGoddard",COACH="jack@macro.golf",GOAL="0",WEEK_ROUNDS=2;
function blank(){return {player:"",order:"putt",drv:250,history:[],cur:null,sent:{}}}
function load(){try{var v=JSON.parse(localStorage.getItem(KEY));if(v&&Array.isArray(v.history))return v}catch(e){}return null}
var S=load()||blank();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
var $=function(id){return document.getElementById(id)};
var esc=function(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
var ri=function(a,b){return a+Math.floor(Math.random()*(b-a+1))};
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
var sgf=function(x){return (x>=0?"+":"−")+Math.abs(x).toFixed(2)};
function iso(d){var z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,10)}
function today(){return iso(new Date())}
function monday(ds){var d=new Date(ds+"T12:00:00"),w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return iso(d)}
function addDays(ds,n){var d=new Date(ds+"T12:00:00");d.setDate(d.getDate()+n);return iso(d)}
function nice(ds){return new Date(ds+"T12:00:00").toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"})}

/* ---------- session building ---------- */
var HO_SPOTS=[["North","Downhill","downhill"],["East","Flat","sidehill, breaks right to left"],["South","Uphill","uphill"],["West","Flat","sidehill, breaks left to right"]];
function putBlocks(){
  var ho=[];[3,4,5].forEach(function(ft){HO_SPOTS.forEach(function(s){ho.push({ft:ft,spot:s[0],slope:s[1],desc:s[2]})})});
  return [
    {t:"count",id:"gate",grp:"Putting warm-up",title:"Technical station: start-line gate",mins:5,timer:true,total:10,res:[],
      lines:["Two tees just wider than the ball, about a putter head in front of it.","Putt from 4 ft. Roll it through the gate without touching the tees.","Tick each putt that goes through the gate."]},
    {t:"holeout",id:"holeout",grp:"Putting warm-up",title:"Hole Out (warm-up)",mins:5,putts:ho,res:[],
      lines:["Pick a hole on a slope. Mark 3, 4 and 5 ft at North (downhill), East, South (uphill) and West.","Once round from 3 ft, then 4 ft, then 5 ft: 12 putts, one ball each, full routine."]},
    {t:"money",id:"money",grp:"Putting warm-up",title:"Money Stealers (warm-up)",mins:5,st:[12,15,18].map(function(ft){return {ft:ft,slope:pick(["Uphill","Downhill","Flat"])}}),res:[],
      lines:["Three stations, two balls each. The zone is 1 ft short to 2 ft past the hole.","Score each station: both holed 4, holed + zone 3, two in the zone or one holed 2, one in the zone 1, none 0."]}
  ]}
function warmBlocks(grp){return [
    {t:"tick",id:"body",grp:grp,title:"Body warm up",mins:5,lines:["Follow the full Macro Golf 5 minute body warm up in the app.","Tick it off when you're done."]},
    {t:"ladder",id:"ladder",grp:grp,title:"Ladder up to 70 yds",mins:5,res:[],
      lines:["Start with a short chip. Every shot must carry to where the last ball finished.","Each shot gets longer and the target changes every time, until you reach 70 yds."]},
    {t:"strike",id:"strike",grp:grp,title:"Strike station",mins:2,balls:5,res:[],lines:["Strike set up station: low point check and strike spray (foot spray works too).","Tap where each ball came off the face."]},
    {t:"tick",id:"tech",grp:grp,title:"Technical station",mins:5,timer:true,feel:"Get off and away in the backswing. Imagine you're putting a ball on a high shelf.",
      lines:["Rehearse the feel with no ball, then bring it into the ball with slow-motion swings.","Finish with a few full swings holding the same feel. Focus on the movement, not the ball flight."]}
  ]}
function rangeBlocks(){
  var grp="Range warm-up",B=warmBlocks(grp),holes=[];
  for(var i=0;i<8;i++){var L=Math.round((S.drv*1.06+ri(110,175))/5)*5;holes.push({L:L,par:L>470?5:4,fw:pick([13,14,15,16])})}
  B.push({t:"drive",id:"drive",grp:grp,title:"Driving: strokes gained game",mins:8,holes:holes,res:[],lines:["Every drive is a tee shot on the hole shown. Full routine, pick a fairway on the range.","Enter carry and offline from the launch monitor."]});
  var ds=shuffle([ri(100,125),ri(100,125),ri(125,150),ri(125,150),ri(150,175),ri(150,175),ri(175,200),ri(175,200)]);
  B.push({t:"app",id:"app",grp:grp,title:"Approach: strokes gained game",mins:7,ds:ds,res:[],lines:["Every ball is a new flag at the distance shown. New club, full routine.","Enter carry and offline from the launch monitor."]});
  B.push({t:"tick",id:"down",grp:grp,title:"Warm down",mins:3,lines:["Three balls with your full on-course routine. New target and new club every ball.","Finish on a shot you like."]});
  return B}
function practiceBlocks(){
  var grp="Range practice",B=warmBlocks(grp),plan=[];for(var r=0;r<3;r++)plan=plan.concat(shuffle([50,60,70,80,90,100]));
  B.push({t:"wd",id:"wd",grp:grp,title:"Wedge Darts",mins:25,plan:plan,res:[],
    lines:["3 rounds of 6 balls. Balls 1 to 5: hit the number on screen. Ball 6 is the finisher: pick your own target.","Score a zone when the ball is inside it both ways: 3 pts within 3 yds, 2 within 6, 1 within 9. More than 8 yds offline scores 0.","Finisher: a 3 doubles to 6 and a 0 costs 3. Enter carry and offline from the launch monitor."]});
  B.push({t:"tick",id:"down",grp:grp,title:"Warm down",mins:3,lines:["Three balls with your full on-course routine. New target and new club every ball.","Finish on a shot you like."]});
  return B}
function newSession(kind){
  var B=kind==="range"?practiceBlocks():(S.order==="putt"?putBlocks().concat(rangeBlocks()):rangeBlocks().concat(putBlocks()));
  S.cur={id:"s"+Date.now(),date:today(),kind:kind,order:kind==="round"?S.order:null,bi:0,blocks:B};S.flash=null;S.view=null;S.last=null;save();render();window.scrollTo(0,0)}

/* ---------- strokes gained ---------- */
var MS_SPLIT={4:[[0,0]],3:[[0,1.5]],2:[[1.5,1.5],[0,4.5]],1:[[1.5,4.5]],0:[[4.5,4.5]]};
function Etee(n,L){var p=GSG.P(n),R=Math.max(30,L-p.D);return 1+p.fw*GSG.E(n,"fw",R)+(1-p.fw-p.pen)*GSG.E(n,"rough",R)+p.pen*(1+GSG.E(n,"rough",R))}
function driveAfter(n,h,r){var a=Math.abs(r.off),R=Math.max(10,h.L-r.carry*1.06);
  if(a<=h.fw)return {lie:"Fairway",e:GSG.E(n,"fw",R)};if(a<=h.fw+20)return {lie:"Rough",e:GSG.E(n,"rough",R)};return {lie:"Penalty",e:1+GSG.E(n,"rough",R)}}
function sgOf(s,n){
  if(s.k==="putt")return GSG.puttSG(n,s.ft,s.leave,s.slope);
  if(s.k==="ms"){var o=MS_SPLIT[s.pts]||MS_SPLIT[0];return o.reduce(function(a,p){return a+p.reduce(function(b,lv){return b+GSG.puttSG(n,s.ft,lv,s.slope)},0)},0)/o.length}
  if(s.k==="drive")return Etee(n,s.h.L)-1-driveAfter(n,s.h,s).e;
  return GSG.approachSG(n,s.d,s.carry,Math.abs(s.off))}
function shotsOf(sess){var L=[];sess.blocks.forEach(function(b){
  if(b.t==="holeout")b.res.forEach(function(r,i){var p=b.putts[i];L.push({k:"putt",g:b.id,ft:p.ft,slope:p.slope,leave:r?0:1.5})});
  if(b.t==="money")b.res.forEach(function(r,i){var p=b.st[i];L.push({k:"ms",g:b.id,ft:p.ft,slope:p.slope,pts:r})});
  if(b.t==="drive")b.res.forEach(function(r,i){L.push({k:"drive",g:b.id,h:b.holes[i],carry:r.carry,off:r.off})});
  if(b.t==="app")b.res.forEach(function(r,i){L.push({k:"app",g:b.id,d:b.ds[i],carry:r.carry,off:r.off})});
  if(b.t==="wd")b.res.forEach(function(r){L.push({k:"app",g:b.id,d:r.target,carry:r.carry,off:r.off})});});return L}
function total(L,n){return L.reduce(function(a,s){return a+sgOf(s,n)},0)}
/* the handicap a session was played to: the level whose average golfer gains exactly zero on the same shots */
function sessHc(L){if(!L.length)return null;var lo=-8,hi=40;if(total(L,lo)>=0)return lo;if(total(L,hi)<=0)return hi;
  for(var i=0;i<40;i++){var m=(lo+hi)/2;if(total(L,m)<0)lo=m;else hi=m}return (lo+hi)/2}
function hcTxt(n){if(n==null)return "–";var r=Math.round(n);if(r<=-8)return "+8";if(r<0)return "+"+(-r);if(r===0)return "Scratch";return r>=40?"40+":String(r)}

/* ---------- game scores ---------- */
function wdPts(target,carry,off,fin){var err=Math.abs(carry-target),a=Math.abs(off),b=0;
  if(a<=8){if(err<=3&&a<=3)b=3;else if(err<=6&&a<=6)b=2;else if(err<=9&&a<=8)b=1}
  return fin?(b===3?6:b===0?-3:b):b}
function wdFin(i){return i%6===5}
function stats(sess){var o={},L=shotsOf(sess);
  sess.blocks.forEach(function(b){
    if(b.t==="count"&&b.res.length)o.gate=b.res.filter(Boolean).length;
    if(b.t==="holeout"&&b.res.length)o.holeout=b.res.filter(Boolean).length;
    if(b.t==="money"&&b.res.length)o.money=b.res.reduce(function(a,x){return a+x},0);
    if(b.t==="ladder"&&b.res.length){o.ladder=b.res.filter(function(x){return x.ok}).length;o.ladderN=b.res.length}
    if(b.t==="strike"&&b.res.length)o.strike=b.res.filter(function(x){return x==="Centre"}).length;
    if(b.t==="drive"&&b.res.length){o.fairways=b.res.filter(function(r,i){return Math.abs(r.off)<=b.holes[i].fw}).length;o.drives=b.res.length;o.longest=Math.max.apply(null,b.res.map(function(r){return r.carry}))}
    if(b.t==="wd"&&b.res.length)o.wd=b.res.reduce(function(a,r,i){return a+wdPts(r.target,r.carry,r.off,wdFin(i))},0);
  });
  ["holeout","money","drive","app","wd"].forEach(function(g){var l=L.filter(function(s){return s.g===g});if(l.length)o["sg_"+g]=total(l,+GOAL)});
  o.sg=total(L,+GOAL);o.hc=sessHc(L);o.n=L.length;return o}
var PBS=[ /* key, label, higher is better, format */
  ["hc","Best session handicap",false,hcTxt],["sg","Session strokes gained vs scratch",true,sgf],
  ["wd","Wedge Darts points",true,String],["sg_wd","Wedge Darts strokes gained",true,sgf],
  ["sg_drive","Driving strokes gained",true,sgf],["longest","Longest drive carry (yds)",true,function(x){return Math.round(x)}],["fairways","Fairways (of 8)",true,String],
  ["sg_app","Approach strokes gained",true,sgf],
  ["holeout","Hole Out warm-up makes (of 12)",true,String],["money","Money Stealers warm-up points (of 12)",true,String],["gate","Start-line gate (of 10)",true,String],
  ["ladder","Ladder: carried to the last ball",true,String],["strike","Strike station: centre strikes (of 5)",true,String]];
function bests(excludeId){var b={};S.history.forEach(function(h){if(h.id===excludeId||!h.st)return;PBS.forEach(function(p){var v=h.st[p[0]];if(v==null||!isFinite(v))return;var cur=b[p[0]];if(!cur||(p[2]?v>cur.v:v<cur.v))b[p[0]]={v:v,date:h.date}})});return b}
function newPbs(h){var prev=bests(h.id),out=[];PBS.forEach(function(p){var v=h.st[p[0]];if(v==null||!isFinite(v))return;var c=prev[p[0]];if(c&&(p[2]?v>c.v+1e-9:v<c.v-1e-9))out.push(p[0])});return out}

/* ---------- actions ---------- */
function cur(){return S.cur&&S.cur.blocks[S.cur.bi]}
function setFlash(cls,txt,big){S.flash={c:cls,t:txt,b:big}}
function sgFlash(s,label){var v=sgOf(s,+GOAL);setFlash(v>=0?"p":"m",label+"<br><b style='font-family:var(--text);font-size:14px'>Strokes gained "+sgf(v)+" vs scratch</b>",sgf(v))}
function act(a,v){var b=cur();
  if(a==="name"){S.player=v;save();return}
  if(a==="order"){S.order=v;save();render();return}
  if(a==="start"){newSession(v);return}
  if(a==="resume"){S.view=null;save();render();window.scrollTo(0,0);return}
  if(a==="discard"){S.cur=null;save();render();return}
  if(a==="next"){if(b&&b.timer)stopTimer();S.flash=null;if(S.cur.bi<S.cur.blocks.length-1){S.cur.bi++;save();render();window.scrollTo(0,0)}else finish();return}
  if(a==="back"){if(S.cur.bi>0){stopTimer();S.cur.bi--;S.flash=null;save();render()}return}
  if(a==="tick"){b.done=!b.done;save();render();return}
  if(a==="cnt"){if(b.res.length<b.total){b.res.push(v==="1");setFlash(v==="1"?"p":"m",v==="1"?"Through the gate":"Missed the gate",b.res.filter(Boolean).length+"/"+b.res.length)}save();render();return}
  if(a==="ho"){var i=b.res.length;if(i>=b.putts.length)return;b.res.push(v==="1"?1:0);var p=b.putts[i];sgFlash({k:"putt",ft:p.ft,slope:p.slope,leave:v==="1"?0:1.5},p.ft+" ft "+p.spot.toLowerCase()+" · "+(v==="1"?"Holed":"Missed"));save();render();return}
  if(a==="ms"){var j=b.res.length;if(j>=b.st.length)return;b.res.push(+v);var q=b.st[j];sgFlash({k:"ms",ft:q.ft,slope:q.slope,pts:+v},q.ft+" ft station · "+v+" pt"+(v==="1"?"":"s"));save();render();return}
  if(a==="lad"){var t=parseFloat($("ladIn").value);if(!(t>0))return;var first=!b.res.length;b.res.push({c:Math.round(t),ok:first?null:v==="1"});save();render();var e=$("ladIn");if(e)e.focus();return}
  if(a==="ladUndo"){b.res.pop();save();render();return}
  if(a==="face"){if(b.res.length<b.balls)b.res.push(v);save();render();return}
  if(a==="faceUndo"){b.res.pop();save();render();return}
  if(a==="lm"){var c=parseFloat($("carryIn").value),o=parseFloat($("offIn").value);if(!(c>0)||isNaN(o))return;if(S.side==="L")o=-Math.abs(o);else o=Math.abs(o);
    if(b.t==="drive"){var k=b.res.length,h=b.holes[k];b.res.push({carry:c,off:o});var aft=driveAfter(+GOAL,h,{carry:c,off:o});sgFlash({k:"drive",h:h,carry:c,off:o},"Hole "+(k+1)+" · "+Math.round(c)+" carry · "+aft.lie)}
    else if(b.t==="app"){var m=b.res.length,d=b.ds[m];b.res.push({carry:c,off:o});var px=Math.sqrt((c-d)*(c-d)+o*o);sgFlash({k:"app",d:d,carry:c,off:o},d+" yds · finished "+Math.round(px*3)+" ft away")}
    else if(b.t==="wd"){var w=b.res.length,tg=wdFin(w)?(+$("finPick").value||b.plan[w]):b.plan[w];b.res.push({target:tg,carry:c,off:o});var pt=wdPts(tg,c,o,wdFin(w));
      var sg=sgOf({k:"app",d:tg,carry:c,off:o},+GOAL);setFlash(pt>0?"p":pt<0?"m":"z",tg+" yds · "+(pt>0?"+":"")+pt+" pt"+(Math.abs(pt)===1?"":"s")+"<br><b style='font-family:var(--text);font-size:14px'>Strokes gained "+sgf(sg)+" vs scratch</b>",(pt>0?"+":"")+pt)}
    save();render();var ci=$("carryIn");if(ci)ci.focus();return}
  if(a==="side"){S.side=v;save();document.querySelectorAll('[data-act="side"]').forEach(function(x){x.setAttribute("aria-pressed",String(x.dataset.v===v))});return}
  if(a==="undo"){if(b.res.length){b.res.pop();S.flash=null;save();render()}return}
  if(a==="drv"){var dv=parseFloat(v);if(dv>=150&&dv<=360){S.drv=Math.round(dv);save()}return}
  if(a==="send"){sendWeek(v);return}
  if(a==="copy"){var txt=weekReport(v).join("\n");try{navigator.clipboard.writeText(txt);var el=document.querySelector('[data-act="copy"]');if(el)el.textContent="Copied"}catch(e){}return}
  if(a==="home"){S.view=null;S.last=null;save();render();window.scrollTo(0,0);return}
  if(a==="tohome"){stopTimer();S.view="home";save();render();window.scrollTo(0,0);return}
  if(a==="hist"){S.last=v;save();render();window.scrollTo(0,0);return}
}
function finish(){var c=S.cur,h={id:c.id,date:c.date,kind:c.kind,order:c.order,blocks:c.blocks};h.st=stats(h);h.pbs=newPbs(h);
  S.history=S.history.filter(function(x){return x.id!==h.id});S.history.unshift(h);S.history=S.history.slice(0,200);S.cur=null;S.flash=null;S.last=h.id;save();render();window.scrollTo(0,0)}

/* ---------- timer ---------- */
var TM=null;
function stopTimer(){if(TM){clearInterval(TM);TM=null}}
function timerHtml(b){var left=b.left==null?b.mins*60:b.left;return '<div class="timer"><b id="tmr">'+Math.floor(left/60)+":"+String(left%60).padStart(2,"0")+'</b><button class="dark" id="tmrBtn">'+(TM?"Pause":left<b.mins*60?"Resume":"Start "+b.mins+" min")+'</button></div>'}
function bindTimer(b){var btn=$("tmrBtn");if(!btn)return;btn.onclick=function(){if(TM){stopTimer();save();render();return}
  if(b.left==null)b.left=b.mins*60;TM=setInterval(function(){b.left=Math.max(0,b.left-1);var el=$("tmr");if(el)el.textContent=Math.floor(b.left/60)+":"+String(b.left%60).padStart(2,"0");if(!b.left){stopTimer();save();try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}render()}},1000);render()}}

/* ---------- rendering ---------- */
function linesHtml(b){return '<ul class="steps">'+b.lines.map(function(l){return "<li>"+esc(l)+"</li>"}).join("")+"</ul>"}
function nextBtn(label,dis){return '<div class="btns">'+(S.cur.bi?'<button class="ghost" data-act="back" style="flex:0 0 auto">Back</button>':"")+'<button class="primary" data-act="next"'+(dis?" disabled":"")+'>'+label+'</button></div>'}
function blockDone(b){return b.t==="tick"?!!b.done:b.t==="count"?b.res.length>=b.total:b.t==="holeout"?b.res.length>=b.putts.length:b.t==="money"?b.res.length>=b.st.length:
  b.t==="ladder"?(b.res.length&&b.res[b.res.length-1].c>=70):b.t==="strike"?b.res.length>=b.balls:b.t==="drive"?b.res.length>=b.holes.length:b.t==="app"?b.res.length>=b.ds.length:b.t==="wd"?b.res.length>=b.plan.length:false}
function lmInputs(note){return '<div class="seg"><button data-act="side" data-v="L" aria-pressed="'+(S.side==="L")+'">Offline left</button><button data-act="side" data-v="R" aria-pressed="'+(S.side!=="L")+'">Offline right</button></div>'+
  '<div class="lmrow"><label class="fld"><span class="label">Carry (yds)</span><input id="carryIn" inputmode="decimal" placeholder="e.g. '+note+'"></label><label class="fld"><span class="label">Offline (yds)</span><input id="offIn" inputmode="decimal" placeholder="e.g. 4"></label></div>'+
  '<button class="dark" data-act="lm">Enter shot</button>'}
function tallyRes(arr){return arr.length?'<div class="tally">'+arr.join("")+"</div>":""}
function runBlock(b){var h="",done=blockDone(b),undo='<button class="linky" data-act="undo">Undo last</button>';
  if(b.feel)h+='<div class="feel"><span class="label" style="color:var(--gold)">The feel</span><b>'+esc(b.feel)+"</b></div>";
  h+=linesHtml(b);if(b.timer)h+=timerHtml(b);
  if(b.t==="tick")h+='<button class="'+(b.done?"dark":"ghost")+'" data-act="tick">'+(b.done?"✓ Done":"Tick it off")+"</button>"+nextBtn(b.done?"Next":"Tick it off to move on",!b.done);
  if(b.t==="count"){var mk=b.res.filter(Boolean).length;
    h+='<div class="call"><span class="label">'+(done?"Station done":"Putt "+(b.res.length+1)+" of "+b.total)+'</span><div class="d tnum">'+mk+"<small>of "+b.res.length+" through</small></div></div>"+
      (done?"":'<div class="okno"><button class="y" data-act="cnt" data-v="1">Through</button><button class="x" data-act="cnt" data-v="0">Missed</button></div>')+
      tallyRes(b.res.map(function(x){return '<span class="'+(x?"ok":"no")+'">'+(x?"✓":"✕")+"</span>"}))+(b.res.length?undo:"")+nextBtn(done?"Next":"Finish the 10 putts",!done)}
  if(b.t==="holeout"){var p=b.putts[b.res.length];
    h+=(done?'<div class="call"><span class="label">Hole Out done</span><div class="d tnum">'+b.res.filter(Boolean).length+"<small>of 12 holed</small></div></div>":
      '<div class="call"><span class="label">Putt '+(b.res.length+1)+' of 12</span><div class="d tnum">'+p.ft+'<small>ft '+p.spot+'</small></div><div class="facts"><span>'+esc(p.desc)+"</span></div></div>"+
      '<div class="okno"><button class="y" data-act="ho" data-v="1">Holed</button><button class="x" data-act="ho" data-v="0">Missed</button></div>')+
      tallyRes(b.res.map(function(x,i){return '<span class="'+(x?"ok":"no")+'">'+b.putts[i].ft+b.putts[i].spot[0]+"</span>"}))+(b.res.length?undo:"")+nextBtn(done?"Next":"Finish the 12 putts",!done)}
  if(b.t==="money"){var q=b.st[b.res.length];
    h+=(done?'<div class="call"><span class="label">Money Stealers done</span><div class="d tnum">'+b.res.reduce(function(a,x){return a+x},0)+"<small>of 12 pts</small></div></div>":
      '<div class="call"><span class="label">Station '+(b.res.length+1)+' of 3 · two balls</span><div class="d tnum">'+q.ft+'<small>ft</small></div><div class="facts"><span>'+q.slope+"</span></div></div>"+
      '<div class="pts">'+[[4,"Both holed"],[3,"Holed + zone"],[2,"2 zone / 1 holed"],[1,"One in zone"],[0,"None"]].map(function(x){return '<button data-act="ms" data-v="'+x[0]+'"><b>'+x[0]+"</b>"+x[1]+"</button>"}).join("")+"</div>")+
      tallyRes(b.res.map(function(x,i){return '<span class="'+(x>=3?"ok":x>=1?"mid":"no")+'">'+b.st[i].ft+" ft: "+x+"</span>"}))+(b.res.length?undo:"")+nextBtn(done?"Next":"Score all 3 stations",!done)}
  if(b.t==="ladder"){var last=b.res[b.res.length-1],top=last?last.c:0,hits=b.res.filter(function(x){return x.ok}).length;
    h+='<div class="call"><span class="label">'+(last?"Carry it to where your last ball finished":"First shot")+'</span><div class="d tnum">'+(last?last.c+"<small>yds</small>":"Short chip")+"</div></div>"+
      '<span class="muted">'+top+" of 70 yds · "+hits+" of "+Math.max(0,b.res.length-1)+" carried to the last ball</span>"+
      tallyRes(b.res.map(function(s){return '<span class="'+(s.ok===null?"":s.ok?"ok":"no")+'">'+s.c+"</span>"}))+
      (done?"":'<label class="fld"><span class="label">Where this ball finished (yds)</span><input id="ladIn" inputmode="numeric" placeholder="e.g. '+(top?top+8:15)+'"></label>'+
        (b.res.length?'<div class="okno"><button class="y" data-act="lad" data-v="1">Carried to it</button><button class="x" data-act="lad" data-v="0">Didn’t</button></div>':'<button class="dark" data-act="lad" data-v="1">Enter</button>'))+
      (b.res.length?'<button class="linky" data-act="ladUndo">Undo last</button>':"")+nextBtn(done?"✓ 70 yds reached, next":"Ladder up to 70 yds",!done)}
  if(b.t==="strike"){var cc=b.res.filter(function(x){return x==="Centre"}).length;
    h+='<div class="call"><span class="label">'+(done?"Strike map":"Ball "+(b.res.length+1)+" of "+b.balls)+'</span><div class="d tnum">'+cc+"<small>of "+b.res.length+" centred</small></div></div>"+
      (done?"":'<div class="face">'+["High toe","High","High heel","Toe","Centre","Heel","Low toe","Low","Low heel"].map(function(x){return '<button data-act="face" data-v="'+x+'" class="'+(x==="Centre"?"c":"")+'">'+x+"</button>"}).join("")+"</div>")+
      tallyRes(b.res.map(function(x){return '<span class="'+(x==="Centre"?"ok":"mid")+'">'+x+"</span>"}))+(b.res.length?'<button class="linky" data-act="faceUndo">Undo last</button>':"")+nextBtn(done?"Next":"Tap all 5 strikes",!done)}
  if(b.t==="drive"){var k=b.res.length,hl=b.holes[k];
    h+=(done?'<div class="call"><span class="label">Driving done</span><div class="d tnum">'+b.res.filter(function(r,i){return Math.abs(r.off)<=b.holes[i].fw}).length+"<small>of 8 fairways</small></div></div>":
      '<div class="call"><span class="label">Drive '+(k+1)+' of 8</span><div class="d tnum">'+hl.L+'<small>yd par '+hl.par+'</small></div><div class="facts"><span>Driver</span><span>Fairway '+hl.fw*2+" yds wide</span></div></div>"+lmInputs(S.drv))+
      tallyRes(b.res.map(function(r,i){var a=driveAfter(+GOAL,b.holes[i],r);return '<span class="'+(a.lie==="Fairway"?"ok":a.lie==="Rough"?"mid":"no")+'">'+Math.round(r.carry)+"</span>"}))+(k?undo:"")+nextBtn(done?"Next":"Hit all 8 drives",!done)}
  if(b.t==="app"){var m=b.res.length;
    h+=(done?'<div class="call"><span class="label">Approach done</span><div class="d tnum">'+sgf(total(shotsOf({blocks:[b]}),+GOAL))+"<small>vs scratch</small></div></div>":
      '<div class="call"><span class="label">Shot '+(m+1)+' of 8 · new flag</span><div class="d tnum">'+b.ds[m]+'<small>yds</small></div></div>'+lmInputs(b.ds[m]))+
      tallyRes(b.res.map(function(r,i){var v=sgOf({k:"app",d:b.ds[i],carry:r.carry,off:r.off},+GOAL);return '<span class="'+(v>=0?"ok":"no")+'">'+b.ds[i]+"</span>"}))+(m?undo:"")+nextBtn(done?"Next":"Hit all 8 approaches",!done)}
  if(b.t==="wd"){var w=b.res.length,pts=b.res.reduce(function(a,r,i){return a+wdPts(r.target,r.carry,r.off,wdFin(i))},0);
    h+='<div class="stats"><div><span class="label">Points</span><b class="tnum">'+pts+'</b></div><div><span class="label">Round</span><b class="tnum">'+Math.min(3,Math.floor(w/6)+1)+'/3</b></div><div><span class="label">Ball</span><b class="tnum">'+Math.min(18,w+1)+"/18</b></div></div>";
    if(!done)h+=(wdFin(w)?'<div class="call"><span class="label">Finisher · pick your target</span><select id="finPick" style="font-size:28px;font-family:var(--display);padding:6px;border:1px solid var(--line)">'+[50,60,70,80,90,100].map(function(x){return "<option"+(x===b.plan[w]?" selected":"")+">"+x+"</option>"}).join("")+'</select><span class="muted">A 3 doubles to 6. A 0 costs 3.</span></div>':
      '<div class="call"><span class="label">Ball '+(w%6+1)+' of 6</span><div class="d tnum">'+b.plan[w]+"<small>yds</small></div></div>")+lmInputs(b.plan[w]);
    h+=tallyRes(b.res.map(function(r,i){var p=wdPts(r.target,r.carry,r.off,wdFin(i));return '<span class="'+(p>=2?"ok":p===1?"mid":"no")+'">'+r.target+": "+(p>0?"+":"")+p+"</span>"}))+(w?undo:"")+nextBtn(done?"Next":"Hit all 18 balls",!done)}
  return h}
function planList(c){var h='<div class="planlist">',g="";c.blocks.forEach(function(b,i){if(b.grp!==g){g=b.grp;h+='<div class="grp">'+esc(g)+"</div>"}
  h+='<div class="row '+(i<c.bi?"done":"")+" "+(i===c.bi?"cur":"")+'"><span class="n">'+(i<c.bi?"✓":String(i+1).padStart(2,"0"))+'</span><span class="t">'+esc(b.title)+'</span><span class="m">'+b.mins+"</span></div>"});return h+"</div>"}
function renderRun(){var c=S.cur,b=cur(),L=shotsOf(c),hc=sessHc(L),sg=total(L,+GOAL);
  var h='<div class="board"><div><span class="label">Strokes gained vs scratch</span><div class="big tnum">'+(L.length?sgf(sg):"–")+'</div></div><div class="side"><span class="label">Playing like</span><b class="tnum">'+hcTxt(hc)+"</b><span class=\"label\">"+L.length+" shot"+(L.length===1?"":"s")+'</span></div><div class="prog">'+c.blocks.map(function(x,i){return '<i class="'+(i<c.bi?"on":i===c.bi?"cur":"")+'"></i>'}).join("")+"</div></div>";
  h+='<div class="card"><div class="blockhead"><div style="min-width:0"><span class="eyebrow">'+String(c.bi+1).padStart(2,"0")+" / "+esc(b.grp)+"</span><h2>"+esc(b.title)+'</h2></div><span class="mins">'+b.mins+"<small>MIN</small></span></div>"+runBlock(b)+"</div>";
  if(S.flash)h+='<div class="flash '+S.flash.c+'"><span>'+S.flash.t+"</span><b>"+esc(S.flash.b)+"</b></div>";
  h+='<section class="sec-h"><span class="eyebrow">This session</span><h2>'+(c.kind==="range"?"Range practice":"Round day warm-up")+"</h2></section>"+planList(c)+'<div class="btns"><button class="ghost" data-act="tohome">Home</button><button class="ghost" data-act="discard">Abandon session</button></div>';
  return h}
function weekOf(ds){var m=monday(ds);return S.history.filter(function(h){return monday(h.date)===m}).slice().reverse()}
function weekReport(m){var W=S.history.filter(function(h){return monday(h.date)===m}).slice().reverse(),R=[];
  var rounds=W.filter(function(h){return h.kind==="round"}).length,range=W.filter(function(h){return h.kind==="range"}).length;
  R.push((S.player||"Paul Goddard")+": week of "+nice(m)+" (goal: scratch)");
  R.push("Round day warm-ups: "+rounds+" of "+WEEK_ROUNDS+" · Range practice: "+range);
  if(W.length){var tot=W.reduce(function(a,h){return a+(h.st.sg||0)},0);R.push("Strokes gained vs scratch this week: "+sgf(tot));
    var hs=W.map(function(h){return h.st.hc}).filter(function(x){return x!=null});if(hs.length)R.push("Average session handicap: "+hcTxt(hs.reduce(function(a,x){return a+x},0)/hs.length))}
  W.forEach(function(h){var s=h.st,p=[];R.push("");R.push(nice(h.date)+" · "+(h.kind==="range"?"Range practice":"Round day warm-up ("+(h.order==="putt"?"putting first":"range first")+")")+" · played like "+hcTxt(s.hc)+" · SG vs scratch "+sgf(s.sg));
    if(s.gate!=null)p.push("Gate "+s.gate+"/10");if(s.holeout!=null)p.push("Hole Out "+s.holeout+"/12 ("+sgf(s.sg_holeout||0)+")");if(s.money!=null)p.push("Money Stealers "+s.money+"/12 ("+sgf(s.sg_money||0)+")");
    if(s.ladder!=null)p.push("Ladder "+s.ladder+"/"+Math.max(0,s.ladderN-1));if(s.strike!=null)p.push("Strike "+s.strike+"/5 centred");
    if(s.sg_drive!=null)p.push("Driving "+sgf(s.sg_drive)+", "+s.fairways+"/"+s.drives+" fairways, longest "+Math.round(s.longest));if(s.sg_app!=null)p.push("Approach "+sgf(s.sg_app));
    if(s.wd!=null)p.push("Wedge Darts "+s.wd+" pts ("+sgf(s.sg_wd||0)+")");if(p.length)R.push("  "+p.join(" · "));
    if(h.pbs&&h.pbs.length)R.push("  New PBs: "+h.pbs.map(function(k){return PBS.filter(function(x){return x[0]===k})[0][1]}).join(", "))});
  var B=bests();R.push("");R.push("Personal bests:");PBS.forEach(function(p){if(B[p[0]])R.push("  "+p[1]+": "+p[3](B[p[0]].v)+" ("+nice(B[p[0]].date)+")")});
  return R}
function sendWeek(m){var R=weekReport(m);S.sent[m]=today();save();
  location.href="mailto:"+COACH+"?subject="+encodeURIComponent((S.player||"Paul Goddard")+" golf plan: week of "+nice(m))+"&body="+encodeURIComponent(R.join("\n"));setTimeout(render,300)}
function sessRow(h){return '<tr data-act="hist" data-v="'+h.id+'" style="cursor:pointer"><td>'+nice(h.date)+'</td><td>'+(h.kind==="range"?"Range":"Round warm-up")+(h.pbs&&h.pbs.length?'<span class="pb">PB</span>':"")+'</td><td class="r">'+hcTxt(h.st.hc)+'</td><td class="r '+(h.st.sg>=0?"up":"down")+'">'+sgf(h.st.sg)+"</td></tr>"}
function renderSummary(h){var s=h.st,rows=[],pb=h.pbs||[];
  function row(k,label,val,sg){rows.push("<tr><td>"+label+(pb.indexOf(k)>-1?'<span class="pb">New PB</span>':"")+'</td><td class="r">'+val+'</td><td class="r '+(sg==null?"":sg>=0?"up":"down")+'">'+(sg==null?"–":sgf(sg))+"</td></tr>")}
  if(s.gate!=null)row("gate","Start-line gate",s.gate+"/10");if(s.holeout!=null)row("holeout","Hole Out",s.holeout+"/12",s.sg_holeout);if(s.money!=null)row("money","Money Stealers",s.money+"/12 pts",s.sg_money);
  if(s.ladder!=null)row("ladder","Ladder to 70",s.ladder+"/"+Math.max(0,s.ladderN-1));if(s.strike!=null)row("strike","Strike station",s.strike+"/5 centred");
  if(s.sg_drive!=null)row("sg_drive","Driving",s.fairways+"/"+s.drives+" fairways",s.sg_drive);if(s.sg_app!=null)row("sg_app","Approach","8 flags",s.sg_app);if(s.wd!=null)row("wd","Wedge Darts",s.wd+" pts",s.sg_wd);
  var hcPb=pb.indexOf("hc")>-1;
  return '<div class="verdict"><span class="k">'+nice(h.date)+" · "+(h.kind==="range"?"Range practice":"Round day warm-up")+'</span><div class="hc">'+hcTxt(s.hc)+'</div><p>This session played like a '+(s.hc==null?"–":hcTxt(s.hc).toLowerCase()==="scratch"?"scratch golfer":hcTxt(s.hc)+" handicap")+(hcPb?" · best yet":"")+'. Strokes gained against your scratch goal: <b style="color:var(--gold)">'+sgf(s.sg)+"</b> over "+s.n+" shots.</p></div>"+
    '<div class="card"><span class="eyebrow">Game by game</span><div class="grid"><table><thead><tr><th>Game</th><th class="r">Score</th><th class="r">SG vs scratch</th></tr></thead><tbody>'+rows.join("")+"</tbody></table></div>"+
    (pb.length?'<div class="note">New personal best'+(pb.length>1?"s":"")+": "+pb.map(function(k){return PBS.filter(function(x){return x[0]===k})[0][1]}).join(", ")+"</div>":"")+
    '<button class="primary" data-act="home">Done</button></div>'}
function renderHome(){var h="",t=today(),m=monday(t),W=weekOf(t),rounds=W.filter(function(x){return x.kind==="round"}).length,range=W.filter(function(x){return x.kind==="range"}).length;
  h+='<div class="card"><div class="two"><label class="fld"><span class="label">Name</span><input id="player" autocomplete="name" placeholder="Paul Goddard" value="'+esc(S.player)+'"></label><label class="fld"><span class="label">Driver carry (yds)</span><input id="drvIn" inputmode="numeric" value="'+S.drv+'"></label></div></div>';
  if(S.cur)h+='<div class="resume"><b>You have a session in progress</b><span class="muted">'+(S.cur.kind==="range"?"Range practice":"Round day warm-up")+" · block "+(S.cur.bi+1)+" of "+S.cur.blocks.length+'</span><div class="btns"><button class="primary" data-act="resume">Carry on</button><button class="ghost" data-act="discard">Start again</button></div></div>';
  /* week */
  var tot=W.reduce(function(a,x){return a+(x.st.sg||0)},0),hs=W.map(function(x){return x.st.hc}).filter(function(x){return x!=null});
  h+='<section class="sec-h"><span class="eyebrow">01 / This week</span><h2>Week of '+nice(m)+"</h2></section>";
  h+='<div class="card"><div class="wk">'+[0,1,2,3,4,5,6].map(function(i){var d=addDays(m,i),ss=S.history.filter(function(x){return x.date===d});return '<div class="'+(d===t?"today":"")+'">'+["M","T","W","T","F","S","S"][i]+ss.map(function(x){return '<i class="'+(x.kind==="round"?"r":"p")+'">'+(x.kind==="round"?"ROUND":"RANGE")+"</i>"}).join("")+"</div>"}).join("")+"</div>"+
    '<div class="stats"><div><span class="label">Round warm-ups</span><b class="tnum">'+rounds+"/"+WEEK_ROUNDS+'</b></div><div><span class="label">SG vs scratch</span><b class="tnum '+(W.length?(tot>=0?"up":"down"):"")+'">'+(W.length?sgf(tot):"–")+'</b></div><div><span class="label">Avg handicap</span><b class="tnum">'+(hs.length?hcTxt(hs.reduce(function(a,x){return a+x},0)/hs.length):"–")+"</b></div></div>"+
    '<span class="muted">'+range+" range session"+(range===1?"":"s")+" this week.</span>";
  var dow=(new Date().getDay()+6)%7;if(W.length&&dow>=6&&!S.sent[m])h+='<div class="note">It’s the end of the week. Send your week to Jack.</div>';
  h+='<div class="btns"><button class="dark" data-act="send" data-v="'+m+'">'+(S.sent[m]?"Send again":"Send my week to Jack")+'</button><button class="ghost" data-act="copy" data-v="'+m+'" style="flex:0 0 auto">Copy</button></div>'+(S.sent[m]?'<span class="muted">Sent '+nice(S.sent[m])+".</span>":"");
  var pm=addDays(m,-7);if(S.history.some(function(x){return monday(x.date)===pm})&&!S.sent[pm])h+='<button class="linky" data-act="send" data-v="'+pm+'">Last week wasn’t sent. Send week of '+nice(pm)+"</button>";
  h+="</div>";
  /* start */
  h+='<section class="sec-h"><span class="eyebrow">02 / Start a session</span><h2>Pick your game plan</h2></section>';
  h+='<div class="card"><div class="pick"><button data-act="start" data-v="round"><b>Round day warm-up</b><small>Putting warm-up: start-line gate, Hole Out and Money Stealers (15 mins). Range warm-up: the Practice Plan 30 min approach and driver plus a 5 min technical station (35 mins).</small></button></div>'+
    '<span class="label">Which warm-up first?</span><div class="seg"><button data-act="order" data-v="putt" aria-pressed="'+(S.order==="putt")+'">Putting first</button><button data-act="order" data-v="range" aria-pressed="'+(S.order==="range")+'">Range first</button></div></div>';
  h+='<div class="card"><div class="pick"><button data-act="start" data-v="range"><b>Range practice</b><small>Practice Plan warm-up, your technical station, then Wedge Darts (18 balls, strokes gained on every shot) and a warm down. About 45 mins.</small></button></div></div>';
  /* bests */
  var B=bests();h+='<section class="sec-h"><span class="eyebrow">03 / Personal bests</span><h2>My PBs</h2></section><div class="card">';
  var pr=PBS.filter(function(p){return B[p[0]]});h+=pr.length?'<div class="grid"><table><tbody>'+pr.map(function(p){return "<tr><td>"+p[1]+'</td><td class="r"><b>'+p[3](B[p[0]].v)+'</b></td><td class="r muted">'+nice(B[p[0]].date)+"</td></tr>"}).join("")+"</tbody></table></div>":'<span class="muted">Your bests appear here after your first session.</span>';
  h+="</div>";
  /* history */
  h+='<section class="sec-h"><span class="eyebrow">04 / History</span><h2>Every session</h2></section><div class="card">';
  h+=S.history.length?'<div class="grid"><table><thead><tr><th>Date</th><th>Session</th><th class="r">Played like</th><th class="r">SG</th></tr></thead><tbody>'+S.history.slice(0,40).map(sessRow).join("")+"</tbody></table></div>":'<span class="muted">Finished sessions appear here, each with the handicap it was played to and its strokes gained against scratch.</span>';
  h+='<span class="muted">Strokes gained compares every shot with a scratch golfer from the same spot (Mark Broadie’s data, adjusted by handicap). The session handicap is the level whose average golfer would have matched you exactly.</span></div>';
  return h}
function render(){var m=$("main");if(!m)return;stopTimerIfLeft();var last=S.last&&S.history.filter(function(x){return x.id===S.last})[0];m.innerHTML=last?renderSummary(last):S.cur&&S.view!=="home"?renderRun():renderHome();$("hName").textContent=S.player||"Paul Goddard";bind()}
function stopTimerIfLeft(){var b=cur();if(TM&&!(b&&b.timer))stopTimer()}
function bind(){var m=$("main");m.querySelectorAll("[data-act]").forEach(function(el){el.onclick=function(){act(el.dataset.act,el.dataset.v)}});
  var p=$("player");if(p)p.oninput=function(e){act("name",e.target.value)};var d=$("drvIn");if(d)d.onchange=function(e){act("drv",e.target.value)};
  ["carryIn","offIn","ladIn"].forEach(function(id){var e=$(id);if(e)e.onkeydown=function(ev){if(ev.key==="Enter"){if(id==="offIn")act("lm");else if(id==="carryIn"){var o=$("offIn");o&&o.focus()}}}});
  var b=cur();if(b&&b.timer)bindTimer(b)}
render();
</script>

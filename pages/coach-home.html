  var weeks=+((pd&&pd.weeks)||6)||6,t=today(),d=daysBetween(start,t),week=Math.floor(d/7)+1,end=addDays(start,weeks*7-1),left=daysBetween(t,end);
  var next=pd&&PLANS.some(function(x){return x.id!==pd.id&&String(x.playerEmail||"").toLowerCase()===String(p.email||"").toLowerCase()&&((+x.phase||1)>(+pd.phase||1)||(x.startDate&&x.startDate>=addDays(end,-7)))});
  var st=d<0?"soon":week>weeks?"over":left<REVIEW_DAYS?"review":"ok";
  return {start:start,weeks:weeks,week:week,end:end,left:left,status:st,next:!!next,phase:pd?(+pd.phase||1):null}}
function phaseBar(p){var f=phaseOf(p);if(!f)return "";var w=Math.max(0,Math.min(f.week,f.weeks)),segs="";
  for(var i=1;i<=f.weeks;i++)segs+='<i class="'+(f.status==="over"?"done":i<w?"done":i===w?"now":"")+'"></i>';
  var lab=f.status==="soon"?'Starts <b>'+esc(nice(f.start))+'</b>':f.status==="over"?'<b>Phase finished</b>':'<b>Week '+f.week+' of '+f.weeks+'</b>';
  var side=f.status==="soon"?'':f.status==="over"?(f.next?'next plan built':Math.abs(f.left)+' day'+(Math.abs(f.left)===1?'':'s')+' ago'):f.status==="review"?(f.next?'next plan built':'review due · ends '+esc(nice(f.end))):'ends '+esc(nice(f.end));
  return '<div class="phase '+(f.next?"ok":f.status)+'"><div class="pl"><span>'+(f.phase?'Phase '+f.phase+' · ':'')+lab+'</span><span>'+side+'</span></div><div class="segs" style="grid-template-columns:repeat('+f.weeks+',1fr)">'+segs+'</div></div>'}
function reviewsDue(){return PEOPLE.map(function(p){return {p:p,f:phaseOf(p)}}).filter(function(x){return x.f&&!x.f.next&&(x.f.status==="review"||x.f.status==="over")}).sort(function(a,b){return a.f.left-b.f.left})}
function reviewPop(){var due=reviewsDue(),el=document.getElementById("ch-revpop"),key="mg-revpop-min:"+today();
  if(!due.length){if(el)el.remove();return}
  if(!el){el=document.createElement("div");el.id="ch-revpop";el.className="revpop";el.setAttribute("role","status");document.getElementById("ch").appendChild(el)}
  var min=ls(key)==="1";el.classList.toggle("min",min);
  el.innerHTML='<div class="rh"><b>⚠ '+due.length+' six-week review'+(due.length===1?'':'s')+(min?'':' due')+'</b><button class="rx" type="button" data-act="revmin" aria-label="Minimise">–</button></div>'+
    due.map(function(x){var f=x.f;return '<button class="ri'+(f.status==="over"?' over':'')+'" type="button" data-player="'+esc(x.p.key)+'"><b>'+esc(x.p.name)+'</b><span>'+(f.status==="over"?'Phase '+(f.phase||'')+' finished '+esc(nice(f.end))+' · no next plan yet':'Week '+f.week+' of '+f.weeks+' · ends '+esc(nice(f.end))+' ('+(f.left<=0?'today':f.left+' day'+(f.left===1?'':'s')+' left')+')')+'</span></button>'}).join("")}

var C={gold:"#FFD900",cream:"#f3f1ea",mute:"#8f8a7c",grid:"#2c2b27",green:"#5fd38d",red:"#e2574c",blue:"#7fb2e5"};
function tx(x,y,t,o){o=o||{};return '<text x="'+x+'" y="'+y+'" font-family="'+(o.f||"Inter,sans-serif")+'" font-size="'+(o.s||11)+'" font-weight="'+(o.w||600)+'" text-anchor="'+(o.a||"start")+'" fill="'+(o.c||C.cream)+'">'+esc(t)+'</text>'}
function lineChart(series,days,max){var W=640,H=200,L=30,R=12,T=14,B=26,n=days.length,X=function(i){return L+i*(W-L-R)/Math.max(1,n-1)},Y=function(v){return T+(1-v/max)*(H-T-B)},g="";
  [0,max/2,max].forEach(function(v){g+='<line x1="'+L+'" y1="'+Y(v)+'" x2="'+(W-R)+'" y2="'+Y(v)+'" stroke="'+C.grid+'"/>'+tx(L-6,Y(v)+4,String(Math.round(v)),{a:"end",s:9,c:C.mute})});
  days.forEach(function(d,i){if(i%Math.ceil(n/7)===0||i===n-1)g+=tx(X(i),H-8,nice(d),{a:"middle",s:9,c:C.mute})});
  series.forEach(function(s){var pts=[];s.v.forEach(function(v,i){if(v!=null)pts.push([X(i),Y(v)])});if(pts.length>1)g+='<polyline points="'+pts.map(function(p){return p.join(",")}).join(" ")+'" fill="none" stroke="'+s.c+'" stroke-width="2.5"/>';
    pts.forEach(function(p){g+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="3" fill="'+s.c+'"/>'})});
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img">'+g+'</svg>'}
function barChart(vals,labels,target,col){var W=640,H=190,L=26,R=12,T=16,B=26,n=vals.length,mx=Math.max(target||0,Math.max.apply(null,vals.concat([1]))),bw=(W-L-R)/n,g="";
  if(target){var ty=T+(1-target/mx)*(H-T-B);g+='<line x1="'+L+'" y1="'+ty+'" x2="'+(W-R)+'" y2="'+ty+'" stroke="'+C.gold+'" stroke-dasharray="6 5"/>'+tx(W-R,ty-5,"target "+target,{a:"end",s:9,c:C.gold})}
  vals.forEach(function(v,i){var h=v/mx*(H-T-B),x=L+i*bw+bw*.18;g+='<rect x="'+x+'" y="'+(H-B-h)+'" width="'+bw*.64+'" height="'+Math.max(h,1)+'" rx="4" fill="'+(col||C.red)+'"/>'+tx(x+bw*.32,H-B-h-5,String(v),{a:"middle",s:10,w:800})+tx(x+bw*.32,H-8,labels[i],{a:"middle",s:9,c:C.mute})});
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img">'+g+'</svg>'}
function weightChart(ws,target){if(!ws||ws.length<1)return "";ws=ws.slice().sort(function(a,b){return a.date<b.date?-1:1}).slice(-20);var vals=ws.map(function(w){return +w.kg});if(target)vals.push(+target);
  var lo=Math.min.apply(null,vals)-1,hi=Math.max.apply(null,vals)+1,W=640,H=190,L=40,R=14,T=14,B=26,n=ws.length,X=function(i){return L+i*(W-L-R)/Math.max(1,n-1)},Y=function(v){return T+(hi-v)/(hi-lo)*(H-T-B)},g="";
  [hi-0.5,(hi+lo)/2,lo+0.5].forEach(function(v){g+='<line x1="'+L+'" y1="'+Y(v)+'" x2="'+(W-R)+'" y2="'+Y(v)+'" stroke="'+C.grid+'"/>'+tx(L-6,Y(v)+4,v.toFixed(1),{a:"end",s:9,c:C.mute})});
  if(target)g+='<line x1="'+L+'" y1="'+Y(+target)+'" x2="'+(W-R)+'" y2="'+Y(+target)+'" stroke="'+C.gold+'" stroke-dasharray="6 5"/>'+tx(W-R,Y(+target)-5,"target "+target,{a:"end",s:9,c:C.gold});
  g+='<polyline points="'+ws.map(function(w,i){return X(i)+","+Y(+w.kg)}).join(" ")+'" fill="none" stroke="'+C.blue+'" stroke-width="2.5"/>';
  ws.forEach(function(w,i){g+='<circle cx="'+X(i)+'" cy="'+Y(+w.kg)+'" r="3.5" fill="'+C.blue+'"/>';if(i===0||i===n-1)g+=tx(X(i),H-8,nice(w.date),{a:i?"end":"start",s:9,c:C.mute})});
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img">'+g+'</svg>'}
function ring(v,max,col,label,pct){var p=pct?Math.min(1,v/100):max?Math.min(1,v/max):0,R=30,Cc=2*Math.PI*R;return '<div style="text-align:center"><svg viewBox="0 0 76 76" style="max-width:96px;margin:0 auto"><circle cx="38" cy="38" r="'+R+'" fill="none" stroke="#2c2b27" stroke-width="8"/>'+(p>0?'<circle cx="38" cy="38" r="'+R+'" fill="none" stroke="'+col+'" stroke-width="8" stroke-linecap="round" stroke-dasharray="'+(Cc*p)+' '+Cc+'" transform="rotate(-90 38 38)"/>':'')+

      '<div class="card"><div class="card-h"><h3>Gym sessions by week</h3></div>'+(gw.some(function(v){return v})?barChart(gw,labels,st.gymT||0,C.red):'<p class="empty">No gym sessions logged yet.</p>')+'</div></div>';
    var wt=(pd&&pd.weight)||{};h+='<div class="grid2"><div class="card"><div class="card-h"><h3>Weight</h3>'+(wt.target?'<span class="hint">target '+esc(wt.target)+' '+esc(wt.unit||"kg")+'</span>':'')+'</div>'+((S.weights||[]).length?weightChart(S.weights,wt.target):'<p class="empty">No weigh-ins yet.</p>')+'</div>'+

  else if(p.code)h+='<div class="card"><p class="empty">'+esc(p.name)+' hasn\u2019t opened their plan yet. Their data will show here once they do.</p></div>';

  var ek=p.email||(p.code?"code:"+p.code:"");if(ek)h+='<div class="card" id="ch-train"><div class="card-h"><h3>Training and golf data</h3><span class="hint">everything from the Player dashboard</span><span class="spacer"></span><a class="btn sm" href="'+SITE+'coach-713580" data-act="builder" target="_blank" rel="noopener">Open full Player dashboard \u2197</a></div><iframe id="ch-embed" title="Training and golf data for '+esc(p.name)+'" src="'+SITE+'coach-713580?embed=1&person='+encodeURIComponent(ek)+'" style="width:100%;height:900px;border:0;border-radius:8px;background:#F4F1EA"></iframe></div>';

var NOTE_CATS=["1-to-1 meeting","Coach note","Programme change","Golf","Fitness","Mental","Admin"];
function filterNotes(ns){var q=ui.noteQ.toLowerCase();return (ns||[]).filter(function(n){return (!ui.noteCat||n.category===ui.noteCat)&&(!q||((n.title||"")+" "+(n.body||"")+" "+(n.category||"")).toLowerCase().indexOf(q)>=0)})}
function docForm(){return '<form class="form" id="ch-docform"><div class="row"><input type="text" id="df-title" placeholder="Name, e.g. TPI screen May 2026" style="flex:1;min-width:160px"><select id="df-kind"><option>Google Drive</option><option>TPI report</option><option>Match Up audit</option><option>Video</option><option>Other</option></select></div>'+
  '<input type="text" id="df-url" placeholder="Paste the link (https://drive.google.com/\u2026)"><div class="row"><label class="ck"><input type="checkbox" id="df-shared"> Player can see this in their plan</label><span class="spacer"></span><button class="btn gold" type="submit">Add document</button></div><div class="err" id="df-err"></div></form>'}
function docHTML(d){return '<div class="task" style="grid-template-columns:34px 1fr auto"><span class="av" style="width:30px;height:30px;font-size:13px">'+esc((d.kind||"Doc").slice(0,2).toUpperCase())+'</span><div><a class="tt" href="'+esc(d.url)+'" target="_blank" rel="noopener" style="color:var(--gold)">'+esc(d.title)+' \u2197</a>'+
  '<div class="chips" style="margin-top:4px">'+(d.kind?'<span class="chip">'+esc(d.kind)+'</span>':'')+'<span class="chip '+(d.shared?'ok':'')+'">'+(d.shared?'Shared with player':'Coach only')+'</span><span class="chip">'+esc(nice(d.created_at))+'</span></div></div><button class="btn sm ghost" type="button" data-del="doc" data-id="'+esc(d.id)+'" aria-label="Delete document">\u2715</button></div>'}
function practiceCard(S,pd){var ws=Object.keys(S.practice||{}).filter(function(k){return /^w\d+$/.test(k)}).sort(function(a,b){return +a.slice(1)-+b.slice(1)});
  var vals=ws.map(function(k){var o=S.practice[k];return Object.keys(o).filter(function(x){return x!=="drills"&&o[x]===true}).length});
  var pb=S.drillPB||{},NM={"drill-ladder":"Ladder up to 70 yds","drill-strike":"Strike station","drill-landing-ladder":"Landing ladder"};
  var h=vals.length?barChart(vals,ws.map(function(k){return "W"+k.slice(1)}),0,C.gold):'<p class="empty">No practice ticked off yet.</p>';
  var pbs=Object.keys(pb);if(pbs.length)h+='<div class="hint">Drill personal bests</div><div class="chips">'+pbs.map(function(k){return '<span class="chip gold">'+esc(NM[k]||k)+' · best '+pb[k].best+' · last '+pb[k].last+'</span>'}).join("")+'</div>';
  return h}
function reviewsCard(S){var R=S.reviews||{},ks=Object.keys(R).filter(function(k){return R[k]&&R[k].at}).sort(function(a,b){return +b.slice(1)-+a.slice(1)});if(!ks.length)return '<div class="card"><div class="card-h"><h3>Weekly reviews</h3></div><p class="empty">No weekly reviews sent yet.</p></div>';
  var r=R[ks[0]],qs=r.q||{},as=r.a||{};
  return '<div class="card"><div class="card-h"><h3>Latest weekly review</h3><span class="hint">Week '+esc(ks[0].slice(1))+' · sent '+esc(nice(r.at))+' · '+ks.length+' sent in total</span></div>'+Object.keys(as).filter(function(k){return String(as[k]).trim()}).map(function(k){return '<div class="rv"><span>'+esc(qs[k]||k)+'</span><p>'+esc(as[k])+'</p></div>'}).join("")+'</div>'}
function noteForm(){var n=ui.editNote||{};return '<form class="form" id="ch-noteform"><div class="row"><input type="date" id="nf-date" value="'+esc(n.meet_date||today())+'" aria-label="Meeting date"><input type="text" id="nf-title" placeholder="Title, e.g. Week 3 check-in call" value="'+esc(n.title||"")+'" style="flex:1;min-width:200px"><select id="nf-cat" aria-label="Type of note">'+NOTE_CATS.map(function(c){return '<option'+((n.category||"1-to-1 meeting")===c?' selected':'')+'>'+c+'</option>'}).join("")+'</select></div>'+
  '<textarea id="nf-body" placeholder="What you talked about, what’s going well, what to work on, what was agreed…">'+esc(n.body||"")+'</textarea>'+
  '<div class="row"><label class="ck"><input type="checkbox" id="nf-shared"'+(n.shared===false?'':' checked')+'> Player can see this note</label><label class="ck"><input type="checkbox" id="nf-pin"'+(n.pinned?' checked':'')+'> Pin to the top</label><span class="spacer"></span>'+(n.id?'<button class="btn sm ghost" type="button" data-act="cancelnote">Cancel</button>':'')+'<button class="btn gold" type="submit">'+(n.id?'Save changes':'Save note')+'</button></div><div class="err" id="nf-err"></div></form>'}
function noteHTML(n){return '<div class="note'+(n.shared?'':' private')+'"><div class="nh">'+(n.pinned?'<span class="chip gold">Pinned</span>':'')+'<b>'+esc(n.title||"1-to-1")+'</b>'+(n.category?'<span class="chip">'+esc(n.category)+'</span>':'')+'<span class="hint">'+esc(nice(n.meet_date))+(n.coach?' · '+esc(n.coach):'')+' · '+(n.shared?'shared with player':'coach only')+'</span><span class="spacer"></span>'+
  '<button class="btn sm ghost" type="button" data-editnote="'+esc(n.id)+'">Edit</button><button class="btn sm ghost" type="button" data-del="note" data-id="'+esc(n.id)+'">Delete</button></div><div class="body">'+esc(n.body||"")+'</div></div>'}
function taskBar(ts){var d=ts.filter(function(t){return t.status==="done"}).length;return ts.length?'<span class="spacer"></span><span class="hint">'+d+' of '+ts.length+' done</span><div class="bar" style="flex-basis:100%"><i style="width:'+Math.round(d/ts.length*100)+'%"></i></div>':''}
function taskForm(){return '<form class="form" id="ch-taskform"><input type="text" id="tf-title" placeholder="Task, e.g. Send me 3 swing videos from the range" required><div class="row"><input type="date" id="tf-due" aria-label="Due date"><select id="tf-owner" aria-label="Who does it"><option value="player">Player does it</option><option value="coach">Coach does it</option></select><span class="spacer"></span><button class="btn gold" type="submit">Add task</button></div>'+
  '<input type="text" id="tf-detail" placeholder="Detail (optional)"><div class="err" id="tf-err"></div></form>'}
function taskHTML(t){var over=t.status==="open"&&t.due&&t.due<today();return '<div class="task'+(t.status==="done"?' done':'')+'"><input type="checkbox" data-task="'+esc(t.id)+'"'+(t.status==="done"?' checked':'')+' aria-label="Done"><div><div class="tt">'+esc(t.title)+'</div>'+(t.detail?'<div class="td">'+esc(t.detail)+'</div>':'')+
  '<div class="chips" style="margin-top:4px"><span class="chip '+(t.owner==="coach"?"":"gold")+'">'+(t.owner==="coach"?"Coach":"Player")+'</span>'+(t.due?'<span class="chip '+(over?"bad":"")+'">'+(over?"Overdue · ":"Due ")+esc(nice(t.due))+'</span>':'')+(t.status==="done"&&t.done_at?'<span class="chip ok">Done '+esc(nice(t.done_at))+(t.done_by==="player"?' by player':'')+'</span>':'')+'</div></div>'+

/* ---------- actions ---------- */
function getBoard(p){var refs=[p.ref];if(p.code&&p.email&&ATH[p.email])refs.push("email:"+p.email);
  return Promise.all(refs.map(function(r){return rpc("mg_coach_board",{p_code:r})})).then(function(bs){var o={notes:[],tasks:[],docs:[]};var seenId={};bs.forEach(function(b){["notes","tasks","docs"].forEach(function(k){((b&&b[k])||[]).forEach(function(x){if(!seenId[x.id]){seenId[x.id]=1;o[k].push(x)}})})});
    o.notes.sort(function(a,b){return (b.pinned?1:0)-(a.pinned?1:0)||String(b.meet_date).localeCompare(String(a.meet_date))});return o})}
function openPlayer(key){cur=PEOPLE.filter(function(p){return p.key===key||p.code===key})[0];if(!cur)return;view="player";BOARD=null;ui.editNote=null;ui.noteQ="";ui.noteCat="";ui.noteAll=false;history.replaceState(null,"","#athlete="+encodeURIComponent(cur.key));render();window.scrollTo(0,0);
  var k=cur.key;getBoard(cur).then(function(b){BOARD=b;if(view==="player"&&cur&&cur.key===k)render()}).catch(function(e){BOARD={notes:[],tasks:[],docs:[]};render();alert("Couldn\u2019t load notes and tasks: "+e.message)})}
function refreshBoard(){var y=window.scrollY;return Promise.all([getBoard(cur),rpc("mg_coach_board_summary").catch(function(){return SUM})]).then(function(r){BOARD=r[0];SUM=r[1]||SUM;render();window.scrollTo(0,y)})}
document.addEventListener("click",function(e){var t=e.target;
  var go=t.closest("[data-go]");if(go){view=go.dataset.go;if(view!=="player")cur=null;history.replaceState(null,"",view==="home"?"#":"#"+view);render();window.scrollTo(0,0);return}
  var su=t.closest("[data-sup]");if(su&&cur){assign(su.dataset.sup,su.getAttribute("aria-pressed")==="true"?null:"support");return}
  var cr=t.closest("[data-creset]");if(cr){if(confirm("Reset this coach\u2019s password? They\u2019ll choose a new one at their next login (with the old team password)."))coachAdmin(cr.dataset.creset,{reset:true});return}
  var ca=t.closest("[data-cactive]");if(ca){var cc=(CADM||[]).filter(function(x){return x.id===ca.dataset.cactive})[0];if(cc)coachAdmin(cc.id,{active:!cc.active});return}
  var rp=t.closest("#ch-revpop");if(rp){var key="mg-revpop-min:"+today();if(t.closest("[data-act=revmin]")){ls(key,"1");reviewPop();return}if(rp.classList.contains("min")){ls(key,"0");reviewPop();return}}
  var pl=t.closest("[data-player]");if(pl){openPlayer(pl.dataset.player);return}
  var f=t.closest("[data-filter]");if(f){filter=f.dataset.filter;render();return}
  var en=t.closest("[data-editnote]");if(en){ui.editNote=(BOARD.notes||[]).filter(function(n){return n.id===en.dataset.editnote})[0]||null;render();var fm=$("#ch-noteform");if(fm)fm.scrollIntoView({block:"center"});return}
  var a=t.closest("[data-act]");if(a){var k=a.dataset.act;
    if(k==="signout"){MGCoach.logout();location.hash="";location.reload();return}
    if(k==="coaches"){view="coaches";CADM=null;ui.msg="";render();return}
    if(k==="mypass"){view="mypass";render();return}
    if(k==="cancelnote"){ui.editNote=null;render();return}
    if(k==="allnotes"){ui.noteAll=true;render();return}
    if(k==="addath"){ui.addAth=!ui.addAth;render();var fe=$("#af-name");if(fe)fe.focus();return}
    if(k==="untag"){var on=!cur.athlete;if(!on&&!confirm("Remove "+cur.name+" from MG Athletes? They lose the MG badge on the leaderboards unless they have a 1-to-1 plan in the app."))return;
      rpc("mg_coach_athlete_set",{p_email:cur.email,p_name:cur.name,p_on:on,p_source:"MG Athlete dashboard",p_coach:coach()}).then(function(){var k2=cur.key;return load().then(function(){var still=PEOPLE.filter(function(x){return x.key===k2})[0];if(still)openPlayer(k2);else{view="players";cur=null;render()}})}).catch(function(err){alert("Couldn\u2019t update: "+err.message)});return}
    if(k==="builder"){ss("mg-coach-s",pass);return}}
  var d=t.closest("[data-del]");if(d){if(!confirm(d.dataset.del==="note"?"Delete this note? This can’t be undone.":"Delete this task? This can’t be undone."))return;
    rpc("mg_coach_board_delete",{p_kind:d.dataset.del,p_id:d.dataset.id}).then(refreshBoard).catch(function(err){alert("Couldn’t delete: "+err.message)});return}});
document.addEventListener("change",function(e){var t=e.target;
  if(t.id==="ch-lead"&&cur){var old=(coachesOf(cur).filter(function(a){return a.role==="lead"})[0]||{}).coach;(t.value?assign(t.value,"lead"):old?assign(old,"support"):Promise.resolve());return}
  if(t.dataset&&t.dataset.crole){coachAdmin(t.dataset.crole,{role:t.value});return}

  if(f.id==="ch-athform"){e.preventDefault();var em=$("#af-email").value.trim(),nm=$("#af-name").value.trim();
    rpc("mg_coach_athlete_set",{p_email:em,p_name:nm,p_on:true,p_source:"MG Athlete dashboard",p_coach:coach()}).then(function(){ui.addAth=false;return load()}).then(function(){openPlayer((em||"").toLowerCase())}).catch(function(err){$("#af-err").textContent=err.message});return}
  if(f.id==="ch-taskform"){e.preventDefault();var tk={code:cur.ref,title:$("#tf-title").value.trim(),detail:$("#tf-detail").value.trim(),due:$("#tf-due").value,owner:$("#tf-owner").value,coach:coach()};
    f.querySelector("[type=submit]").disabled=true;rpc("mg_coach_task_save",{p_task:tk}).then(refreshBoard).catch(function(err){$("#tf-err").textContent="Couldn’t add: "+err.message;f.querySelector("[type=submit]").disabled=false});return}});

/* ---------- sign in ---------- */
function start(){return load().then(function(){$("#ch-gate").hidden=true;$("#ch-app").hidden=false;ss("mg-coach-s",pass);var M=me();$("#ch-who").textContent=(M.name||"")+(M.role?" · "+(M.role==="admin"?"Admin":M.role==="coach"?"Coach":"Own players"):"");$("#ch-coachesbtn").hidden=!MGCoach.canEditAccess();var hs=location.hash;
  var m=/^#(?:player|athlete)=([^&]+)/.exec(hs);if(m){openPlayer(decodeURIComponent(m[1]).replace(/^code:/,""));return}view=hs==="#players"?"players":"home";render()})}
MGCoachLogin.attach({form:$("#ch-login"),input:$("#ch-pw"),button:$("#ch-loginbtn")});
$("#ch-login").addEventListener("submit",function(e){e.preventDefault();var b=$("#ch-loginbtn");pass=$("#ch-pw").value;$("#ch-pw").value="";$("#ch-err").textContent="";b.disabled=true;b.textContent="Opening";
  start().catch(function(err){pass="";$("#ch-err").textContent=/Wrong password/.test(err.message)?"Wrong password.":err.message;b.disabled=false;b.textContent="Open"})});
var sp=ss("mg-coach-s");if(sp){pass=sp;start().catch(function(){pass="";ss("mg-coach-s",null)})}
})();
</script>

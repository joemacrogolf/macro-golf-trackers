<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* My Training: the front door for every member's training (VidApp "My Training" tab, docs/app-navigation-plan.md).
   Email + PIN → mg_whoami() → 1-to-1 client: "set by your coach" + button to their plan;
   has a training plan: opens it in place; old Pure plan: continue or build new; nobody yet: Build My Plan. */
.mt{min-height:100vh;background:#0B0B0B;color:#F4F1EA;font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;display:flex;align-items:flex-start;justify-content:center;
  padding:calc(36px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px));box-sizing:border-box}
.mt *{box-sizing:border-box}
.mt-in{width:100%;max-width:440px;display:flex;flex-direction:column;gap:14px}
.mt-k{font-weight:700;font-size:12px;letter-spacing:2.4px;text-transform:uppercase;color:#FFD900}
.mt .mt-h{font-family:'Anton',Impact,'Arial Narrow Bold',sans-serif!important;font-weight:400!important;text-transform:uppercase;font-size:48px!important;line-height:.98!important;letter-spacing:.2px!important;margin:0!important;color:#F4F1EA!important}
.mt .mt-h2{font-family:'Anton',Impact,'Arial Narrow Bold',sans-serif!important;font-weight:400!important;text-transform:uppercase;font-size:32px!important;line-height:1.02!important;margin:0!important;color:#F4F1EA!important}
.mt-bar{width:74px;height:6px;background:#FFD900}
.mt .mt-p{margin:0!important;color:#cfcabd;font-size:15px;line-height:1.5}
.mt form{display:flex;flex-direction:column;gap:12px;margin-top:6px}
.mt label{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:13px;letter-spacing:.3px;color:#F4F1EA}
.mt input{min-height:50px;padding:0 14px;border:1px solid rgba(244,241,234,.35);background:#141414;color:#F4F1EA;font:500 17px 'Inter',system-ui,sans-serif;border-radius:0;width:100%}
.mt input:focus{outline:3px solid #FFD900;outline-offset:1px;border-color:#FFD900}
.mt small{font-weight:400;color:#9C988C;font-size:12.5px}
.mt-go{min-height:54px;border:0;background:#FFD900;color:#0B0B0B;font:400 22px 'Anton',Impact,sans-serif;text-transform:uppercase;cursor:pointer;margin-top:4px;width:100%;text-decoration:none;display:flex;align-items:center;justify-content:center}
.mt-go[disabled]{opacity:.6}
.mt-ghost{min-height:52px;border:1px solid rgba(244,241,234,.35);background:transparent;color:#F4F1EA;font:400 20px 'Anton',Impact,sans-serif;text-transform:uppercase;cursor:pointer;width:100%}
.mt-link{align-self:flex-start;background:none;border:0;padding:6px 0;color:#FFD900;font:600 14px 'Inter',system-ui,sans-serif;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.mt-go:focus-visible,.mt-ghost:focus-visible,.mt-link:focus-visible,.mt-card:focus-visible{outline:3px solid #FFD900;outline-offset:3px}
.mt-sw{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.mt-sw button{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;min-height:84px;padding:14px;background:#141414;border:2px solid rgba(244,241,234,.25);color:#F4F1EA;cursor:pointer;font:inherit}
.mt-sw button b{font-family:'Anton',Impact,sans-serif;font-weight:400;text-transform:uppercase;font-size:21px;line-height:1.05}
.mt-sw button span{font-size:12.5px;color:#b7b2a6;line-height:1.35}
.mt-sw button[aria-pressed=true]{border-color:#FFD900;background:#1f1d14}
.mt-sw button[aria-pressed=true] b{color:#FFD900}
.mt-sw button:focus-visible{outline:3px solid #FFD900;outline-offset:2px}
.mt-sub{font-family:'Anton',Impact,sans-serif;text-transform:uppercase;font-size:22px;color:#F4F1EA;margin:8px 0 0}
.mt-err{min-height:1.2em;margin:0;color:#ffb4a8;font-weight:600;font-size:14px}
.mt-note{background:#1a1916;border-left:6px solid #FFD900;padding:14px 16px;color:#d9d5cb;font-size:14px;line-height:1.5}
.mt-help{margin-top:10px;padding-top:14px;border-top:1px solid rgba(244,241,234,.15);color:#9C988C;font-size:13px;line-height:1.5}
.mt-card{display:flex;flex-direction:column;gap:6px;text-align:left;width:100%;background:#1a1916;border:1px solid rgba(244,241,234,.18);border-left:6px solid #FFD900;color:#F4F1EA;padding:16px;cursor:pointer;font:inherit}
.mt-card b{font-family:'Anton',Impact,sans-serif;font-weight:400;text-transform:uppercase;font-size:22px;line-height:1.05}
.mt-card span{font-size:13.5px;color:#b7b2a6}
.mt-card.alt{border-left-color:#3a3833}
.mt-load{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#F4F1EA;color:#0B0B0B;font:600 15px 'Inter',system-ui,sans-serif;text-align:center;padding:24px}
.mt-load i{width:42px;height:42px;border:5px solid #0B0B0B;border-top-color:#FFD900;border-radius:50%;animation:mtspin .8s linear infinite}@keyframes mtspin{to{transform:rotate(360deg)}}
.mt-load button{min-height:48px;padding:0 20px;border:0;background:#FFD900;color:#0B0B0B;font:400 18px Anton,Impact,sans-serif;text-transform:uppercase;cursor:pointer}
@media (prefers-reduced-motion:reduce){.mt-load i{animation:none}}
</style>
<div class="mt" id="mt"><div class="mt-in" id="mt-in">
  <div class="mt-k">Macro Golf</div>
  <h1 class="mt-h">My Training</h1>
  <div class="mt-bar"></div>
  <p class="mt-p">Your training plan, built around your goals, your kit and your week.</p>
  <div class="mt-sw" role="group" aria-label="New or returning">
    <button type="button" data-mode="new" aria-pressed="true"><b>New here</b><span>Get started and build your plan</span></button>
    <button type="button" data-mode="login" aria-pressed="false"><b>Log in</b><span>I've used My Training before</span></button>
  </div>
  <form id="mt-form" novalidate>
    <p class="mt-sub" id="mt-sub">Get started</p>
    <p class="mt-p" id="mt-lead">Enter your email and choose a 4-digit PIN. You'll use these to log in next time.</p>
    <label>Email<input name="email" type="email" autocomplete="email" inputmode="email" required></label>
    <label><span id="mt-pinl">Choose a 4-digit PIN</span><input name="pin" type="password" inputmode="numeric" pattern="[0-9]{4,8}" minlength="4" maxlength="8" autocomplete="new-password" required placeholder="4 digits"></label>
    <label id="mt-pin2l">Type your PIN again<input name="pin2" type="password" inputmode="numeric" maxlength="8" autocomplete="new-password" placeholder="4 digits"></label>
    <p class="mt-err" id="mt-err" role="alert"></p>
    <button class="mt-go" type="submit">Build my plan</button>
  </form>
  <p class="mt-help" id="mt-help">Already have a Macro Golf training plan? Tap <b>Log in</b> and use the same email and PIN.</p>
</div></div>
<script src="{{BASE}}src/day-streak.js"></script>
<script>
(function(){
var RPC='https://zhcgwtlyqriwlhbzkxcl.supabase.co/rest/v1/rpc/',APIKEY='sb_publishable__IBhmrVHOXsLHruU7XJB-g_OSN9Ljne';
var ME='mgtrain:me',root=document.getElementById('mg-root')||document.getElementById('mt').parentNode;
/* the training plans this door can open: page path on macro.golf + the name shown to members */
var PLANS={
  'build-my-plan':{path:'p-258147',name:'Your built plan'},
  'pure-muscle-strength-gym':{path:'p-566009',name:'Pure Muscle & Strength (gym)'},
  'pure-muscle-strength-home':{path:'p-380885',name:'Pure Muscle & Strength (home)'},
  'pure-power-gym':{path:'p-462183',name:'Pure Power (gym)'},
  'pure-power-home':{path:'p-264152',name:'Pure Power (home)'},
  'pure-sequencing-gym':{path:'p-580535',name:'Pure Sequencing (gym)'},
  'pure-sequencing-home':{path:'p-429169',name:'Pure Sequencing (home)'}
};
[].forEach.call(root.querySelectorAll('style'),function(st){st.id='mt-css';document.head.appendChild(st)});
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){return null}}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function me(){try{var m=JSON.parse(ls(ME)||'null');return m&&m.em&&m.target?m:null}catch(e){return null}}
function save(m){ls(ME,JSON.stringify(m))}
var box=document.getElementById('mt-in'),f=document.getElementById('mt-form'),err=document.getElementById('mt-err'),go=f.querySelector('.mt-go');
var mode='new',GO={new:'Build my plan',login:'Open my training'};
function setMode(md){mode=md;
  [].forEach.call(box.querySelectorAll('[data-mode]'),function(b){b.setAttribute('aria-pressed',b.dataset.mode===md?'true':'false')});
  var n=md==='new';document.getElementById('mt-sub').textContent=n?'Get started':'Log in';
  document.getElementById('mt-lead').textContent=n?"Enter your email and choose a 4-digit PIN. You'll use these to log in next time.":'Use the email and PIN you chose when you started.';
  document.getElementById('mt-pinl').textContent=n?'Choose a 4-digit PIN':'Your PIN';
  document.getElementById('mt-pin2l').style.display=n?'':'none';f.pin.autocomplete=n?'new-password':'current-password';
  document.getElementById('mt-help').innerHTML=n?'Already have a Macro Golf training plan? Tap <b>Log in</b> and use the same email and PIN.':'Forgotten your PIN? Message your coach and they will reset it.';
  go.textContent=GO[md];err.textContent=''}
box.querySelector('.mt-sw').addEventListener('click',function(e){var b=e.target.closest('[data-mode]');if(b){setMode(b.dataset.mode);(f.email.value?f.pin:f.email).focus()}});
try{var last=ls('mgtrain:email')||ls('mgplan:email');if(last){f.email.value=last;setMode('login')}}catch(e){}

f.addEventListener('submit',function(e){e.preventDefault();err.textContent='';
  var em=String(f.email.value).trim().toLowerCase(),pin=String(f.pin.value).trim();
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){err.textContent='Check your email address.';f.email.focus();return}
  if(!/^\d{4,8}$/.test(pin)){err.textContent=mode==='new'?'Choose a PIN of 4 numbers.':'Your PIN is 4 to 8 numbers.';f.pin.focus();return}
  if(mode==='new'&&String(f.pin2.value).trim()!==pin){err.textContent="The two PINs don't match. Type them again.";f.pin2.value='';f.pin2.focus();return}
  go.disabled=true;go.textContent='Checking…';
  fetch(RPC+'mg_whoami',{method:'POST',headers:{apikey:APIKEY,'Content-Type':'application/json'},body:JSON.stringify({p_email:em,p_pin:pin})})
   .then(function(r){return r.json()}).then(function(j){
     if(!j||j.error||j.message){var t=(j&&(j.error||j.message))||'Something went wrong. Try again.';
       if(mode==='new'&&/does not match/.test(t))t='You already have a plan with this email. Tap Log in and use your PIN.';err.textContent=t;throw 0}
     if(mode==='login'&&j.new){err.textContent="We can't find a plan for that email. Check it, or tap New here to get started.";throw 0}
     ls('mgtrain:email',em);j.mixed?onePin(j,em,pin):route(j,em,pin)})
   .catch(function(x){if(x!==0)err.textContent='Could not reach the server. Check your connection and try again.';go.disabled=false;go.textContent=GO[mode]})});

/* one PIN for everything: this email's records don't all use the PIN just typed. Offer to make it the PIN for all of them. */
function onePin(j,em,pin){
  box.innerHTML='<div class="mt-k">One PIN for everything</div><h1 class="mt-h">'+(j.name?'Hi '+esc(j.name):'Welcome back')+'</h1><div class="mt-bar"></div>'+
    '<p class="mt-p">Some of your Macro Golf plans and games use a different PIN. Do you want to use the PIN you just typed for all of them? Then one email and one PIN opens everything.</p>'+
    '<button type="button" class="mt-go" data-one="yes">Use this PIN for everything</button>'+
    '<button type="button" class="mt-ghost" data-one="no">Not now</button>'+
    '<p class="mt-err" id="mt-err1" role="alert"></p>';
  var y=box.querySelector('[data-one=yes]');
  box.querySelector('[data-one=no]').addEventListener('click',function(){route(j,em,pin)});
  y.addEventListener('click',function(){y.disabled=true;y.textContent='Saving…';
    fetch(RPC+'mg_onepin',{method:'POST',headers:{apikey:APIKEY,'Content-Type':'application/json'},body:JSON.stringify({p_email:em,p_pin:pin})})
     .then(function(r){return r.json()}).then(function(k){if(!k||k.error)throw new Error((k&&k.error)||'');fixCreds(k.codes||[],em,pin);route(j,em,pin)})
     .catch(function(e){document.getElementById('mt-err1').textContent=(e&&e.message)||'Could not save. Try again.';y.disabled=false;y.textContent='Use this PIN for everything'})})}
/* pages on this phone remember their sign-in: give them the new PIN so nobody is asked to log in again */
function fixCreds(codes,em,pin){try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i),v;
  if(k.indexOf('mgsync:')===0){try{v=JSON.parse(localStorage.getItem(k))}catch(e){continue}if(v&&v.code&&codes.indexOf(String(v.code))>=0){v.pin=pin;localStorage.setItem(k,JSON.stringify(v))}}
  else if(k.indexOf('mgsync-group:')===0){try{v=JSON.parse(localStorage.getItem(k))}catch(e){continue}if(v&&String(v.em||'').toLowerCase()===em){v.pin=pin;localStorage.setItem(k,JSON.stringify(v))}}}}catch(e){}}

/* decide where this member goes */
function route(j,em,pin){
  var name=j.name||'',plans=(j.plans||[]).map(function(p){return p.plan}).filter(function(p){return PLANS[p]});
  if(j.oneToOne&&(j.oneToOne.includes||['training']).indexOf('training')>=0){
    var m={em:em,name:name,target:{kind:'1to1',code:j.oneToOne.code,path:j.oneToOne.path}};save(m);
    handoff1to1(m,pin);coachScreen(m);return}
  if(plans.indexOf('build-my-plan')>=0){openPlan({em:em,name:name,target:{kind:'plan',plan:'build-my-plan'}},pin);return}
  var pure=plans.filter(function(p){return p.indexOf('pure-')===0});
  if(pure.length){chooseScreen({em:em,name:name},pin,pure);return}
  openPlan({em:em,name:name,target:{kind:'plan',plan:'build-my-plan'}},pin);
}

/* 1-to-1 clients: training is set by their coach */
function handoff1to1(m,pin){ls('mgsync-handoff',JSON.stringify({code:m.target.code,pin:pin,t:Date.now()}));ls('mgplan:me',JSON.stringify({code:m.target.code,path:m.target.path,name:m.name||''}));ls('mgplan:email',m.em)}
function coachScreen(m){
  box.innerHTML='<div class="mt-k">My Training</div><h1 class="mt-h">'+(m.name?'Hi '+esc(m.name):'Your training')+'</h1><div class="mt-bar"></div>'+
    '<h2 class="mt-h2">Your training is set by your coach</h2>'+
    '<p class="mt-p">Your 1-to-1 plan has your training for this phase, so your coach can manage your load. Open it from the MG Athletes tab, or here.</p>'+
    '<a class="mt-go" href="/my-plan">Open my 1-to-1 plan</a>'+
    '<div class="mt-note">Want to change something in your training? Message your coach and they\u2019ll update your plan.</div>'+
    '<p class="mt-help">Not '+esc(m.name||'you')+'? <button type="button" class="mt-link" data-out style="display:inline;padding:0">Log out</button></p>';
  box.querySelector('[data-out]').addEventListener('click',logout)}

/* old Pure plan users: carry on, or build a new plan */
function chooseScreen(base,pin,pure){
  var p=pure[pure.length-1];
  box.innerHTML='<div class="mt-k">My Training</div><h1 class="mt-h">'+(base.name?'Hi '+esc(base.name):'Your training')+'</h1><div class="mt-bar"></div>'+
    '<p class="mt-p">You have a plan already. Carry on with it, or build a new plan around your goals, kit and week.</p>'+
    '<button type="button" class="mt-card" data-plan="'+esc(p)+'"><b>Continue '+esc(PLANS[p].name)+'</b><span>Your sessions and history are all saved.</span></button>'+
    '<button type="button" class="mt-card alt" data-plan="build-my-plan"><b>Build a new plan</b><span>Answer a few quick questions. About 2 minutes.</span></button>';
  box.addEventListener('click',function(e){var b=e.target.closest('[data-plan]');if(!b)return;openPlan({em:base.em,name:base.name,target:{kind:'plan',plan:b.dataset.plan}},pin)})}

/* open a plan page in place, using the loader pinned on its own Kajabi page */
function openPlan(m,pin){save(m);var pl=PLANS[m.target.plan];
  if(pin)ls('mgsync-handoff',JSON.stringify({plan:m.target.plan,em:m.em,pin:pin,name:m.name||null,t:Date.now()}));
  loading();
  fetch('/'+pl.path+'?x='+Date.now(),{credentials:'same-origin'}).then(function(r){if(!r.ok)throw 0;return r.text()}).then(function(html){
    var s=html.match(/<script[^>]+src="(https:\/\/cdn\.jsdelivr\.net\/gh\/joemacrogolf\/macro-golf-trackers@[0-9a-f]{7,40}\/src\/mount\.js)"[^>]*data-page="([a-z0-9-]+)"/i);
    if(!s)throw 0;
    var sc=document.createElement('script');sc.src=s[1];sc.setAttribute('data-page',s[2]);
    lightBg();root.innerHTML='';document.body.appendChild(sc);footer(m)}).catch(function(){failed(m)})}
/* plan pages are designed on a light page: make sure nothing dark from this log-in screen sits behind them */
function lightBg(){var el=root;while(el&&el!==document.documentElement){var bg=getComputedStyle(el).backgroundColor;if(bg&&!/rgba?\(0, 0, 0, 0\)|transparent/.test(bg)){var c=bg.match(/\d+/g);if(c&&(+c[0]+ +c[1]+ +c[2])<300)el.style.setProperty('background-color','#FFFFFF','important')}el=el.parentElement}}
function loading(){root.innerHTML='<div class="mt-load" role="status"><i aria-hidden="true"></i>Loading your training…</div>'}
function failed(m){root.innerHTML='<div class="mt-load" role="alert">Could not load your plan. Check your connection.<button type="button">Try again</button></div>';
  root.querySelector('button').addEventListener('click',function(){openPlan(m)})}
function footer(m){if(document.getElementById('mt-out'))return;var d=document.createElement('div');d.id='mt-out';
  d.style.cssText='text-align:center;padding:18px 16px calc(120px + env(safe-area-inset-bottom,0px));font:500 13px Inter,system-ui,sans-serif;color:#77715F';
  d.innerHTML='Not '+esc(m.name||'you')+'? <button type="button" style="background:none;border:0;padding:6px;color:#0B0B0B;font:600 13px Inter,system-ui,sans-serif;text-decoration:underline;cursor:pointer">Log out</button>';
  d.querySelector('button').addEventListener('click',logout);root.parentNode.insertBefore(d,root.nextSibling)}
function logout(){try{if(typeof window.KEY==='string')ls('mgsync:'+window.KEY,null)}catch(e){}ls(ME,null);ls('mgsync-handoff',null);location.reload()}

/* coming back: go straight to where they went last time */
var m=me();
if(m){if(m.target.kind==='1to1')coachScreen(m);else if(PLANS[m.target.plan])openPlan(m);}
else setTimeout(function(){(f.email.value?f.pin:f.email).focus()},60);
})();
</script>

<style>
#pb{
  /* Macro Golf brand world: black, off-white, yellow. Single dark theme by choice. */
  --ink:#0c0c0b; --panel:#161614; --panel2:#1d1d1a; --line:#2c2b27; --paper:#f3f1ea; --muted:#9b988d; --gold:#FFD900; --gold-dim:#5c5000;
  --ok:#5fd38d; --warn:#ffb347; --bad:#ff6b5e;
  --display:"Anton", Impact, "Arial Narrow", sans-serif;
  --body:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"Space Mono", ui-monospace, Menlo, monospace;
  /* Layout: fixed header, left rail of plan sections, one section in the editor at a time */
  color-scheme:dark;
}
#pb *{box-sizing:border-box}
#pb button,#pb input,#pb select,#pb textarea{font:inherit;color:inherit}
#pb :focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){#pb *{transition:none!important;animation:none!important}
}
#pb .app{display:grid;grid-template-rows:auto 1fr;height:100%}
#pb header{display:flex;align-items:center;gap:16px;padding:12px 20px;border-bottom:1px solid var(--line);background:#000;flex-wrap:wrap}
#pb .brand{display:flex;align-items:baseline;gap:10px}
#pb .brand b{font:28px/1 var(--display);letter-spacing:.02em}
#pb .brand b i{font-style:normal;color:var(--gold)}
#pb .brand span{font:11px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
#pb .who{display:flex;align-items:center;gap:10px;margin-left:8px;min-width:0}
#pb .who strong{font:18px/1 var(--display);letter-spacing:.03em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px}
#pb .chip{font:11px var(--mono);letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border:1px solid var(--line);border-radius:999px;color:var(--muted);white-space:nowrap}
#pb .chip.gold{background:var(--gold);border-color:var(--gold);color:#000;font-weight:700}
#pb .chip.ok{border-color:var(--ok);color:var(--ok)}
#pb .spacer{flex:1}
#pb .status{font:12px var(--mono);color:var(--muted)}
#pb .status.err{color:var(--bad)}
#pb .btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap}
#pb .btn:hover{border-color:var(--muted)}
#pb .btn.gold{background:var(--gold);color:#000;border-color:var(--gold)}
#pb .btn.gold:hover{filter:brightness(1.05)}
#pb .btn.ghost{background:transparent}
#pb .btn.sm{padding:5px 10px;font-size:12px}
#pb .btn.danger{color:var(--bad)}
#pb .btn:disabled{opacity:.45;cursor:not-allowed}
#pb .iconbtn{background:none;border:1px solid transparent;color:var(--muted);cursor:pointer;padding:4px 7px;border-radius:5px;font-size:13px;line-height:1}
#pb .iconbtn:hover{color:var(--paper);border-color:var(--line)}
#pb .body{display:grid;grid-template-columns:240px 1fr;min-height:0}
#pb nav.rail{border-right:1px solid var(--line);overflow:auto;padding:16px 10px;background:var(--panel)}
#pb .rail h6{font:10px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin:4px 10px 10px}
#pb .rail button{display:flex;width:100%;text-align:left;gap:10px;align-items:flex-start;padding:9px 10px;border:0;background:none;border-radius:6px;cursor:pointer;color:var(--paper)}
#pb .rail button:hover{background:var(--panel2)}
#pb .rail button.on{background:var(--panel2);box-shadow:inset 3px 0 0 var(--gold)}
#pb .rail .n{font:11px var(--mono);color:var(--gold);min-width:20px;padding-top:2px}
#pb .rail .l{display:flex;flex-direction:column;min-width:0}
#pb .rail .l small{color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pb main{overflow:auto;padding:28px clamp(16px,4vw,48px) 80px}
#pb .wrap{max-width:980px;margin:0 auto}
#pb .eyebrow{font:11px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
#pb h1,#pb h2{font-family:var(--display);font-weight:400;letter-spacing:.02em;text-transform:uppercase;margin:4px 0 6px;text-wrap:balance}
#pb h1{font-size:40px;line-height:1}
#pb h3{font:600 15px var(--body);margin:0}
#pb .lede{color:var(--muted);max-width:68ch;margin:0 0 22px}
#pb .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;margin:0 0 16px}
#pb .card.hl{border-color:var(--gold-dim)}
#pb .card-h{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
#pb .card-h .num{font:22px/1 var(--display);color:var(--gold)}
#pb .grid{display:grid;gap:12px}
#pb .g2{grid-template-columns:repeat(2,minmax(0,1fr))}
#pb .g3{grid-template-columns:repeat(3,minmax(0,1fr))}
#pb .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
#pb .span2{grid-column:span 2}
#pb .full{grid-column:1/-1}
#pb .f{display:flex;flex-direction:column;gap:5px;min-width:0}
#pb .f>span{font:10.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
#pb .f>span em{font-style:normal;color:var(--gold)}
#pb input[type=text],#pb input[type=email],#pb input[type=number],#pb input[type=date],#pb input:not([type]),#pb select,#pb textarea{width:100%;background:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0}
#pb textarea{resize:vertical;min-height:64px;line-height:1.45}
#pb input:focus,#pb select:focus,#pb textarea:focus{border-color:var(--gold);outline:none}
#pb ::placeholder{color:#5f5d55}
#pb .hint{font-size:12px;color:var(--muted);margin:4px 0 0}
#pb .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#pb .toggles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
#pb .tog{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:var(--ink)}
#pb .tog:has(input:checked){border-color:var(--gold-dim);background:#1a1806}
#pb .tog input{accent-color:var(--gold);margin-top:3px}
#pb .tog b{display:block;font-size:13px}
#pb .tog small{color:var(--muted);font-size:11.5px}
#pb .seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
#pb .seg button{background:var(--ink);border:0;padding:8px 14px;cursor:pointer;color:var(--muted);font-weight:600;font-size:13px}
#pb .seg button.on{background:var(--gold);color:#000}
#pb .computed{font:12px var(--mono);color:var(--paper);background:var(--ink);border:1px dashed var(--line);border-radius:6px;padding:9px 12px;letter-spacing:.04em}
#pb .ie{display:flex;align-items:center;gap:6px}
#pb .ie>span{font:9.5px var(--mono);letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
#pb .ie .dots{display:flex;gap:4px}
#pb .ie button{width:26px;height:22px;border-radius:4px;border:1px solid var(--line);background:var(--ink);cursor:pointer;font:10px var(--mono);color:var(--muted)}
#pb .ie button.on{background:var(--gold);border-color:var(--gold);color:#000;font-weight:700}
#pb .drill{border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--ink);display:grid;gap:10px;position:relative}
#pb .drill[data-env=Technical]{box-shadow:inset 3px 0 0 #8fa7ff}
#pb .drill[data-env=Random]{box-shadow:inset 3px 0 0 #5fd38d}
#pb .drill[data-env=Competitive]{box-shadow:inset 3px 0 0 #ff8a5e}
#pb .drill .top{display:grid;grid-template-columns:130px 1fr 170px 70px 86px auto;gap:8px;align-items:end}
#pb .drill .mid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#pb .drill .bot{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
#pb .envlegend{display:flex;gap:14px;flex-wrap:wrap;font:11px var(--mono);color:var(--muted)}
#pb .envlegend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
#pb .stack{display:grid;gap:10px}
#pb .pair{display:grid;grid-template-columns:34px 1fr 120px 110px 92px auto;gap:8px;align-items:center}
#pb .pair .lab{font:13px var(--mono);color:var(--gold);font-weight:700}
#pb .pairhead{font:10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
#pb .check{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);white-space:nowrap}
#pb .check input{accent-color:var(--gold)}
#pb .listrow{display:grid;gap:8px;align-items:start}
#pb .lr-habit{grid-template-columns:200px 1fr 140px auto}
#pb .lr-mob{grid-template-columns:1.3fr 150px 150px 1.4fr auto}
#pb .lr-stat{grid-template-columns:1.4fr 1fr 1fr 1.3fr auto}
#pb .lr-tpi{grid-template-columns:1.3fr 130px 1.6fr auto}
#pb .lr-q{grid-template-columns:1fr 160px auto}
#pb .chips{display:flex;flex-wrap:wrap;gap:6px}
#pb .chips button{border:1px solid var(--line);background:var(--ink);border-radius:999px;padding:5px 11px;font-size:12px;cursor:pointer;color:var(--muted)}
#pb .chips button.on{background:var(--gold);color:#000;border-color:var(--gold);font-weight:600}
#pb .drop{border:1.5px dashed var(--line);border-radius:10px;padding:22px;text-align:center;background:var(--ink);cursor:pointer}
#pb .drop.over{border-color:var(--gold);background:#1a1806}
#pb .drop b{font:20px var(--display);letter-spacing:.03em;text-transform:uppercase;display:block}
#pb .drop p{margin:6px 0 0;color:var(--muted);font-size:12.5px}
#pb .ai{border:1px solid var(--gold-dim);background:#15140a;border-radius:10px;padding:16px;margin-top:14px}
#pb .ai h4{margin:0 0 8px;font:11px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
#pb .ai ul{margin:6px 0 0;padding-left:18px}
#pb .ai li{margin:2px 0}
#pb .spin{display:inline-block;width:12px;height:12px;border:2px solid var(--gold);border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}

@keyframes sp{to{transform:rotate(360deg)}}#pb .banner{padding:10px 14px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);font-size:13px;margin-bottom:14px}
#pb .banner.warn{border-color:#6b4d1a;background:#1f180b;color:#ffd59a}
#pb .pager{display:flex;justify-content:space-between;margin-top:24px;gap:10px}
#pb .checklist{list-style:none;padding:0;margin:0;display:grid;gap:6px}
#pb .checklist li{display:flex;gap:10px;align-items:center;font-size:13px}
#pb .checklist .d{width:9px;height:9px;border-radius:50%;flex:none}
#pb .scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:none}
#pb .scrim.open{display:block}
#pb .drawer{position:fixed;top:0;left:0;bottom:0;width:min(440px,100%);background:var(--panel);border-right:1px solid var(--line);z-index:21;transform:translateX(-102%);transition:transform .2s;display:flex;flex-direction:column}
#pb .drawer.open{transform:none}
#pb .drawer header{background:var(--panel);border-bottom:1px solid var(--line)}
#pb .drawer .list{overflow:auto;padding:12px;display:grid;gap:10px;align-content:start}
#pb .pl{border:1px solid var(--line);border-radius:9px;padding:12px;background:var(--ink)}
#pb .pl h3{font:18px/1.1 var(--display);letter-spacing:.03em;text-transform:uppercase;font-weight:400}
#pb .pl .em{font-size:12px;color:var(--muted);margin:2px 0 10px;word-break:break-all}
#pb .phases{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
#pb .phases button{border:1px solid var(--line);background:var(--panel2);border-radius:6px;padding:6px 10px;cursor:pointer;text-align:left;font-size:12px}
#pb .phases button:hover{border-color:var(--gold)}
#pb .phases button b{font-family:var(--mono);color:var(--gold);margin-right:4px}
#pb .phases button.cur{border-color:var(--gold)}
#pb .empty{color:var(--muted);text-align:center;padding:30px 10px;font-size:13px}
@media (max-width:860px){#pb .body{grid-template-columns:1fr;grid-template-rows:auto 1fr}
#pb nav.rail{display:flex;overflow-x:auto;padding:8px;border-right:0;border-bottom:1px solid var(--line)}
#pb .rail h6{display:none}
#pb .rail button{width:auto;flex:none}
#pb .rail .l small{display:none}
#pb .g3,#pb .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
#pb .drill .top{grid-template-columns:1fr 1fr}
#pb .drill .mid{grid-template-columns:1fr}
#pb .pair{grid-template-columns:30px 1fr 1fr}
#pb .lr-habit,#pb .lr-mob,#pb .lr-stat,#pb .lr-tpi,#pb .lr-q{grid-template-columns:1fr}

}
@media (max-width:480px){#pb .g2,#pb .g3,#pb .g4{grid-template-columns:1fr}
#pb .span2{grid-column:auto}
}
#pb .mgdoc{--d-ink:#0c0c0b;--d-paper:#faf9f5;--d-line:#dedbd0;--d-muted:#6d6a60;--d-gold:#FFD900;background:var(--d-paper);color:var(--d-ink);font:13.5px/1.55 "Inter",system-ui,sans-serif;border-radius:8px;overflow:hidden}
#pb .mgdoc *{box-sizing:border-box}
#pb .mgdoc h1,#pb .mgdoc h2,#pb .mgdoc h3{color:var(--d-ink)!important;font-family:"Anton",Impact,sans-serif!important;font-weight:400!important}
#pb .mgdoc h4{color:var(--d-muted)!important;font-family:"Space Mono",monospace!important}
#pb .mgdoc .cover h1,#pb .mgdoc .box.dark h3,#pb .mgdoc .box.dark h2,#pb .mgdoc .end h2,#pb .mgdoc .end h3{color:#f3f1ea!important}
#pb .mgdoc .box.dark h4{color:#9b988d!important}
#pb .mgdoc p,#pb .mgdoc td,#pb .mgdoc li,#pb .mgdoc th{background:transparent;text-shadow:none}
#pb .mgdoc .pg{padding:44px 48px;border-bottom:1px solid var(--d-line);break-after:page}
#pb .mgdoc .runner{display:flex;justify-content:space-between;font:9.5px "Space Mono",monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--d-muted);margin-bottom:26px}
#pb .mgdoc .cover{background:#0c0c0b;color:#f3f1ea;padding:56px 48px 48px}
#pb .mgdoc .cover .wm{font:22px "Anton",Impact,sans-serif;letter-spacing:.04em;text-align:right}
#pb .mgdoc .cover .wm i{font-style:normal;color:var(--d-gold)}
#pb .mgdoc .cover h1{font:84px/0.92 "Anton",Impact,sans-serif;text-transform:uppercase;margin:90px 0 18px;letter-spacing:.01em;color:#f3f1ea}
#pb .mgdoc .cover .name{font:30px "Anton",Impact,sans-serif;color:var(--d-gold);letter-spacing:.04em;text-transform:uppercase}
#pb .mgdoc .cover .meta{display:grid;grid-template-columns:repeat(3,auto);justify-content:start;gap:8px 56px;margin-top:70px}
#pb .mgdoc .cover .meta span{font:10px "Space Mono",monospace;letter-spacing:.2em;color:#9b988d;text-transform:uppercase}
#pb .mgdoc .cover .meta b{font:22px "Anton",Impact,sans-serif;letter-spacing:.03em;font-weight:400;text-transform:uppercase}
#pb .mgdoc .sec{font:10px "Space Mono",monospace;letter-spacing:.2em;color:var(--d-muted);text-transform:uppercase}
#pb .mgdoc h2{font:40px/1 "Anton",Impact,sans-serif;text-transform:uppercase;margin:6px 0 20px;letter-spacing:.01em;color:var(--d-ink)}
#pb .mgdoc h3{font:20px/1.1 "Anton",Impact,sans-serif;text-transform:uppercase;letter-spacing:.02em;margin:0 0 6px;font-weight:400}
#pb .mgdoc h4{font:10px "Space Mono",monospace;letter-spacing:.2em;text-transform:uppercase;color:var(--d-muted);margin:18px 0 6px;font-weight:700}
#pb .mgdoc p{margin:0 0 8px;max-width:72ch}
#pb .mgdoc .box{border:1px solid var(--d-line);border-radius:6px;padding:18px 20px;margin-bottom:14px;background:#fff}
#pb .mgdoc .box.dark{background:#0c0c0b;color:#f3f1ea;border-color:#0c0c0b}
#pb .mgdoc .box.gold{border-left:5px solid var(--d-gold)}
#pb .mgdoc .big{font:22px/1.15 "Anton",Impact,sans-serif;text-transform:uppercase;letter-spacing:.02em;margin:4px 0 10px}
#pb .mgdoc .cols{display:grid;gap:14px}
#pb .mgdoc .c2{grid-template-columns:1fr 1fr}
#pb .mgdoc .c3{grid-template-columns:repeat(3,1fr)}
#pb .mgdoc .c4{grid-template-columns:repeat(4,1fr)}
#pb .mgdoc .stat b{display:block;font:40px/1 "Anton",Impact,sans-serif}
#pb .mgdoc .stat span{font:10px "Space Mono",monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--d-muted)}
#pb .mgdoc .prio{display:grid;grid-template-columns:56px 1fr;gap:6px 14px;padding:16px 0;border-top:1px solid var(--d-line)}
#pb .mgdoc .prio .pn{font:32px/1 "Anton",Impact,sans-serif;color:var(--d-ink)}
#pb .mgdoc .prio .pc{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;grid-column:2}
#pb .mgdoc .habit{display:grid;grid-template-columns:40px 1fr;gap:12px;padding:10px 0;border-top:1px solid var(--d-line)}
#pb .mgdoc .habit .hn{font:26px/1 "Anton",Impact,sans-serif}
#pb .mgdoc table{width:100%;border-collapse:collapse;font-size:12.5px;margin:6px 0 10px}
#pb .mgdoc th{font:9.5px "Space Mono",monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--d-muted);text-align:left;padding:7px 8px;border-bottom:2px solid var(--d-ink)}
#pb .mgdoc td{padding:9px 8px;border-bottom:1px solid var(--d-line);vertical-align:top}
#pb .mgdoc td.k{font:12px "Space Mono",monospace;font-weight:700}
#pb .mgdoc .env{font:10px "Space Mono",monospace;letter-spacing:.2em;text-transform:uppercase;font-weight:700;margin:16px 0 4px;padding-bottom:4px;border-bottom:1px solid var(--d-ink)}
#pb .mgdoc .scale{display:inline-flex;align-items:center;gap:4px;font:8.5px "Space Mono",monospace;letter-spacing:.1em;color:var(--d-muted)}

#pb .mgdoc .rpe{display:inline-block;font:10px "Space Mono",monospace;font-weight:700;background:var(--d-gold);padding:2px 6px;border-radius:3px}
#pb .mgdoc .blank{display:inline-block;min-width:60px;border-bottom:1px solid #bdb9ad;height:14px}
#pb .mgdoc .grid6 td,#pb .mgdoc .grid6 th{text-align:center}

#pb .mgdoc .note{font-size:12px;color:var(--d-muted)}
#pb .mgdoc ul{margin:4px 0 8px;padding-left:18px}
#pb .mgdoc .end{background:#0c0c0b;color:#f3f1ea;padding:80px 48px;text-align:left}

#pb .mgdoc .end b i{font-style:normal;color:var(--d-gold)}
#pb .mgdoc .foot{font:9px "Space Mono",monospace;letter-spacing:.16em;color:var(--d-muted);margin-top:26px;text-transform:uppercase}
@media (max-width:700px){#pb .mgdoc .pg,#pb .mgdoc .cover{padding:28px 20px}
#pb .mgdoc .c2,#pb .mgdoc .c3,#pb .mgdoc .c4,#pb .mgdoc .prio .pc{grid-template-columns:1fr}
#pb .mgdoc .cover h1{font-size:52px}

#pb{background:var(--ink);color:var(--paper);font:14px/1.5 var(--body);min-height:100vh;text-align:left}
#pb [hidden]{display:none!important}
#pb .app{height:auto;min-height:100vh}
#pb>.app>header{position:sticky;top:0;z-index:30}
#pb nav.rail{position:sticky;top:61px;align-self:start;max-height:calc(100vh - 61px)}
#pb main{overflow:visible}
#pb .scrim{z-index:1000}#pb .drawer{z-index:1001}
#pb h1,#pb h2{font-family:var(--display)!important;font-weight:400!important;color:var(--paper)!important}
#pb h3{color:var(--paper)!important}
#pb p{color:inherit}
#pb .gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
#pb .gatebox{width:100%;max-width:420px;display:grid;gap:16px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:28px}
#pb .gatebox h1{font-size:34px;line-height:1;margin:6px 0 0}
#pb input[type=password]{width:100%;background:var(--ink);border:1px solid var(--line);border-radius:6px;padding:10px 12px;color:var(--paper)}
#pb .ansbox{border:1px solid var(--line);border-radius:8px;background:var(--ink);margin-top:10px}
#pb .ansbox summary{cursor:pointer;padding:10px 12px;font-weight:600;font-size:13px}
#pb .anslist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 18px;padding:4px 12px 14px}
#pb .ans span{font:10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
#pb .ans p{margin:2px 0 0;font-size:13px;color:var(--paper)}
@media (max-width:700px){#pb .anslist{grid-template-columns:1fr}#pb nav.rail{position:static;max-height:none}}
#pb .ie2{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#pb .ie2>span{font:9.5px var(--mono);letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
#pb .ie2 input[type=range]{flex:1;min-width:160px;accent-color:#FFD900;background:transparent;border:0;padding:0}
#pb .ie2 output{font:11px var(--mono);color:var(--gold);min-width:118px}
#pb .drill .top.g-top{grid-template-columns:120px 1fr 80px 100px auto}
@media (max-width:860px){#pb .drill .top.g-top{grid-template-columns:1fr 1fr}}
#pb .mobv{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--ink)}
#pb .mobv b{font-size:13.5px}
#pb .welcome{width:100%;min-height:300px;font:13px/1.5 var(--body);background:var(--ink);color:var(--paper);border:1px solid var(--line);border-radius:6px;padding:12px}
#pb-sug{position:fixed;z-index:9999;background:#1a1916;border:1px solid rgba(244,241,234,.18);border-radius:8px;max-height:280px;overflow:auto;box-shadow:0 10px 30px rgba(0,0,0,.45);font:14px/1.3 "Inter",system-ui,-apple-system,"Segoe UI",sans-serif;color:#F4F1EA}
#pb-sug div{padding:8px 11px;cursor:pointer}#pb-sug div.on,#pb-sug div:hover{background:rgba(255,218,0,.16)}#pb-sug b{color:#FFDA00;font-weight:600}
#pb .sugg{border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:var(--ink);display:grid;gap:4px}
#pb .mgdoc .sbar{display:inline-block;position:relative;width:74px;height:8px;border-radius:4px;background:linear-gradient(90deg,#d8d4c8,#0c0c0b);vertical-align:middle;margin:0 5px}
#pb .mgdoc .sbar i{position:absolute;top:-3px;width:5px;height:14px;background:#FFD900;border:1px solid #0c0c0b;transform:translateX(-50%)}
</style>
<div id="pb">
<div class="gate" id="pb-gate"><form class="gatebox" id="pb-login">
  <div class="brand"><b>MACRO <i>GOLF</i></b><span>Plan builder</span></div>
  <h1>Build a six-week plan</h1>
  <p class="lede" style="margin:0">For Macro Golf coaches. Use the coach dashboard password.</p>
  <label class="f" for="pb-pw"><span>Coach password</span><input type="password" id="pb-pw" autocomplete="current-password" required></label>
  <button class="btn gold" id="pb-loginbtn" type="submit" style="justify-content:center;min-height:46px;font-size:15px">Open</button>
  <p class="status err" id="pb-loginerr" role="alert"></p>
</form></div>

<div class="app" id="pb-app" hidden>
  <header>
    <div class="brand"><b>MACRO <i>GOLF</i></b><span>Plan builder</span></div>
    <div class="who" id="pb-who"></div>
    <div class="spacer"></div>
    <span class="status" id="pb-status" aria-live="polite"></span>
    <button class="btn" id="pb-openPlans" type="button">All plans</button>

</div>

<div class="scrim" id="pb-scrim"></div>
<aside class="drawer" id="pb-drawer" aria-label="All plans">
  <header>
    <div class="brand"><b style="font-size:22px">PLAYERS</b><span id="pb-plCount"></span></div>
    <div class="spacer"></div>
    <button class="iconbtn" id="pb-closePlans" type="button" aria-label="Close">✕</button>

</aside>

<datalist id="dl-coach"><option>Joe</option><option>Jack</option><option>Sam</option><option>James</option></datalist>

</div>
<script charset="utf-8" src="{{BASE}}src/mg-library.js"></script>
<script>
"use strict";
(function(){
/* ---------- reference data ---------- */
const DRILLS=["Drill supplied by Jack through CoachNow","Approach Boss","Reducing Height","Random Number Generator","Par 5 Game","Par 18 Game","Worst Lies","High, Medium and Low Flight Chips","Ladder Drill","Up and Down Challenge","9 Ball Flight Game","Pressure Putts (3-6-9 ft)","Front Tee Scramble","Mulligan"];
const EXERCISES=["Pull up","High hands slam","Cable lat pull down","Med ball slam","Dumbbell incline bench press","Cable power row","Cable woodchop","Low to high cable cross chop","Dumbbell goblet squat","Counter movement jump","Dumbbell RDL","Power jumps","Dumbbell split squat","Single leg deficit hop","Laying leg curl","Explosive step downs","Dumbbell flat bench press","Supine chest throws","Dumbbell single arm row","Power press up","Kneeling landmine single shoulder press","Jump back overhead slams","Dumbbell bicep curl","Tricep push down","Dumbbell side lunge","Skater jumps","Cable full rotation","Med ball discus throw","Dumbbell reverse lunge","Heiden to vertical jump","Cable straight arm pull downs","Overhead throw","Trap bar deadlift","Hip thrust","Pallof press","Copenhagen plank","Dead bug","Farmer carry","Med ball scoop toss","Overspeed swings"];
const MOBILITY=["90/90 hip switches","Open books","Quadruped thoracic rotation","Cat cow","World's greatest stretch","Half kneeling hip flexor stretch","Pigeon stretch","Bench lat stretch","Deep squat hold","Wrist flexor and extensor stretch","Ankle rocks","Pelvic tilts","Pelvic rotations with club","Seated trunk rotations","Cossack squat","Banded shoulder dislocates","Couch stretch","Golf Warm Up (Macro Golf App)"];
const AREAS=["Hips","Thoracic spine","Shoulders","Lats","Ankles","Wrists / forearms","Neck","Pelvic control","Hamstrings","Full body"];
const HABITS=["Meditation","Gratitude","Breath work","Visualisation","Performance Log entry","Journalling","Daily steps","Hydration","Screen-free wind down"];
const STATS=["Scoring average","Off the tee strokes gained","Approach strokes gained","Short game strokes gained","Putting strokes gained","Score killers per round"];
const TPI=["Pelvic tilt","Pelvic rotation","Torso rotation","Overhead deep squat","Toe touch","90/90","Single leg balance","Lat test","Lower quarter rotation","Seated trunk rotation","Bridge with leg extension","Cervical rotation","Forearm rotation","Wrist hinge","Wrist flexion / extension"];
const SWING=["S-posture","C-posture","Loss of posture","Flat shoulder plane","Early extension","Over the top","Sway","Slide","Late buckling","Reverse spine angle","Forward lunge","Hanging back","Casting / early release","Scooping","Chicken winging"];
const ENVS=["Technical","Game"];
const RPE_LABEL={1:"No consequence",2:"Relaxed",3:"Light focus",4:"Some challenge",5:"Stretching",6:"Demanding",7:"Consequence",8:"Pressure",9:"Tournament feel",10:"One ball, everything on it"};
const PHYS_TEMPLATE=[
 ["Arm chop + upper body",[["Pull up","High hands slam"],["Cable lat pull down","Med ball slam"],["Dumbbell incline bench press","Cable power row"],["Cable woodchop","Low to high cable cross chop*"]]],
 ["Vertical + lower body",[["Dumbbell goblet squat","Counter movement jump"],["Dumbbell RDL","Power jumps"],["Dumbbell split squat","Single leg deficit hop*"],["Laying leg curl","Explosive step downs*"]]],
 ["Wrist release + upper body",[["Dumbbell flat bench press","Supine chest throws"],["Dumbbell single arm row","Power press up"],["Kneeling landmine single shoulder press","Jump back overhead slams*"],["Dumbbell bicep curl","!Tricep push down"]]],
 ["Rotation + lateral + second power exposure",[["Dumbbell side lunge","Skater jumps*"],["Cable full rotation","Med ball discus throw*"],["Dumbbell reverse lunge","Heiden to vertical jump*"],["Cable straight arm pull downs","Overhead throw"]]]
];
function fillDatalists(){
  const put=(id,arr)=>{document.getElementById(id).innerHTML=arr.map(v=>`<option value="${esc(v)}"></option>`).join("")};
  put("dl-drills",DRILLS);put("dl-ex",EXERCISES);put("dl-mob",[...new Set(mobAllVideos().map(mobLabel))]);put("dl-habit",HABITS);put("dl-stat",STATS);put("dl-tpi",TPI);
}

/* ---------- utils ---------- */
const $=(s,el=document)=>el.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nl2br=s=>esc(s).replace(/\n/g,"<br>");
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-5);
const clone=o=>JSON.parse(JSON.stringify(o));
function getPath(obj,path){return path.split(".").reduce((o,k)=>o==null?undefined:o[k],obj)}
function setPath(obj,path,val){const ks=path.split(".");let o=obj;for(let i=0;i<ks.length-1;i++){if(o[ks[i]]==null)o[ks[i]]={};o=o[ks[i]]}o[ks[ks.length-1]]=val}
function deepFill(target,defaults){for(const k in defaults){if(target[k]===undefined)target[k]=clone(defaults[k]);else if(defaults[k]&&typeof defaults[k]==="object"&&!Array.isArray(defaults[k])&&typeof target[k]==="object"&&!Array.isArray(target[k]))deepFill(target[k],defaults[k])}return target}
function addDays(iso,n){const d=iso?new Date(iso+"T12:00:00"):new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function nextMonday(){const d=new Date();const add=(8-d.getDay())%7||7;d.setDate(d.getDate()+add);return d.toISOString().slice(0,10)}
const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
function fmtDate(iso){if(!iso)return"";const d=new Date(iso+"T12:00:00");return d.getDate()+" "+MONTHS[d.getMonth()].slice(0,3)+" "+d.getFullYear()}
function blockLabel(p){if(!p.startDate)return"";const s=new Date(p.startDate+"T12:00:00"),e=new Date(addDays(p.startDate,(p.weeks||6)*7-1)+"T12:00:00");const a=MONTHS[s.getMonth()],b=MONTHS[e.getMonth()];return (a===b?a:a+" – "+b)+" "+e.getFullYear()}
const reviewWeek=p=>(p.phase||1)*(p.weeks||6);

/* ---------- plan model ---------- */
function blankDrill(env="Technical",name="",o={}){return Object.assign({id:uid(),env,name,game:"",newGame:false,detail:"",volume:env==="Technical"?15:"",unit:env==="Technical"?"balls":"rounds",attention:env==="Technical"?25:80},o)}
let GAME_BY_PATH={};const DRILL_BY_ID=Object.fromEntries((MGLib.DRILLS||[]).map(d=>[d.id,d]));
function indexGames(){GAME_BY_PATH=Object.fromEntries(MGLib.GAMES.map(g=>[g[1],g]))}indexGames();
async function loadGames(force){await MGLib.loadGames(force);indexGames()}
const GAME_AREAS=["Driving","Approach","Short game","Putting","Test","On course","Other"];
const gameDrill=(path,o={})=>blankDrill("Game",GAME_BY_PATH[path][0],Object.assign({game:path,volume:1},o));
const STD_STATS=()=>STATS.map(n=>({id:uid(),name:n,baseline:"",target:"",how:/strokes gained/.test(n)?"Strokes gained in My Numbers (Macro Golf app tests and games)":n==="Score killers per round"?"Doubles or worse, 3-putts, penalties and duffed chips per round":"Last 5 full rounds"}));
const STD_Q=()=>[
  {id:uid(),q:"Did you vary from your plan this week?",type:"Yes / No"},
  {id:uid(),q:"If yes, how did you vary from the plan, and why?",type:"Text"},
  {id:uid(),q:"Is anything happening next week that will affect your availability to do the plan?",type:"Text"},
  {id:uid(),q:"What do you need your coaching team to focus on next week?",type:"Text"},
  {id:uid(),q:"Do you need support with anything this week?",type:"Text"},
  {id:uid(),q:"How well do you feel you transferred your golf to the course this week?",type:"1–10"}];
const WHEN=["Evenings before sleep","Morning","Before practice","Before training","Before a round","Any time in the day"];
function newPlan(){
  return {
    id:uid(),attV2:true,playerName:"",playerEmail:"",coach:"",phase:1,isFirst:true,startDate:nextMonday(),weeks:6,status:"draft",createdAt:Date.now(),
    include:{habits:true,practice:true,oncourse:true,physical:true,mobility:true,weight:true,stats:true,recovery:false,checkin:true},
    intake:{source:"Match Up Session",fileName:"",summary:"",handicap:"",homeClub:"",goals:"",history:"",injuries:"",equipment:"",tpi:[],swing:[],notes:""},
    review:{progress:"",learned:"",nextStep:"",nextStepDetail:"",adherence:{practice:"",physical:"",habits:""},priorityReview:[],notes:""},
    focus:{outcome:"",outcomeDetail:"",whyNow:"",evidence:"",progressByReview:""},
    priorities:[{id:uid(),title:"",start:"",why:"",change:""}],
    habits:[{id:uid(),name:"Meditation",detail:"",dose:"10 min minimum"},{id:uid(),name:"Gratitude",detail:"",dose:"Daily"},{id:uid(),name:"Breath work",detail:"",dose:"Through the day"}],
    weekly:{practice:2,physical:4,oncourse:1,connected:""},
    practice:{intro:"",sessions:[]},
    oncourse:{games:[],technical:"",intention:"",strategy:"",preround:"",postround:"Complete statistics for full rounds. Send the reflection and relevant statistics to the coaching team. Rather than diagnosing poor shots, look for patterns: what performed well, what became more difficult, what changed when performance changed, which parts of practice transferred.",balance:4},
    physical:{days:4,structure:"Supersets · A1 / A2 pairs",rest:"45–60s between rounds",strength:"3 sets: 12 / 10 / 8 reps @ RPE 7 / 8 / 9",power:"3 x 5 @ RPE 10 (maximal intent, not failure)",progression:"Keep exercises, sets and reps consistent through the block. Progress through load using the prescribed RPE. Do not add fatigue for the sake of progression.",note:"This plan should assist your golf performance. If at any time your training is limiting your ability to practise or play, notify your coach immediately.",dayList:[]},
    mobility:{frequency:"Daily",when:"Evenings before sleep",mode:"random",areas:[],equip:[],count:3,minutes:10,items:[]},
    weight:{unit:"kg",start:"",target:"",direction:"Maintain",frequency:"Weekly",day:"Monday",conditions:"First thing in the morning, before food",waist:false,notes:""},
    stats:STD_STATS(),
    recovery:{sleep:"8",routine:"",notes:""},
    checkin:{day:"Sunday",questions:STD_Q()}
  };
}
function normalise(p){
  if(p.mobility){const m=p.mobility;if(m.mode==="follow"||!m.mode){const v=(m.items||[]).filter(x=>x.kind==="video").length;m.mode=v||!(m.items||[]).length?"random":"manual";if(v&&!m.count)m.count=v}
    if(!m.minutes)m.minutes=10;m.equip=(m.equip||[]).filter(e=>e!=="No equipment")}
  if(!p.attV2){const fix=o=>{if(o&&typeof o.attention==="number"&&o.attention>=1&&o.attention<=5)o.attention=(o.attention-1)*25};
    ((p.practice||{}).sessions||[]).forEach(s=>(s.drills||[]).forEach(d=>{fix(d);if(d.env&&d.env!=="Technical")d.env="Game"}));
    ((p.oncourse||{}).games||[]).forEach(fix);if(p.oncourse&&p.oncourse.balance>=1&&p.oncourse.balance<=5)p.oncourse.balance=(p.oncourse.balance-1)*25;p.attV2=true}
  return deepFill(p,newPlan())}

/* ---------- state ---------- */
let plan=null, section="player", pass="", INTAKE=[], loggedIn=false;
const plans=new Map();
let saving=false, pendingSave=false, saveTimer=null, dirty=false;
const ui={confirmDel:false,fillMsg:"",tpiMsg:"",tpiText:"",mobMsg:"",confirmTpl:false,pubMsg:"",pubConfirm:null};

/* ---------- field helpers ---------- */
const V=path=>{const v=getPath(plan,path);return v==null?"":v};
const T=(path,label,ph="",cls="",list="")=>`<label class="f ${cls}"><span>${label}</span><input type="text" data-b="${path}" value="${esc(V(path))}" placeholder="${esc(ph)}"${list?` list="${list}"`:""}></label>`;
const N=(path,label,cls="",step="1")=>`<label class="f ${cls}"><span>${label}</span><input type="number" step="${step}" data-b="${path}" data-t="num" value="${esc(V(path))}"></label>`;
const A=(path,label,ph="",rows=3,cls="")=>`<label class="f ${cls}"><span>${label}</span><textarea rows="${rows}" data-b="${path}" placeholder="${esc(ph)}">${esc(V(path))}</textarea></label>`;
const S=(path,label,opts,cls="")=>`<label class="f ${cls}"><span>${label}</span><select data-b="${path}">${opts.map(o=>{const [v,l]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}"${String(V(path))===String(v)?" selected":""}>${esc(l)}</option>`}).join("")}</select></label>`;
const att=v=>{v=+v;return isNaN(v)?50:Math.max(0,Math.min(100,v))};
const attLabel=v=>v<=15?"Fully internal":v<40?"Mostly internal":v<=60?"Balanced":v<85?"Mostly external":"Fully external";
const IE=(path)=>{const v=att(V(path));return `<div class="ie2"><span>Internal</span><input type="range" min="0" max="100" step="5" data-b="${path}" data-t="num" data-att value="${v}" aria-label="Attention target, internal to external"><span>External</span><output>${attLabel(v)}</output></div>`};
const RPE=(path)=>`<label class="f" style="min-width:210px"><span>Pressure · Golf RPE</span><select data-b="${path}" data-t="num">${Array.from({length:10},(_,i)=>i+1).map(n=>`<option value="${n}"${+V(path)===n?" selected":""}>${n} · ${RPE_LABEL[n]}</option>`).join("")}</select></label>`;
const del=(path,label="Remove")=>`<button type="button" class="iconbtn" data-act="del" data-path="${path}" aria-label="${label}" title="${label}">✕</button>`;
const mv=(path,dir)=>`<button type="button" class="iconbtn" data-act="mv" data-path="${path}" data-dir="${dir}" aria-label="Move ${dir<0?"up":"down"}">${dir<0?"↑":"↓"}</button>`;

/* ---------- sections ---------- */
const SECTIONS=[
 {k:"player",l:"Player & phase",show:()=>true,meta:()=>plan.playerName?`Phase ${plan.phase} · ${plan.isFirst?"Initial":"Follow-up"}`:"Start here"},
 {k:"intake",l:()=>plan.isFirst?"Intake: forms & TPI":"Previous six weeks",show:()=>true,meta:()=>{const n=Object.keys(latestIntake(plan)).length;return plan.isFirst?(n?n+" form"+(n>1?"s":"")+" on file":"No forms yet"):(plan.review.progress?"Review written":"Review the last block")}},
 {k:"focus",l:"Focus & priorities",show:()=>true,meta:()=>`${plan.priorities.filter(p=>p.title).length} priorities`},
 {k:"habits",l:"Daily habits & weekly actions",show:()=>plan.include.habits,meta:()=>`${plan.habits.length} habits · ${plan.weekly.practice}/${plan.weekly.physical}/${plan.weekly.oncourse} per week`},
 {k:"practice",l:"Practice plan",show:()=>plan.include.practice,meta:()=>{const d=plan.practice.sessions.reduce((a,s)=>a+s.drills.length,0);return `${plan.practice.sessions.length} sessions · ${d} drills`}},
 {k:"oncourse",l:"On-course plan",show:()=>plan.include.oncourse,meta:()=>`${plan.oncourse.games.length} games`},
 {k:"physical",l:"Physical plan",show:()=>plan.include.physical,meta:()=>`${plan.physical.dayList.length} days built`},
 {k:"mobility",l:"Mobility",show:()=>plan.include.mobility,meta:()=>mobSummary(plan.mobility)||"Build the routine"},
 {k:"weight",l:"Weight tracking",show:()=>plan.include.weight,meta:()=>plan.weight.start?`${plan.weight.start} → ${plan.weight.target||"?"} ${plan.weight.unit}`:"Set baseline"},
 {k:"stats",l:"Performance stats",show:()=>plan.include.stats,meta:()=>`${plan.stats.length} KPIs`},
 {k:"recovery",l:"Sleep & recovery",show:()=>plan.include.recovery,meta:()=>`${plan.recovery.sleep||"?"}h target`},
 {k:"checkin",l:"Weekly check-in",show:()=>plan.include.checkin,meta:()=>`${plan.checkin.questions.length} questions · ${plan.checkin.day}`},
 {k:"export",l:"Review & export",show:()=>true,meta:()=>plan.status==="ready"?"Ready to send":"Draft"}
];
const visible=()=>SECTIONS.filter(s=>s.show());
const lab=s=>typeof s.l==="function"?s.l():s.l;

function renderRail(){
  const vs=visible();
  $("#pb-rail").innerHTML=`<h6>Build the plan</h6>`+vs.map((s,i)=>`<button type="button" data-sec="${s.k}" class="${s.k===section?"on":""}"><span class="n">${String(i+1).padStart(2,"0")}</span><span class="l">${esc(lab(s))}<small>${esc(s.meta())}</small></span></button>`).join("");
}
function renderWho(){
  $("#pb-who").innerHTML=plan?`<strong>${esc(plan.playerName||"New player")}</strong><span class="chip gold">Phase ${plan.phase}</span><span class="chip">${plan.isFirst?"Initial plan":"Follow-up · week "+reviewWeek(plan)+" review"}</span>${plan.status==="ready"?'<span class="chip ok">Ready</span>':""}`:"";
}
function go(k){section=k;render();PBMAIN.scrollTop=0}
function render(){renderWho();renderRail();const s=SECTIONS.find(x=>x.k===section);if(!s||!s.show())section="player";$("#pb-view").innerHTML=VIEWS[section]()+pager()}
function pager(){const vs=visible();const i=vs.findIndex(s=>s.k===section);const p=vs[i-1],n=vs[i+1];return `<div class="pager">${p?`<button class="btn ghost" type="button" data-sec="${p.k}">← ${esc(lab(p))}</button>`:"<span></span>"}${n?`<button class="btn gold" type="button" data-sec="${n.k}">${esc(lab(n))} →</button>`:""}</div>`}
function head(eyebrow,title,lede){const i=visible().findIndex(x=>x.k===section);eyebrow=String(i+1).padStart(2,"0")+" / "+eyebrow.replace(/^\d+ \/ /,"");return `<div class="eyebrow">${esc(eyebrow)}</div><h1>${title}</h1>${lede?`<p class="lede">${lede}</p>`:""}`}

const VIEWS={
player(){
  const p=plan;const end=addDays(p.startDate,p.weeks*7);
  const tog=(k,t,d)=>`<label class="tog"><input type="checkbox" data-b="include.${k}" data-t="bool"${p.include[k]?" checked":""}><span><b>${t}</b><small>${d}</small></span></label>`;
  return head("01 / Set up","Player & phase","Who the plan is for, which block it is, and what goes in it. Plans save automatically once there is a player name.")+
  `<div class="card"><div class="grid g2">
    ${T("playerName","Player name <em>*</em>","e.g. Paul Bruce")}
    <label class="f"><span>Player email <em>*</em></span><input type="email" data-b="playerEmail" value="${esc(p.playerEmail)}" placeholder="player@email.com"></label>
    <div class="full" id="pb-intakechip">${intakeChip()}</div>
    ${T("coach","Lead coach","Who is building this plan","","dl-coach")}
    <div class="f"><span>Is this their first six-week plan?</span><div class="seg"><button type="button" data-act="first" data-v="1" class="${p.isFirst?"on":""}">Yes · initial plan</button><button type="button" data-act="first" data-v="0" class="${!p.isFirst?"on":""}">No · follow-up</button></div></div>
  </div></div>
  <div class="card"><div class="grid g4">
    ${N("phase","Phase")}
    <label class="f"><span>Block starts</span><input type="date" data-b="startDate" value="${esc(p.startDate)}"></label>
    ${N("weeks","Weeks")}
    <div class="f"><span>Review</span><div class="computed">Week ${reviewWeek(p)} · ${fmtDate(end)}</div></div>
  </div><p class="hint">Block runs ${esc(blockLabel(p))}. Phase ${p.phase} covers weeks ${(p.phase-1)*p.weeks}–${reviewWeek(p)} of their coaching.</p></div>
  <div class="card"><div class="card-h"><h3>What should this plan include?</h3><span class="hint" style="margin:0">Focus and priorities are always in.</span></div>
  <div class="toggles">

intake(){return plan.isFirst?intakeInitial():intakeFollow()},
focus(){

practice(){

    ${T(`practice.sessions.${si}.warmup`,"Warm-up","")}

oncourse(){

physical(){

    <div class="pair pairhead"><span></span><span>Exercise</span><span>Type</span><span>Reps (blank = scheme)</span><span>Each side</span><span></span></div>
    <div class="stack" style="margin-top:6px">${d.pairs.map((pr,pi)=>{const L=String.fromCharCode(65+pi);return ["a","b"].map((s,j)=>`<div class="pair"><span class="lab">${L}${j+1}</span><input type="text" list="dl-ex" data-b="physical.dayList.${di}.pairs.${pi}.${s}.name" value="${esc(pr[s].name)}" placeholder="Exercise"><select data-b="physical.dayList.${di}.pairs.${pi}.${s}.type">${["Strength","Power","Accessory","Core","Stability","Mobility"].map(o=>`<option${pr[s].type===o?" selected":""}>${o}</option>`).join("")}</select><input type="text" data-b="physical.dayList.${di}.pairs.${pi}.${s}.reps" value="${esc(pr[s].reps)}" placeholder="${pr[s].type==="Power"?"3 x 5 @ 10":"12/10/8"}"><label class="check"><input type="checkbox" data-t="bool" data-b="physical.dayList.${di}.pairs.${pi}.${s}.each"${pr[s].each?" checked":""}> Each side</label>${j===1?del(`physical.dayList.${di}.pairs.${pi}`,"Remove superset"):"<span></span>"}</div>`).join("")}).join('<div style="height:4px"></div>')}</div>

  `<div class="card"><div class="grid g3">${N("physical.days","Days per week (same as section 4)")}${T("physical.structure","Structure")}${T("physical.rest","Rest")}
   ${T("physical.strength","Strength / hypertrophy loading","","span2")}${T("physical.power","Power / speed loading")}

   ${mismatch?`<div class="banner warn">You have ${ph.dayList.length} days built but ${ph.days} days per week set. Use <b>Replace with ${tplDays()}-day template</b> or add or remove days.</div>`:""}
   ${ui.confirmTpl?`<div class="banner warn">This replaces the ${ph.dayList.length} days below with the ${tplDays()}-day template. <button class="btn sm danger" type="button" data-act="tpl-phys" data-v="yes">Yes, replace</button> <button class="btn sm ghost" type="button" data-act="tpl-cancel">Cancel</button></div>`:""}
   <div class="row" style="margin-bottom:12px"><h2 style="margin:0">Training days</h2><span class="spacer"></span><button class="btn${ph.dayList.length?"":" gold"}" type="button" data-act="tpl-phys">${ph.dayList.length?"Replace with":"Load"} ${tplDays()}-day superset template</button><button class="btn sm" type="button" data-act="addday">+ Add day</button></div>${days||`<p class="hint">No days yet. Load the ${tplDays()}-day template to start from the standard structure, then swap exercises.</p>`}`;

mobility(){
  const m=plan.mobility,mode=m.mode||"random",fails=plan.intake.tpi.filter(t=>t.result&&t.result!=="Pass"),pool=mobPool(),auto=mode!=="manual";
  const chips=(key,vals)=>`<div class="chips">${vals.map(v=>{const on=(m[key]||[]).includes(v);return `<button type="button" data-act="mobchip" data-k="${key}" data-v="${esc(v)}" class="${on?"on":""}" aria-pressed="${on}">${esc(MOB_EQUIP_LABEL[v]||v)}</button>`}).join("")}</div>`;
  const vidRow=(v,act)=>`<div class="mobv"><div><b>${esc(v.name)}</b><div class="hint" style="margin:2px 0 0">${v.mins} min follow-along · ${esc(v.area)}${v.equip&&v.equip!=="No equipment"?" · "+esc(v.equip):""}</div></div>${act||""}</div>`;
  const seg=[["random","Random each day"],["time","Time each day"],["manual","Manual"]].map(([v,l])=>`<button type="button" data-act="mobmode" data-v="${v}" class="${mode===v?"on":""}">${l}</button>`).join("");
  let body="";

    <div class="f"><span>Body areas (none picked = any)</span></div>${chips("areas",MGLib.AREAS)}
    <div class="f" style="margin-top:14px"><span>Equipment they have (no-equipment videos are always included)</span></div>${chips("equip",MOB_EQUIP)}
    <div class="row" style="margin-top:14px;align-items:flex-end">${mode==="time"?N("mobility.minutes","Minutes each day"):N("mobility.count","Videos each day")}<span class="hint" style="margin:0 0 10px">${pool.length} follow-along videos of 3 minutes or more to pick from</span></div></div>
    <div class="card"><div class="card-h"><h3>Example day</h3>${tot?`<span class="chip">${tot} min</span>`:""}<span class="spacer"></span><button class="btn sm" type="button" data-act="mobshuffle"${pool.length?"":" disabled"}>Show another day</button></div>
    <div class="stack">${ex.length?ex.map(v=>vidRow(vidItem(v))).join(""):'<p class="hint">No videos match. Pick more areas or add equipment.</p>'}</div></div>`}
  else{const total=m.items.reduce((a,x)=>a+(+x.mins||0),0);
    const rows=m.items.map((x,i)=>x.kind==="video"?vidRow(x,`<div class="row" style="gap:0"><button class="btn sm ghost" type="button" data-act="mobswap" data-i="${i}">Swap</button>${mv("mobility.items."+i,-1)}${mv("mobility.items."+i,1)}${del("mobility.items."+i)}</div>`)
      :`<div class="listrow lr-mob">${T(`mobility.items.${i}.name`,i?"":"Follow-along video (from the app)","Start typing","","dl-mob")}${T(`mobility.items.${i}.dose`,i?"":"Dose","e.g. 2 x 8 each side")}${T(`mobility.items.${i}.area`,i?"":"Area","")}${T(`mobility.items.${i}.cue`,i?"":"Why","e.g. Lower quarter rotation fail")}<div style="padding-top:${i?0:20}px">${del("mobility.items."+i)}</div></div>`).join("");
    body=`<div class="card"><div class="card-h"><h3>Routine</h3>${total?`<span class="chip">${total} min of videos</span>`:""}<span class="spacer"></span><button class="btn sm" type="button" data-act="add" data-list="mobility.items">+ Add video</button></div><p class="hint" style="margin:0 0 10px">The same routine every day. Type any part of a name: every mobility video tagged Follow Along in the app is listed (foam roller, massage ball, band or no kit).</p><div class="stack">${rows||'<p class="hint">Nothing yet. Press Add video.</p>'}</div></div>`}
  return head("08 / Mobility","Mobility","Random videos each day, a set time each day made up of one or more videos, or a routine you build by hand.")+
  (fails.length?`<div class="card hl"><div class="card-h"><h3>TPI limitations on file</h3><span class="spacer"></span><button class="btn sm gold" type="button" data-act="mobsuggest">Use these body areas</button></div><div class="chips">${fails.map(f=>`<button type="button" class="on" tabindex="-1">${esc(f.test)} · ${esc(f.result)}</button>`).join("")}</div></div>`:"")+
  `<div class="card"><div class="grid g3">${S("mobility.frequency","Frequency",["Daily","5x per week","3x per week","Before every session","Before practice and training"])}${S("mobility.when","When",WHEN)}
    <div class="f"><span>Routine type</span><div class="seg">${seg}</div></div></div></div>`+
  `${ui.mobMsg?`<div class="banner">${esc(ui.mobMsg)}</div>`:""}`+body;

weight(){

function drillRow(si,di,d){
  const b=`practice.sessions.${si}.drills.${di}`,isGame=d.env!=="Technical";

/* ---------- checks ---------- */
function checks(){
  const p=plan,out=[];
  out.push([!!p.playerName.trim(),"Player name"]);
  out.push([/\S+@\S+\.\S+/.test(p.playerEmail),"Valid player email"]);
  out.push([!!p.focus.outcome.trim(),"Overall outcome written"]);
  out.push([p.priorities.some(x=>x.title.trim()),"At least one priority"]);
  if(!p.isFirst)out.push([!!p.review.progress.trim(),"Previous six weeks review written"]);
  if(p.include.practice){const d=p.practice.sessions.flatMap(s=>s.drills);out.push([d.length>0,"Practice sessions have drills or games"]);out.push([d.length>0&&d.every(x=>x.env==="Technical"?x.name.trim():(x.game||(x.newGame&&x.name.trim()))),"Every game is picked from the app or described"])}
  if(p.include.physical)out.push([p.physical.dayList.length>0&&p.physical.dayList.every(d=>d.pairs.every(pr=>pr.a.name&&pr.b.name)),"Physical days complete"]);
  if(p.include.mobility)out.push([!!mobSummary(p.mobility),"Mobility routine added"]);
  if(p.include.weight)out.push([!!p.weight.start,"Starting weight recorded"]);
  out.push([!!p.appCode,"Put in the player's app"]);
  return out;
}

/* Search-as-you-type for every input with a list (exercises, drills, habits, mobility, KPIs, TPI). Matches anywhere in the name,
   every word typed must appear ("press" finds "Dumbbell Bench Press"); names starting with the words come first.
   Replaces the browser's own list, which on Safari / iPhone only matches the start of the name. */
(function(){let box=null,inp=null,items=[],sel=-1;
  const opts=id=>{const dl=document.getElementById(id);return dl?[...dl.options].map(o=>o.value||o.textContent).filter(Boolean):[]};
  const hl=(t,ws)=>{let h=esc(t);ws.forEach(w=>{if(w)h=h.replace(new RegExp("("+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig"),"<b>$1</b>")});return h};
  function hide(){if(box){box.remove();box=null}items=[];sel=-1}
  function show(el){inp=el;const q=el.value.trim().toLowerCase(),ws=q.split(/\s+/).filter(Boolean),all=opts(el.dataset.sug);
    items=(ws.length?all.filter(o=>{const l=o.toLowerCase();return ws.every(w=>l.includes(w))}).sort((a,b)=>(b.toLowerCase().startsWith(q)?1:0)-(a.toLowerCase().startsWith(q)?1:0)):all).slice(0,40);
    if(!items.length||(items.length===1&&items[0].toLowerCase()===q)){hide();return}
    if(!box){box=document.createElement("div");box.id="pb-sug";document.body.appendChild(box);
      box.addEventListener("mousedown",e=>{const d=e.target.closest("[data-i]");if(d){e.preventDefault();pick(+d.dataset.i)}})}
    sel=-1;box.innerHTML=items.map((o,i)=>`<div data-i="${i}">${hl(o,ws)}</div>`).join("");place()}
  function place(){if(!box||!inp)return;const r=inp.getBoundingClientRect();box.style.left=r.left+"px";box.style.top=(r.bottom+2)+"px";box.style.width=Math.max(r.width,220)+"px"}
  function pick(i){const el=inp,v=items[i];if(!el||v==null)return;el.value=v;hide();el.dispatchEvent(new Event("input",{bubbles:true}));el.dispatchEvent(new Event("change",{bubbles:true}))}
  function mark(){[...box.children].forEach((d,i)=>d.classList.toggle("on",i===sel));const c=box.children[sel];if(c)c.scrollIntoView({block:"nearest"})}
  document.addEventListener("focusin",e=>{const el=e.target;if(!(el instanceof HTMLInputElement))return;
    if(el.hasAttribute("list")){el.dataset.sug=el.getAttribute("list");el.removeAttribute("list");el.setAttribute("autocomplete","off")}
    if(el.dataset.sug)show(el)});
  document.addEventListener("input",e=>{if(e.target.dataset&&e.target.dataset.sug&&e.isTrusted)show(e.target)});
  document.addEventListener("focusout",e=>{if(e.target===inp)setTimeout(hide,120)});
  document.addEventListener("keydown",e=>{if(!box||e.target!==inp)return;
    if(e.key==="ArrowDown"){sel=Math.min(items.length-1,sel+1);mark();e.preventDefault()}
    else if(e.key==="ArrowUp"){sel=Math.max(0,sel-1);mark();e.preventDefault()}
    else if(e.key==="Enter"&&sel>=0){e.preventDefault();pick(sel)}else if(e.key==="Escape")hide()});
  window.addEventListener("scroll",place,true);window.addEventListener("resize",place);
})();

function parseTPI(txt){

  String(txt||"").split(/\n+/).forEach(line=>{const l=line.trim();if(!l)return;
    if(/^tpi\b/i.test(l)){const d=l.match(/(\d{1,2}\s+[A-Za-z]{3,9}\s+\d{4}|\d{2}-\d{2}-\d{4}|\d{4}-\d{2}-\d{2})/);if(d)out.date=d[1];const h=l.match(/handicap\s*:?\s*(\d+)/i);if(h)out.handicap=h[1];const lv=l.match(/level\s*\d/i);if(lv)out.level=lv[0];return}

}

    if(draft&&draft.playerName){plan=normalise(draft);dirty=true;render();setStatus("Restored unsaved changes");save()}
    else{plan=newPlan();render();setStatus(plans.size+" plans · "+intakePeople().length+" players with forms");openDrawer()}
  }catch(x){pass="";err.textContent=/Wrong password/.test(x.message)?"Wrong password.":/Too many/.test(x.message)?x.message:"Couldn't open: "+x.message}
  btn.disabled=false;btn.textContent="Open";
});
window.addEventListener("beforeunload",e=>{if(dirty&&loggedIn){e.preventDefault();e.returnValue=""}});

})();
</script>

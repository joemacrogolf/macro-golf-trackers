<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* App homepage (VidApp first bottom tab, a website tab). Built to look like the original VidApp Home:
   big picture tiles, and tiles that open sub-categories (Testing Centre › the 3 tests; Practice › My Practice Plan and
   Games & Drills › Short Game / Long Game / Putting › the games; Train › My Training Plan). Sub-screens use #hash so the
   phone's back works. Two quick buttons at the top: Golf › Practice plan and Gym › Training plan (a signed-in MG Athlete gets 'My coach's plan' instead of the practice button); MG Athletes (MG logo tile, opens /my-plan) is the last tile. First-time players see a short
   "Start here" list that ticks itself off. The videos (drills, Training Library) stay in VidApp's Library tab. */
.ah{min-height:100vh;background:#0B0B0B;color:#F4F1EA;font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  padding:14px max(12px,env(safe-area-inset-right,0px)) calc(110px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));box-sizing:border-box}
.ah *{box-sizing:border-box}
.ah-in{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.ah a{color:inherit;text-decoration:none}
.ah a:focus-visible,.ah button:focus-visible{outline:3px solid #FFD900;outline-offset:2px}
.ah-logo{display:flex;justify-content:center;padding:4px 0 2px}.ah-logo img{height:44px;width:auto}
.ah-tile{display:block;position:relative;line-height:0;border-radius:14px;overflow:hidden;background:#141310;border:1px solid rgba(244,241,234,.07)}
.ah-tile img{width:100%;height:auto;display:block}
.ah-tile i{position:absolute;right:12px;bottom:12px;width:30px;height:30px;border-radius:50%;background:#FFD900;color:#0B0B0B;display:grid;place-items:center;font:700 18px/1 Inter,system-ui,sans-serif;font-style:normal}
.ah-tile.big{border:2px solid #FFD900}
/* quick buttons to the two plans, right at the top */
.ah-quick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ah-quick a{display:flex;flex-direction:column;justify-content:center;min-height:64px;padding:10px 14px;background:#FFD900;color:#0B0B0B!important;font:400 21px/1.02 Anton,Impact,sans-serif;text-transform:uppercase}
.ah-quick a small{font:700 11px Inter,system-ui,sans-serif;letter-spacing:1.6px;text-transform:uppercase;color:#3a3200}
.ah-quick a.ath{background:#F4F1EA}
.ah-top{display:flex;align-items:center;gap:10px;min-height:44px}
.ah-back{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px 0 8px;border:1px solid rgba(244,241,234,.22);background:#141310;color:#F4F1EA;font:600 15px Inter,system-ui,sans-serif;cursor:pointer}
.ah .ah-h{font-family:'Anton',Impact,sans-serif!important;font-weight:400!important;text-transform:uppercase;font-size:30px!important;line-height:1!important;margin:0!important;color:#F4F1EA!important}
.ah-k{font-weight:700;font-size:11.5px;letter-spacing:2.4px;text-transform:uppercase;color:#FFD900}
.ah .ah-p{margin:0!important;color:#c9c4b7;font-size:14px;line-height:1.5}
.ah-note{background:#171613;border-left:6px solid #3a3833;padding:12px 14px;color:#c9c4b7;font-size:13.5px;line-height:1.45}
/* start here */
.ah-start{background:#171613;border-left:6px solid #FFD900;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.ah-start .row{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid rgba(244,241,234,.1)}
.ah-start .n{width:30px;height:30px;display:grid;place-items:center;border:2px solid #FFD900;color:#FFD900;font:400 16px Anton,Impact,sans-serif}
.ah-start .row.done .n{background:#1f8a4c;border-color:#1f8a4c;color:#fff}
.ah-start b{font:400 16px/1.1 Anton,Impact,sans-serif;text-transform:uppercase}
.ah-start .go{font-weight:700;font-size:12.5px;color:#0B0B0B;background:#FFD900;padding:7px 10px;white-space:nowrap}
.ah-start .row.done .go{background:#2b2a25;color:#9C988C}
.ah-hide{align-self:flex-start;background:none;border:0;color:#9C988C;font:600 12px Inter,system-ui,sans-serif;text-decoration:underline;padding:6px 0 0;cursor:pointer}
</style>
<div class="ah"><div class="ah-in" id="ah"></div></div>
<script charset="utf-8" src="{{BASE}}src/day-streak.js"></script>
<script>
(function(){
var IMG="{{BASE}}assets/web/home/",W="https://www.macro.golf/";
function js(k,d){try{var v=JSON.parse(localStorage.getItem(k)||"null");return v==null?d:v}catch(e){return d}}
function tile(img,alt,href,view,cls){return '<a class="ah-tile'+(cls?" "+cls:"")+'" href="'+(href||"#"+view)+'"'+(href&&/my-numbers/.test(href)?' data-numbers="1"':'')+'><img src="'+IMG+img+'.jpg" alt="'+alt+'" loading="lazy"><i>›</i></a>'}
var G={short:["Short Game",[["game-fifty-ft-bank","50ft Bank","p-472096"],["game-par-18","Par 18","p-615974"],["game-wedge-darts","Wedge Darts","p-386417"]]],
  long:["Long Game",[["game-lava","Lava","p-740258"],["game-driver-corridor","Driver Corridor","p-937452"],["game-three-strikes","3 Strikes","p-863140"]]],
  putting:["Putting",[["game-money-stealers","Money Stealers","p-529063"],["game-insanity","Insanity","p-208731"],["game-hole-out","Hole Out","p-151044"]]]};
function state(){var R=js("macroResults",{})||{},rec=js("mgPracticePlan",null),P=rec&&rec.practice||{};
  return {test:Object.keys(R).some(function(k){return R[k]&&R[k].t})||Object.keys(P.tests||{}).some(function(k){return P.tests[k]&&P.tests[k].raw}),
    numbers:!!js("mg-home-numbers",false),plan:!!(P.plan&&P.plan.week&&P.plan.week.length)}}
function start(){var s=state();if(js("mg-home-start-hide",false)||(s.test&&s.numbers&&s.plan))return "";
  var rows=[[s.test,"Take your first test","#testing","Start"],[s.numbers,"See your numbers",W+"my-numbers","Open"],[s.plan,"Get your practice plan",W+"my-practice","Build"]];
  return '<div class="ah-start"><span class="ah-k">New here? Start here</span>'+rows.map(function(r,i){return '<a class="row'+(r[0]?" done":"")+'" href="'+r[2]+'"'+(i===1?' data-numbers="1"':'')+'><span class="n">'+(r[0]?"✓":i+1)+'</span><b>'+r[1]+'</b><span class="go">'+(r[0]?"Done":r[3])+'</span></a>'}).join("")+'<button type="button" class="ah-hide" data-hide="1">Hide this</button></div>'}
/* quick buttons: golf practice plan + gym training plan. An MG Athlete who has signed in on My Plan (localStorage mgplan:me,
   cleared when they log out there) gets their coach's plan in place of the practice plan button. */
function quick(){var m=js("mgplan:me",null),ath=m&&/^\d{6}$/.test(String(m.code||""));
  return '<div class="ah-quick">'+(ath?'<a class="ath" href="'+W+'my-plan"><small>MG Athlete</small>My coach\'s plan</a>':'<a href="'+W+'my-practice"><small>⛳ Golf</small>Practice plan</a>')+
    '<a href="'+W+'my-training"><small>🏋 Gym</small>Training plan</a></div>'}
function head(title,back){return '<div class="ah-top"><a class="ah-back" href="#'+(back||"")+'">‹ Back</a><h1 class="ah-h">'+title+'</h1></div>'}
var V={
 "":function(){return '<div class="ah-logo"><img src="{{BASE}}assets/web/home/header-performance.png" alt="Macro Golf Performance"></div>'+start()+
   quick()+
   tile("tile-numbers","My Numbers: your game in strokes gained",W+"my-numbers")+
   tile("tile-testing","Testing Centre: find where you lose shots",null,"testing")+
   tile("tile-practice","Practice: your practice plan and games",null,"practice")+
   tile("tile-train","Train: move better, swing faster",null,"train")+
   tile("tile-warmup","Warm up",W+"warm-up")+
   tile("tile-mg-athletes","MG Athletes: 1 to 1 coaching, your coach's plan",W+"my-plan")},
 testing:function(){return head("Testing Centre")+'<p class="ah-p">Three tests show where you gain and lose shots. Retest every 6 weeks.</p>'+
   tile("test-long-game","Long Game Test",W+"p-524617")+tile("test-short-game","Short Game Test",W+"p-791364")+tile("test-putting","Putting Test",W+"p-350829")},
 practice:function(){return head("Practice")+tile("inner-my-practice-plan","My Practice Plan",W+"my-practice")+tile("inner-games-drills","Games and drills",null,"games")},
 games:function(){return head("Games & Drills","practice")+tile("group-short-game","Short Game games",null,"g-short")+tile("group-long-game","Long Game games",null,"g-long")+tile("group-putting","Putting games",null,"g-putting")+
   '<div class="ah-note">The golf drill videos are in the <b style="color:#F4F1EA">Library</b> tab at the bottom of the app.</div>'},
 train:function(){return head("Train")+tile("inner-my-training-plan","My Training Plan",W+"my-training")+
   '<div class="ah-note">The Training Library videos are in the <b style="color:#F4F1EA">Library</b> tab at the bottom of the app.</div>'}};
Object.keys(G).forEach(function(k){V["g-"+k]=function(){return head(G[k][0],"games")+G[k][1].map(function(g){return tile(g[0],g[1],W+g[2])}).join("")}});
function render(){var v=(location.hash||"").replace(/^#/,"");if(!V[v])v="";document.getElementById("ah").innerHTML=V[v]()}
document.getElementById("ah").addEventListener("click",function(e){if(e.target.closest("[data-numbers]")){try{localStorage.setItem("mg-home-numbers","true")}catch(x){}}
  if(e.target.closest("[data-hide]")){try{localStorage.setItem("mg-home-start-hide","true")}catch(x){}render()}});
window.addEventListener("hashchange",function(){render();window.scrollTo(0,0)});
window.addEventListener("pageshow",render);
render();
})();
</script>

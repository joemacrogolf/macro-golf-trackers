<style>
.mgs-slot{display:flex;flex-direction:column;gap:10px}
.mgs-slot:empty{display:none}
.mgs-win{background:#0B0B0B;color:#F4F1EA;border-left:6px solid #FFD900;padding:14px;display:flex;gap:14px;align-items:flex-start}
.mgs-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.mgs-thumb{flex-shrink:0;width:84px;padding:0;border:0;background:transparent;cursor:pointer;transform:rotate(-3deg);margin-top:4px}
.mgs-thumb img{display:block;width:100%;height:auto;border:2px solid #FFD900;box-shadow:0 8px 18px rgba(0,0,0,.5)}
.mgs-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mgs-tag{background:#FFD900;color:#0B0B0B;font-weight:800;font-size:11px;letter-spacing:1.6px;text-transform:uppercase;padding:4px 8px}
.mgs-x{background:transparent;border:0;color:#9C988C;font:inherit;font-size:12px;font-weight:600;cursor:pointer;min-height:36px;padding:0 4px}
.mgs-big{font-family:'Anton',Impact,'Arial Narrow Bold',sans-serif;text-transform:uppercase;font-size:30px;line-height:1.02;color:#F4F1EA}
.mgs-big span{color:#FFD900}
.mgs-win p{margin:0;font-size:13.5px;color:#9C988C}
.mgs-go{border:0;background:#FFD900;color:#0B0B0B;font-family:'Anton',Impact,'Arial Narrow Bold',sans-serif;text-transform:uppercase;font-size:17px;padding:12px 14px;min-height:50px;cursor:pointer;margin-top:4px;white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:10px;animation:mgsPulse 1.8s ease-out 4}
@keyframes mgsPulse{0%{box-shadow:0 0 0 0 rgba(255,217,0,.75)}70%{box-shadow:0 0 0 14px rgba(255,217,0,0)}100%{box-shadow:0 0 0 0 rgba(255,217,0,0)}}
@media (prefers-reduced-motion:reduce){.mgs-go{animation:none}}
.mgs-sheet{position:fixed;inset:0;z-index:50;background:rgba(11,11,11,.97);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.mgs-sheet[hidden]{display:none!important}
.mgs-in{width:100%;max-width:440px;display:flex;flex-direction:column;gap:12px;color:#F4F1EA;font-family:'Inter',system-ui,sans-serif}
.mgs-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.mgs-hero{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.mgs-hero b{font-family:'Anton',Impact,sans-serif;font-weight:400;text-transform:uppercase;font-size:34px;line-height:1;color:#FFD900}
.mgs-hero p{margin:0;font-size:14px;color:#F4F1EA}
.mgs-close{background:transparent;border:1px solid rgba(244,241,234,.3);color:#F4F1EA;font:inherit;font-weight:600;font-size:14px;min-height:40px;padding:0 14px;cursor:pointer}
.mgs-prev{display:flex;justify-content:center}
.mgs-prev canvas,.mgs-prev img{display:block;max-width:100%;max-height:58vh;width:auto;height:auto;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.mgs-prev canvas{max-height:58vh}
.mgs-ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.mgs-photo{position:relative;background:#F4F1EA;color:#0B0B0B;font-family:'Anton',Impact,sans-serif;text-transform:uppercase;font-size:16px;padding:10px 14px;min-height:44px;display:inline-flex;align-items:center;cursor:pointer}
.mgs-photo input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.mgs-seg{display:inline-flex;border:1px solid rgba(244,241,234,.4)}
.mgs-seg button{background:transparent;border:0;color:#F4F1EA;font-family:'Anton',Impact,sans-serif;text-transform:uppercase;font-size:15px;padding:0 12px;min-height:42px;cursor:pointer}
.mgs-seg button[aria-pressed="true"]{background:#F4F1EA;color:#0B0B0B}
.mgs-hide{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:#9C988C;min-height:44px;cursor:pointer}
.mgs-hide[hidden]{display:none}
.mgs-hide input{width:20px;height:20px;accent-color:#FFD900}
.mgs-share{border:0;background:#FFD900;color:#0B0B0B;font-family:'Anton',Impact,sans-serif;text-transform:uppercase;font-size:22px;min-height:58px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px}
.mgs-apps{margin:-6px 0 0;text-align:center;font-size:12.5px;color:#9C988C}
.mgs-confetti{position:fixed;inset:0;pointer-events:none;z-index:60}
.mgs-save{background:transparent;border:1px solid rgba(244,241,234,.35);color:#F4F1EA;font-family:'Anton',Impact,sans-serif;text-transform:uppercase;font-size:17px;min-height:46px;cursor:pointer}
.mgs-st{margin:0;font-size:13px;color:#9C988C;min-height:1.2em}
.mgs-sheet :focus-visible,.mgs-win :focus-visible{outline:3px solid #FFD900;outline-offset:2px}
</style>

function shift(iso,n){var p=String(iso).split('-'),d=new Date(+p[0],+p[1]-1,+p[2]+n,12),m=d.getMonth()+1,dd=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(dd<10?'0':'')+dd}
function nice(iso){var p=String(iso).split('-');return new Date(+p[0],+p[1]-1,+p[2],12).toLocaleDateString('en-GB',{day:'numeric',month:'short'})}
function f1(n){return (Math.round(n*10)/10).toString()}
function unit(e){return (typeof wtInfo==='function'?wtInfo(e).u:'kg').toUpperCase()}
function pb(e,now,prev,minR){
  var ok=function(s){return s.w!=null&&s.r!=null&&s.r>=minR};now=now.filter(ok);prev=prev.filter(ok);if(!now.length||!prev.length)return null;
  var b=now.reduce(function(a,s){return (s.w>a.w||(s.w===a.w&&s.r>a.r))?s:a});
  var pm=prev.reduce(function(a,s){return Math.max(a,s.w)},0),first=prev[0];
  var nm=e.name,u=unit(e),bw=f1(b.w)+u+' × '+b.r;
  if(b.w>pm){var gain=b.w-first.w;return {score:(b.w-pm)/Math.max(pm,1),tag:'New PB',kick:'NEW PB',big:bw,bigHide:'PERSONAL BEST',title:nm.toUpperCase(),
    line:gain>0?('+'+f1(gain)+'kg since '+nice(first.date)):'Heaviest set yet',lineHide:'Heaviest set yet',
    mBig:escH(nm)+' <span>'+escH(f1(b.w)+' '+u.toLowerCase()+' × '+b.r)+'</span>',mText:gain>0?('Your heaviest set yet, '+f1(gain)+'kg up since '+nice(first.date)+'.'):'Your heaviest set yet.'}}
  var pr=prev.filter(function(s){return s.w===b.w}).reduce(function(a,s){return Math.max(a,s.r)},0);
  if(b.w===pm&&pr&&b.r>pr)return {score:(b.r-pr)/pr/3,tag:'Rep PB',kick:'REP PB',big:bw,bigHide:b.r+' REPS',title:nm.toUpperCase(),
    line:'Most reps yet at '+f1(b.w)+'kg',lineHide:'Most reps yet',mBig:escH(nm)+' <span>'+b.r+' reps</span>',mText:'Most reps you have done at '+f1(b.w)+'kg.'};
  return null}
function weekWin(n,who){return {tag:'Week complete',kick:'WEEK COMPLETE',big:'WEEK '+n,title:'EVERY SESSION DONE',line:who.line,mBig:'<span>Week '+n+'</span> complete',mText:who.text,who:who.who}}
function streakWin(k,who){return {tag:'Streak',kick:'STREAK',big:k+' WEEKS',title:'NOT ONE SESSION MISSED',line:who.line,mBig:'<span>'+k+' weeks</span> unbroken',mText:'Every planned session done for '+k+' weeks running.',who:who.who}}
function msWin(n,noun,who,line){return {tag:'Milestone',kick:'MILESTONE',big:String(n),title:noun.toUpperCase()+' DONE',line:line,mBig:'<span>'+n+'</span> '+noun+' done',mText:n+' '+noun+' into your plan. '+line+'.',who:who}}
return {init:function(o){for(var k in o)C[k]=o[k]},add:add,banners:banners,open:open,celebrate:celebrate,monday:monday,shift:shift,weeksBetween:weeksBetween,pb:pb,weekWin:weekWin,streakWin:streakWin,msWin:msWin,today:today,esc:escH,f1:f1};

<style>
/* Layout: one mobile-first column of stacked blocks — black hero, controls, live panel, superset cards, progress log. Single committed light look per the Macro Golf brand guide. */
:root{
  --ink:#0B0B0B; --yellow:#FFD900; --paper:#FFFFFF; --cream:#F4F1EA;
  --body:#3B3830; --muted:#77715F; --muted-dk:#9C988C; --olive:#8a7f00;
  --stone:#D6D1C5; --track:#E6E1D3;
  --hair:rgba(11,11,11,0.13); --border:rgba(11,11,11,0.18); --rule-dk:rgba(244,241,234,0.18);
  --display:'Anton',Impact,'Arial Narrow Bold',sans-serif;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--body);font-family:var(--sans);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.kick{font-family:var(--sans);font-weight:700;font-size:12px;letter-spacing:2.4px;text-transform:uppercase;line-height:1}
.disp{font-family:var(--display);text-transform:uppercase;letter-spacing:-0.3px;font-weight:400}
.bar{width:74px;height:6px;background:var(--yellow)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.tnum{font-variant-numeric:tabular-nums}

/* Hero */
.hero{background:var(--ink);color:var(--cream);padding:28px 24px 0}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.wordmark{font-family:var(--display);color:var(--yellow);font-size:22px;letter-spacing:0;line-height:.9;text-transform:uppercase}
.hero-top .kick{color:var(--muted-dk);font-size:11px;letter-spacing:3.2px}
.hero h1{font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:clamp(46px,13vw,76px);line-height:.94;letter-spacing:-1px;margin:16px 0 0;color:var(--cream);text-wrap:balance}
.hero .sub{font-family:var(--display);text-transform:uppercase;color:var(--yellow);font-size:clamp(22px,6vw,30px);line-height:1.06;margin-top:6px}

.strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--rule-dk);margin-top:26px}

.strip input,.strip select{width:100%;background:transparent;border:0;border-bottom:1px solid var(--rule-dk);color:var(--cream);font-family:var(--display);font-size:20px;text-transform:uppercase;padding:8px 0 6px;margin-top:6px;border-radius:0;appearance:none;-webkit-appearance:none}
.strip select{background-image:linear-gradient(45deg,transparent 50%,var(--cream) 50%),linear-gradient(135deg,var(--cream) 50%,transparent 50%);background-position:calc(100% - 10px) 55%,calc(100% - 5px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:20px}
.strip select option{color:var(--ink);background:var(--paper)}
.strip input::placeholder{color:#6d6a62}
.strip .val{font-family:var(--display);font-size:20px;text-transform:uppercase;margin-top:14px}

/* Phase toggle + day tabs */
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border:2px solid var(--ink)}

.seg button[aria-pressed="true"]{background:var(--ink)}
.seg button[aria-pressed="true"] .disp{color:var(--yellow)}
.seg button[aria-pressed="true"] .kick{color:var(--muted-dk)}
.days{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:6px}
.days button{border:1px solid var(--border);background:var(--paper);padding:10px 8px;cursor:pointer;text-align:left;border-top:3px solid var(--ink);min-height:44px}

.days button[aria-selected="true"] .kick{color:var(--ink)}

/* How to */
.how{border:1px solid var(--border);border-left:6px solid var(--yellow)}

/* Live panel */

/* Session header */

.dayhead .bar{margin:14px 0 0}
.sessbar{background:var(--ink);color:var(--cream);display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 18px}

.sessbar .kick{color:var(--muted-dk);font-size:11px;flex-shrink:0}

/* Superset block */
.block{border:1px solid var(--border);border-left:6px solid var(--ink)}
.block-head{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:var(--cream);border-bottom:1px solid var(--hair)}
.block-head .kick{color:var(--ink);font-size:11px}

.ex-top{display:flex;gap:14px;align-items:flex-start}
.tag{font-family:var(--display);font-size:15px;line-height:1;background:var(--yellow);color:var(--ink);padding:6px 0 7px;width:36px;text-align:center;flex-shrink:0}
.ex-name{flex:1;min-width:0}
.ex-name .disp{font-size:19px;line-height:1.15;color:var(--ink)}

.ex-name .type.power{color:var(--olive)}
.ex-note{font-size:13.5px;color:var(--body);margin:0}
.targets{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.tile{background:var(--cream);padding:6px 8px;min-width:46px}
.tile .n{font-family:var(--display);font-size:17px;line-height:1;color:var(--ink)}
.tile .l{font-weight:700;font-size:9.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);margin-top:4px}
.tile.y{background:var(--yellow)} .tile.y .l{color:var(--ink)}

/* Set rows */
.sets{width:100%;border-collapse:collapse}

.sets td.setno{width:68px}
.sets td.setno .disp{font-size:16px;color:var(--ink);line-height:1}
.sets td.setno .t{font-size:11px;font-weight:600;color:var(--muted);margin-top:3px;white-space:nowrap}
.sets input,.sets select{width:100%;min-width:0;height:44px;border:1px solid var(--border);background:var(--paper);padding:0 8px;font-family:var(--display);font-size:18px;color:var(--ink);border-radius:0}
.sets input::placeholder{color:#a7a294}
.sets select{appearance:none;-webkit-appearance:none;text-align:center;padding:0 4px}
.sets tr.done input,.sets tr.done select{background:var(--cream)}
.sets tr.done td.setno .disp{color:var(--olive)}
.rec{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px}
.rec .chip{font-weight:700;font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink);background:var(--yellow);padding:5px 8px;border:0;cursor:pointer;min-height:30px}
.rec .why{font-size:12.5px;color:var(--muted)}
.hint{font-size:13px;color:var(--muted);margin:0}

/* Focus + log */
.focus{border-top:2px solid var(--ink);padding-top:12px}
.focus .kick{color:var(--olive)}
.focus p{margin:8px 0 0;font-size:14.5px;color:var(--body);max-width:62ch}
.note{background:var(--cream);padding:12px 16px;display:flex;gap:16px;font-size:13.5px}

.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;padding:14px 18px;font-family:var(--display);font-size:18px;text-transform:uppercase;cursor:pointer;min-height:48px}
.btn.primary{background:var(--yellow);color:var(--ink);flex:1}
.btn.ghost{background:var(--paper);border:1px solid var(--border);color:var(--ink)}
.status{font-size:13px;color:var(--olive);font-weight:600;min-height:1.4em}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--cream);padding:10px 12px;font-size:14px;color:var(--ink)}
.logwrap{overflow-x:auto}
.log{width:100%;border-collapse:collapse;min-width:420px}
.log th{font-weight:700;font-size:10.5px;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted);text-align:center;padding:0 4px 8px;border-bottom:2px solid var(--ink)}
.log th:first-child,.log td:first-child{text-align:left}
.log td{text-align:center;padding:9px 4px;border-bottom:1px solid var(--hair);font-family:var(--display);font-size:16px;color:var(--ink)}
.log td .empty{display:inline-block;width:22px;height:22px;border:1px dashed var(--stone)}
.log td .tick{display:inline-block;background:var(--ink);color:var(--yellow);padding:3px 6px;font-size:13px}
.log tr.cur td{background:var(--cream)}
.foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--border);padding-top:10px;font-weight:600;font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted)}
.foot b{color:var(--ink)}
@media (max-width:480px){
  .hero{padding:24px 18px 0}
  .strip>div{padding-right:8px}.strip>div+div{padding-left:10px}
  .strip input,.strip select,.strip .val{font-size:17px}
  .ex-top{flex-wrap:wrap}.targets{width:100%;justify-content:flex-start;padding-left:50px}
  .sets td.setno{width:56px}
  .live{padding:18px 16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.wt{margin:0;font-size:12.5px;font-weight:600;color:var(--muted)}
</style>
